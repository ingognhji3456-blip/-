<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>순서 지휘자</title>
<meta name="description" content="아군도 적도 알아서 싸워요. 내가 할 수 있는 건 아군을 어느 자리에 세울지 정하는 것뿐인 진형 퍼즐.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 화면: 어두운 연주회장. 위쪽에 한 줄 전장, 아래쪽에 순서표(악보)와 단추. 금빛은 지휘자, 파랑은 아군, 빨강은 적. */
:root{
  color-scheme:dark;
  --bg:#0a0f1e; --bg2:#121a33; --panel:#141d38; --panel2:#1b2648; --line:#2a3762; --line2:#3b4b80;
  --text:#eef1fb; --muted:#a3acc9; --dim:#69739a;
  --gold:#ffd27a; --gold2:#ffb84d; --ally:#7fb2ff; --ally-bg:#16264d; --enemy:#ff8a7a; --enemy-bg:#3a1a24;
  --good:#8ff0b5; --bad:#ff6b6b; --heal:#8ff0b5;
  --font:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% -10%,#1d2a55 0%,var(--bg) 60%) fixed;color:var(--text);font-family:var(--font);-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.noselect,button,.tok,.tile{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:100dvh}
.screen.on{display:flex}
.hidden{display:none!important}

/* ---------- 공통 단추 ---------- */
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;min-height:46px;transition:transform .08s,background .15s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.primary{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1a00;border-color:#ffe2a6}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;padding:8px 12px;font-size:13px;border-radius:10px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);font-size:18px;cursor:pointer;display:grid;place-items:center;flex:none}

/* ---------- 첫 화면 ---------- */
#scr-title{padding:28px 16px calc(24px + var(--safe-b));gap:18px}
.logo{text-align:center;margin-top:8px}
.logo h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.5px;background:linear-gradient(180deg,#fff2cf,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .baton{font-size:40px;display:block;margin-bottom:6px;filter:drop-shadow(0 0 14px rgba(255,210,122,.45))}
.logo p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.6}
.stages{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stage-card{position:relative;text-align:left;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:14px;padding:12px 12px 10px;cursor:pointer;min-height:84px}
.stage-card .no{font-size:12px;color:var(--gold);font-weight:700}
.stage-card .nm{font-size:16px;font-weight:700;margin-top:2px}
.stage-card .foes{font-size:15px;margin-top:6px;letter-spacing:1px}
.stage-card .st{position:absolute;right:10px;top:10px;font-size:13px;color:var(--gold);letter-spacing:1px}
.stage-card .st .off{color:var(--dim)}
.stage-card.locked{opacity:.45;cursor:default}
.stage-card.locked .nm::after{content:" 🔒"}
.stage-card.next{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,210,122,.25),0 0 18px rgba(255,210,122,.15)}
.title-foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.total{text-align:center;color:var(--gold);font-weight:700}

/* ---------- 전투 화면 ---------- */
#scr-battle{padding-bottom:var(--safe-b)}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 10px 4px}
.topbar .ttl{flex:1;min-width:0;text-align:center}
.topbar .ttl b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 10px}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 4px;text-align:center;min-width:0}
.meter span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter b{font-size:15px}
.meter i{font-style:normal}
@media (max-width:360px){.wide-only{display:none}}
.nm .short,.tn .short{display:none}
@media (max-width:380px){.nm .full,.tn .full{display:none}.nm .short,.tn .short{display:inline}}
@media (max-height:640px){.topbar{padding-top:6px}.icon-btn{width:34px;height:34px;font-size:15px}.meter{padding:3px}.meter b{font-size:14px}.stage{min-height:180px}.info{min-height:0;font-size:12.5px;padding:7px 10px}.tile{min-height:54px;padding-top:11px}.actions{padding-top:8px}}
.meter.star span::before{content:"★ ";color:var(--gold)}
.meter.ok b{color:var(--good)}
.meter.over b{color:var(--bad)}
.meter.swaps.full b{color:var(--gold)}

.stage{position:relative;margin:6px 8px 0;flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end;min-height:230px;max-height:44vh;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:#1c2550;--ground:52px}
.stage .scene{position:absolute;left:0;right:0;top:0;bottom:calc(var(--ground) - 2px);width:100%;height:calc(100% - var(--ground) + 2px);object-fit:cover;object-position:50% 100%;image-rendering:pixelated;pointer-events:none}
.stage .ground{position:absolute;left:0;right:0;bottom:0;height:var(--ground);pointer-events:none;background:linear-gradient(180deg,var(--grass1,#5c8a48) 0 3px,var(--grass2,#3f6a35) 3px 6px,transparent 6px),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 3px,transparent 3px 9px),linear-gradient(180deg,var(--dirt1,#4a3a2a),var(--dirt2,#2b2219))}
.stage.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
#arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}
.fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.fx>*{position:absolute;left:0;top:0}
.field{display:flex;align-items:flex-end;justify-content:center;gap:2px;position:relative;z-index:3;padding:0 4px 4px}
.clash{flex:0 0 8px;align-self:stretch}
.tok{flex:0 1 84px;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;outline:none}
.tok .ord{min-width:20px;height:20px;padding:0 5px;border-radius:10px;font-size:12px;font-weight:900;line-height:20px;text-align:center;background:var(--gold);color:#2a1a00;box-shadow:0 2px 6px rgba(0,0,0,.45);margin-bottom:3px}
.tok.done .ord{background:#555c74;color:#c9cde0}
.tok .hpw{width:68%;max-width:48px;display:flex;align-items:center;gap:3px;margin-bottom:2px}
.hpbar{flex:1;height:5px;border-radius:2px;background:#000a;overflow:hidden;box-shadow:0 0 0 1px #0008}
.hpbar i{display:block;height:100%;transition:width .3s}
.tok.ally .hpbar i{background:linear-gradient(#a8ccff,#5b8ee8)}
.tok.enemy .hpbar i{background:linear-gradient(#ffb0a4,#e0574a)}
.hpn{font-size:10px;color:#e6e9f5;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.tok .body{position:relative;width:100%;display:flex;justify-content:center;align-items:flex-end}
.tok .spr{display:block;width:100%;height:auto;image-rendering:pixelated;transform-origin:50% 100%;animation:idle 2.8s ease-in-out infinite;animation-delay:var(--d,0s);position:relative;z-index:1}
.tok.big .spr{width:125%;margin:0 -12.5%}
.tok.enemy .spr{scale:-1 1}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px) scaleY(1.012)}}
.tok .shadow{position:absolute;left:20%;right:20%;bottom:-3px;height:7px;border-radius:50%;background:rgba(0,0,0,.4)}
.tok .ring{position:absolute;left:6%;right:6%;bottom:-6px;height:12px;border-radius:50%;border:2px solid transparent}
.tok.focus .ring{border-color:var(--gold);box-shadow:0 0 10px rgba(255,210,122,.8)}
.tok.sel .ring{border-color:#fff;border-style:dashed}
.tok.acting .ring{border-color:var(--gold);background:rgba(255,210,122,.3)}
.tok .tag{position:absolute;top:2px;right:6%;z-index:2;font-size:10px;font-weight:900;background:#000a;border-radius:6px;padding:0 3px;line-height:14px;color:#fff}
.tok .nm{margin-top:7px;font-size:clamp(9.5px,3vw,12px);letter-spacing:-.3px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-shadow:0 1px 2px #000,0 0 3px #000}
.tok.ally .nm{color:#b9d3ff}
.tok.enemy .nm{color:#ffc0b6}
.tok .intent{font-size:clamp(10px,1.35vh,12px);height:18px;line-height:18px;padding:0 4px;margin-top:2px;border-radius:6px;background:#000b;white-space:nowrap;max-width:100%;overflow:hidden;display:flex;align-items:center;gap:1px}
.intent .mini,.mini{width:15px;height:15px;image-rendering:pixelated;vertical-align:middle;flex:none}
.tok.enemy .intent .mini.ally,.mini.ally{scale:1 1}
.mini.enemy{scale:-1 1}
.intent.ally-hit{color:#ffb3a8}
.intent.heal{color:var(--heal)}
.intent.guard{color:var(--gold)}
.hpbar{position:relative}
.hpbar b{position:absolute;top:0;bottom:0;left:0;width:0;background:repeating-linear-gradient(135deg,#ff4d4d 0 3px,#8a1010 3px 6px);transition:left .25s,width .25s}
.tok .ord{background:#3b5fb0;color:#fff}
.tok.enemy .ord{background:#a8443c;color:#fff}
.tok.slot1 .ord{box-shadow:0 0 0 2px var(--gold),0 2px 6px rgba(0,0,0,.45)}
.tok .fuse{position:absolute;left:50%;top:-4px;transform:translateX(-50%);z-index:3;font-size:10px;font-weight:900;background:#3a1a10;color:#ffcf66;border:1px solid #ff9a3a;border-radius:6px;padding:0 4px;line-height:15px;white-space:nowrap}
.tok .doom{display:none;position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);z-index:4;color:#ff4d4d;font-size:22px;font-weight:900;text-shadow:0 0 4px #000,0 0 8px #ff4d4d;pointer-events:none}
.tok.doom .doom{display:block;animation:doompulse 1s ease-in-out infinite}
.tok.ally.doom .spr{filter:drop-shadow(0 0 4px #ff4d4d)}
@keyframes doompulse{0%,100%{opacity:.4}50%{opacity:1}}
.tok.sel .body{transform:translateY(-6px)}
.intent.idle{color:#9aa3bf}
.info .warn{color:#ff8a80;font-weight:700}
.tok.done .spr{filter:saturate(.45) brightness(.75)}
.tok.hurt .spr{filter:brightness(1.8) saturate(.2) drop-shadow(0 0 3px #ff5050)}
.tok.gone{pointer-events:none}
.tok.gone .body{opacity:0;transform:translate(-6px,8px) rotate(-75deg);transition:transform .5s cubic-bezier(.5,0,.9,.5),opacity .45s .12s}
.tok.enemy.gone .body{transform:translate(6px,8px) rotate(75deg)}
.tok.gone.boomfx .body{transform:scale(1.7);opacity:0;transition:transform .22s ease-out,opacity .22s}
.tok.gone .ord,.tok.gone .hpw,.tok.gone .nm,.tok.gone .intent,.tok.gone .ring,.tok.gone .shadow{opacity:0;transition:opacity .3s}
.tok .dome{position:absolute;left:-6%;right:-6%;bottom:-5px;height:112%;border-radius:50% 50% 14px 14px;border:2px solid rgba(255,214,120,.95);background:radial-gradient(ellipse at 50% 25%,rgba(255,236,160,.35),rgba(255,210,122,.06) 70%);box-shadow:0 0 14px rgba(255,210,122,.65);z-index:2;pointer-events:none;animation:domein .3s ease-out}
@keyframes domein{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.float{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-weight:900;font-size:18px;pointer-events:none;z-index:7;text-shadow:0 2px 0 #000,0 0 4px #000;animation:floatup .9s forwards;white-space:nowrap}
.float.dmg{color:#ff7a6e}.float.heal{color:#9ff5bf}.float.info{color:var(--gold);font-size:13px}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-28px) scale(1)}}
.fx .burst{width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,#ffe066 36%,#ff8a2a 58%,rgba(255,80,20,0) 72%)}
.fx .ring2{width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #ffd27a}
.fx .bit{width:4px;height:4px;margin:-2px 0 0 -2px;background:#ffb84d}
.fx .smoke{width:24px;height:16px;margin:-8px 0 0 -12px;border-radius:50%;background:rgba(214,214,232,.55)}
.fx .orb{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(circle,#fff 0 25%,#b9ffcf 40%,rgba(143,240,181,0) 72%)}
.fx .spark{width:4px;height:4px;margin:-2px 0 0 -2px;background:#c8ffd9;box-shadow:0 0 4px #8ff0b5}
.fx .slash,.fx .shot{margin:0;transform-origin:50% 50%}
.msg{position:absolute;left:8px;right:8px;top:8px;min-height:22px;text-align:center;font-size:14px;color:var(--gold);font-weight:700;z-index:7;text-shadow:0 1px 0 #000,0 0 6px #000;pointer-events:none}
.msg.fail{color:var(--bad)}

.info{margin:8px 8px 0;padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;line-height:1.55;min-height:62px;color:var(--muted)}
.info b{color:var(--text)}
.info .who{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.info .sidep{font-size:11px;padding:1px 6px;border-radius:6px}
.info .sidep.A{background:var(--ally-bg);color:var(--ally)}
.info .sidep.E{background:var(--enemy-bg);color:var(--enemy)}
.info .now{color:var(--gold)}

.orderbar{margin:8px 8px 0;padding:8px 6px 10px;border-radius:14px;background:linear-gradient(180deg,#1a2347,#131b38);border:1px solid var(--line2)}
.ob-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 6px;font-size:12px;color:var(--muted)}
.ob-head b{color:var(--text);font-size:13px}
.ob-dir{letter-spacing:.5px}
.tiles{display:grid;gap:5px;justify-content:center;grid-template-columns:repeat(var(--n,7),minmax(0,70px))}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:clamp(60px,8.5vh,78px);padding:12px 1px 4px;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s,opacity .2s}
.tile.ally{border-color:#35558f;background:linear-gradient(180deg,#1d3263,#162447)}
.tile.enemy{border-color:#7a3a44;background:linear-gradient(180deg,#4a2030,#2d1622)}
.tile .tag{position:absolute;right:-7px;top:-3px;font-size:10px;font-weight:900;background:#000b;border-radius:6px;padding:0 3px;line-height:14px;color:#fff}
.tile .no{position:absolute;top:2px;left:5px;font-size:11px;font-weight:900;color:var(--gold)}
.tile .ic{line-height:0;position:relative}
.tile .pic{width:clamp(30px,4.6vh,42px);height:clamp(30px,4.6vh,42px);image-rendering:pixelated}
.pic.enemy,.cface.enemy,.uface.enemy,.fullspr.enemy{scale:-1 1}
.stage-card .foes{display:flex;gap:2px}
.cface{width:30px;height:30px;image-rendering:pixelated;background:#0003;border-radius:6px}
.uface{width:40px;height:40px;image-rendering:pixelated;background:#0003;border-radius:8px}
.fullspr{image-rendering:pixelated;vertical-align:bottom}
.lineup{align-items:flex-end;flex-wrap:nowrap;--u:min(10.5vw,48px)}
.lineup span{display:flex;align-items:flex-end;gap:0}
.lineup .vs{margin:0 4px 10px}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:0;--u:min(12vw,58px);margin:4px auto 0;padding:0 6px 6px;border-bottom:3px solid #4f7a45;width:max-content;max-width:100%}
.hero .gap{width:min(6vw,30px)}
.tile .tn{font-size:clamp(10.5px,1.35vh,12.5px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.sel{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 6px 16px rgba(255,210,122,.25)}
.tile.moved{box-shadow:0 0 0 2px rgba(255,210,122,.35) inset}
.tile.now{border-color:var(--gold);box-shadow:0 0 14px rgba(255,210,122,.55)}
.tile.done{opacity:.45}
.tile.dead{opacity:.25}
.tile.dead .ic::after{content:"✕";position:absolute;inset:0;color:var(--bad);font-size:22px;font-weight:900;display:grid;place-items:center;line-height:1}
.tile.nope{animation:hitfx .35s}

.actions{display:flex;gap:8px;padding:10px 8px calc(10px + var(--safe-b))}
.actions .btn{flex:1}
.actions .btn.primary{flex:1.4}

/* ---------- 모달, 안내 ---------- */
.modal{position:fixed;inset:0;background:rgba(4,7,16,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:600px;max-height:92dvh;overflow:auto;background:linear-gradient(180deg,#1b2650,#121a35);border:1px solid var(--line2);border-bottom:none;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + var(--safe-b));animation:up .22s ease-out}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:20px;border-bottom:1px solid var(--line2)}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:21px}
.sheet h3{margin:16px 0 6px;font-size:15px;color:var(--gold)}
.sheet p{margin:6px 0;color:var(--muted);font-size:14px;line-height:1.6}
.sheet .row{display:flex;gap:8px;margin-top:14px}
.sheet .row{flex-wrap:wrap}
.sheet .row .btn{flex:1}
.sheet .row .btn.wide{flex-basis:100%}
.lineup{display:flex;align-items:center;justify-content:center;gap:4px;font-size:24px;margin:10px 0 2px;flex-wrap:wrap}
.lineup .vs{font-size:13px;color:var(--gold);margin:0 6px}
.cards{display:flex;flex-direction:column;gap:6px}
.ucard{display:flex;gap:10px;align-items:flex-start;background:#0003;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ucard .ic{font-size:26px;line-height:1.1}
.ucard b{font-size:14px}
.ucard small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.ucard .stat{color:var(--dim);font-size:11.5px}
.goals{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.goals li{background:#0003;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;display:flex;gap:8px;align-items:center}
.goals li .s{color:var(--gold);font-size:16px}
.goals li.no .s{color:var(--dim)}
.goals li.yes{border-color:#3d7a5c}
.goals li .v{margin-left:auto;color:var(--muted);font-size:13px}
.party{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard{text-align:left;border:2px solid var(--line2);background:#0003;border-radius:12px;padding:10px;cursor:pointer}
.pcard.on{border-color:var(--gold);background:rgba(255,210,122,.08)}
.pcard .ic{font-size:24px}
.pcard b{display:block;font-size:14px;margin-top:2px}
.pcard small{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin-top:2px}
.bigstars{font-size:40px;text-align:center;letter-spacing:6px;color:var(--gold);margin:6px 0}
.bigstars .off{color:#3a4466}
.reason{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);border-radius:12px;padding:10px 12px;color:#ffd0d0!important}
.hint{background:rgba(255,210,122,.08);border:1px solid rgba(255,210,122,.35);border-radius:12px;padding:10px 12px;color:#ffe6b5!important}
.rules li{margin:4px 0;color:var(--muted);font-size:14px;line-height:1.6}
.rules b{color:var(--text)}

#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,24px);opacity:0;visibility:hidden;transition:transform .25s,opacity .25s,visibility .25s;background:#1f2b57;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;transition:transform .25s;max-width:92vw;text-align:center;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.coach{position:fixed;z-index:40;pointer-events:none;max-width:280px;background:#fff6dd;color:#2a1a00;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.coach::after{content:"";position:absolute;left:var(--ax,50%);width:12px;height:12px;background:#fff6dd;transform:translateX(-50%) rotate(45deg)}
.coach.below::after{top:-6px}
.coach.above::after{bottom:-6px}
.coach.dismiss{pointer-events:auto;cursor:pointer}
.coach .tap{display:block;margin-top:4px;font-size:12px;color:#8a6a20}
</style>

<div id="app">
  <section id="scr-title" class="screen on">
    <div class="logo">
      <div class="hero" id="hero" aria-hidden="true"></div>
      <h1>순서 지휘자</h1>
      <p>아군도 적도 알아서 싸워요.<br>내가 할 수 있는 건 <b>아군을 어느 자리에 세울지</b> 정하는 것뿐이에요.</p>

  </section>

      <div class="ground"></div>
      <div class="msg" id="msg"></div>
      <svg id="arrows" aria-hidden="true"></svg>
      <div class="field" id="field"></div>
      <div class="fx" id="fx"></div>
    </div>
    <div class="info" id="info"></div>
    <div class="actions" id="act-plan">
      <button class="btn small" id="a-undo" aria-label="지난 마디로 되돌리기">↶ 지난 마디</button>
      <button class="btn small" id="a-reset" aria-label="자리를 마디 시작 때로">↺ 처음대로</button>
      <button class="btn primary" id="a-go">시작 ▶</button>
    </div>
    <div class="actions hidden" id="act-play">
      <button class="btn" id="a-speed">2배속</button>
      <button class="btn" id="a-skip">건너뛰기 ⏭</button>
    </div>
  </section>

const UNITS = {
  '기사':     { side: 'A', hp: 10, pow: 3, habit: 'melee',   fuse: 0 },
  '궁수':     { side: 'A', hp: 5,  pow: 2, habit: 'archer',  fuse: 0 },
  '사제':     { side: 'A', hp: 6,  pow: 3, habit: 'mend',    fuse: 0 },
  '방패병':   { side: 'A', hp: 12, pow: 0, habit: 'guard',   fuse: 0 },
  '고블린':   { side: 'E', hp: 6,  pow: 3, habit: 'reach2',  fuse: 0 },
  '해골궁수': { side: 'E', hp: 3,  pow: 3, habit: 'weakest', fuse: 0 },
  '폭탄벌레': { side: 'E', hp: 3,  pow: 4, habit: 'bomb',    fuse: 2 },
  '주술사':   { side: 'E', hp: 4,  pow: 2, habit: 'heal',    fuse: 0 },
  '트롤':     { side: 'E', hp: 14, pow: 4, habit: 'cleave',  fuse: 0 },
};

/* 상태 = { A: 아군 id (앞→뒤), E: 적 id (앞→뒤), hp: {id: 체력}, fuse: {폭탄 id: 남은 도화선}, names: {id: 이름} }.
   아군 id = 'a' + 처음 자리, 적 id = 'e' + 처음 자리. */
function makeState(allies, enemies) {
  const names = {}, hp = {}, fuse = {};
  const A = allies.map((n, i) => { const id = 'a' + i; names[id] = n; return id; });
  const E = enemies.map((n, i) => { const id = 'e' + i; names[id] = n; return id; });
  for (const id of A.concat(E)) hp[id] = UNITS[names[id]].hp;
  for (const id of E) if (UNITS[names[id]].habit === 'bomb') fuse[id] = UNITS[names[id]].fuse;
  return { A, E, hp, fuse, names };
}
function cloneState(s) { return { A: s.A.slice(), E: s.E.slice(), hp: Object.assign({}, s.hp), fuse: Object.assign({}, s.fuse), names: s.names }; }
function unitOf(s, id) { return UNITS[s.names[id]]; }

/* 지금 자리에서 이 자리(to)까지 필요한 최소 바꾸기 횟수 (= 사람 수 − 순환 수). */
function swapDistance(from, to) {
  const pos = {}; from.forEach((id, i) => { pos[id] = i; });
  const seen = new Array(to.length).fill(false);
  let cycles = 0;
  for (let i = 0; i < to.length; i++) {
    if (seen[i]) continue;
    cycles++;
    let j = i;
    while (!seen[j]) { seen[j] = true; j = pos[to[j]]; }
  }
  return to.length - cycles;
}

/* 자리 A(앞→뒤)에서 모두가 할 일. 대상은 마디 시작 때의 자리와 체력으로 정해요. */
function planActions(s, A) {
  const E = s.E, hp = s.hp, U = id => unitOf(s, id), acts = [];
  const guard = A.length && U(A[0]).habit === 'guard' ? A[0] : null;
  A.forEach((u, i) => {
    const h = U(u).habit;
    if (h === 'melee') acts.push(i === 0 && E.length ? { u, kind: 'hit', targets: [E[0]], n: U(u).pow } : { u, kind: 'idle', targets: [], n: 0 });
    else if (h === 'archer') acts.push(i > 0 && E.length ? { u, kind: 'shoot', targets: [E[E.length - 1]], n: U(u).pow } : { u, kind: 'idle', targets: [], n: 0 });
    else if (h === 'mend') {
      const near = [i > 0 ? A[i - 1] : null, u, i + 1 < A.length ? A[i + 1] : null].filter(Boolean);
      let t = null;
      for (const x of near) if (hp[x] < U(x).hp && (t === null || U(x).hp - hp[x] > U(t).hp - hp[t])) t = x;
      acts.push(t ? { u, kind: 'heal', targets: [t], n: U(u).pow } : { u, kind: 'rest', targets: [], n: 0 });
    } else if (h === 'guard') acts.push(i === 0 ? { u, kind: 'guard', targets: [u], n: 0 } : { u, kind: 'idle', targets: [], n: 0 });
  });
  E.forEach((u, i) => {
    const h = U(u).habit;
    if (h === 'reach2') acts.push(i <= 1 && A.length ? { u, kind: 'hit', targets: [guard || A[0]], n: U(u).pow } : { u, kind: 'idle', targets: [], n: 0 });
    else if (h === 'weakest') {
      if (A.length) { let t = A[0]; for (const x of A) if (hp[x] < hp[t]) t = x; acts.push({ u, kind: 'shoot', targets: [guard || t], n: U(u).pow }); }
    } else if (h === 'cleave') acts.push(i === 0 && A.length ? { u, kind: 'cleave', targets: A.slice(0, 2), n: U(u).pow } : { u, kind: 'idle', targets: [], n: 0 });
    else if (h === 'heal') {
      let t = null;
      for (const x of E) if (hp[x] < U(x).hp && (t === null || U(x).hp - hp[x] > U(t).hp - hp[t])) t = x;
      acts.push(t ? { u, kind: 'heal', targets: [t], n: U(u).pow } : { u, kind: 'rest', targets: [], n: 0 });
    } else if (h === 'bomb') acts.push({ u, kind: 'fuse', targets: [], n: 0 });
  });
  return acts;
}

/* 한 마디. 반환 { state, result: 'win'|'lose'|null, log, acts, booms: [{u, targets}], dead: [...], after: {id: 체력(0 이하 포함)} } */

    else if (a.kind === 'heal') heal[a.targets[0]] += a.n;
    log.push(`${N(a.u)} ${a.kind}` + (a.targets.length && a.n ? ` → ${a.targets.map(N).join(',')} ${a.n}` : ''));

/* ---------- 판 시작 카드 ---------- */

/* ---------- 전투 상태 ---------- */
let G = null;           // 지금 판
let speed = 1, skipping = false, skipWake = null;

function startBattle(n) {
  const b = BATTLES[n - 1], party = b.parties[0];
  const s = makeState(party.allies, b.enemies);
  // 같은 이름이 둘 이상이면 처음 자리(앞→뒤)로 가·나·다 표시를 붙여요.
  const tags = {};
  for (const ids of [s.A, s.E]) {
    const byName = {};
    for (const id of ids) (byName[s.names[id]] = byName[s.names[id]] || []).push(id);
    for (const nm of Object.keys(byName)) if (byName[nm].length > 1) byName[nm].forEach((id, i) => { tags[id] = TAGS[i]; });
  }
  G = { n, b, party, tags, state: s, round: 1, movesBefore: 0, start: s.A.slice(), form: s.A.slice(), sel: null, focus: null, history: [], playing: false, fails: 0 };
  show('scr-battle');
  $('b-title').textContent = `${n}. ${b.title}`;
  applyTheme(n);
  clearArrows();
  buildField();
  renderAll();
  requestAnimationFrame(() => { placeGround(); if (G && !G.playing) renderPlan(); });
  tutorial('start');
}

const dn = id => G.state.names[id] + (G.tags[id] ? `(${G.tags[id]})` : '');
const nameOf = id => G.state.names[id];
const lostOf = hp => G.party.allies.reduce((t, a, i) => t + UNITS[a].hp - Math.max(0, hp['a' + i] || 0), 0);
const usedNow = () => swapDistance(G.start, G.form);
const sideOf = id => UNITS[nameOf(id)].side;
const isAttack = k => k === 'hit' || k === 'shoot' || k === 'cleave';

const HABIT_TEXT = {

function actText(a) {
  if (!a) return '';

  if (a.kind === 'hit') return `${t}에게 ${a.n}`;
  if (a.kind === 'shoot') return `${t}에게 화살 ${a.n}`;

  if (a.kind === 'heal') return `${t}${eulreul(nameOf(a.targets[0]))} ${a.n} 회복`;

  if (a.kind === 'guard') return '방패를 들어 화살과 칼을 대신 맞아요';

  if (h === 'archer') return '맨 앞이라 활을 못 쏴요';

/* ---------- 전장 그리기 ---------- */
function tokEl(id) { return $('field').querySelector(`.tok[data-id="${id}"]`); }
function buildField() {
  const f = $('field');

  const c = document.createElement('div'); c.className = 'clash'; c.dataset.id = 'clash'; f.appendChild(c);

}
function makeTok(id) {

}
function arrangeAllies() {
  const f = $('field');
  flip(f, () => { const clash = f.querySelector('.clash'); for (const id of G.form.slice().reverse()) { const el = tokEl(id); if (el) f.insertBefore(el, clash); } });
}
/* view: { A, E, hp, live, pv(계획 중일 때 미리보기) } */
function updateField(view) {
  for (const el of $('field').querySelectorAll('.tok')) {
    const id = el.dataset.id;
    if (!view.live.has(id)) {
      if (!el.classList.contains('gone')) {
        el.classList.add('gone');
        animator.remove(id);
        setTimeout(() => { if (el.isConnected && el.classList.contains('gone')) flip($('field'), () => el.remove()); }, 600);
      }
      continue;
    }
    const max = UNITS[nameOf(id)].hp, hp = Math.max(0, view.hp[id]);
    el.querySelector('.hpbar i').style.width = (100 * hp / max) + '%';
    const ghost = el.querySelector('.hpbar b');
    const ord = el.querySelector('.ord');
    const k = sideOf(id) === 'A' ? view.A.indexOf(id) : view.E.indexOf(id);
    ord.textContent = k >= 0 ? `${k + 1}` : '';
    el.classList.toggle('slot1', k === 0);
    const fz = el.querySelector('.fuse');
    if (id in G.state.fuse && view.live.has(id)) { fz.textContent = `도화선 ${G.state.fuse[id]}`; fz.style.display = ''; } else fz.style.display = 'none';
    if (view.pv) {
      const after = view.pv.after[id], aft = Math.max(0, Math.min(max, after));
      ghost.style.left = (100 * Math.min(aft, hp) / max) + '%';
      ghost.style.width = (100 * Math.max(0, hp - aft) / max) + '%';
      el.querySelector('.hpn').textContent = after < hp ? `${hp}→${Math.max(0, after)}` : (after > hp ? `${hp}→${aft}` : String(hp));
      el.classList.toggle('doom', after <= 0);
      el.classList.toggle('focus', G.focus === id);
      el.classList.toggle('sel', G.sel === id);
      const a = view.pv.acts.find(x => x.u === id);
      const c = actChip(a), chip = el.querySelector('.intent');
      chip.innerHTML = c.html; chip.className = 'intent ' + c.cls; chip.style.visibility = c.html ? 'visible' : 'hidden';
      if (id in G.state.fuse && view.pv.booms.some(b => b.u === id)) fz.textContent = '이번에 펑!';
    } else {
      ghost.style.width = '0';
      el.querySelector('.hpn').textContent = String(hp);
      el.classList.remove('doom', 'focus', 'sel');
      el.querySelector('.intent').style.visibility = 'hidden';
    }
  }
}

/* ---------- 화살표 ---------- */
function flip(container, mutate) {
  const before = new Map();
  for (const el of container.children) if (el.dataset.id) before.set(el.dataset.id, el.getBoundingClientRect());
  mutate();
  if (reduceMotion) return;
  for (const el of container.children) {
    const b = before.get(el.dataset.id); if (!b) continue;
    const a = el.getBoundingClientRect();
    const dx = b.left - a.left, dy = b.top - a.top;
    if (dx || dy) el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'translate(0,0)' }], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
}
function clearArrows() { $('arrows').innerHTML = ''; }
function drawArrows(list) {
  const svg = $('arrows'), R = $('stage').getBoundingClientRect();
  let html = `<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>`;
  for (const a of list) {
    const fe = tokEl(a.from), te = tokEl(a.to);
    if (!fe || !te) continue;
    const fr = fe.querySelector('.spr').getBoundingClientRect(), tr = te.querySelector('.spr').getBoundingClientRect();
    const x1 = fr.left + fr.width / 2 - R.left, y1 = fr.top - R.top + fr.height * 0.25;
    const x2 = tr.left + tr.width / 2 - R.left, y2 = tr.top - R.top + tr.height * 0.25;
    const op = a.dim ? 0.28 : 1, w = a.bold ? 3.2 : 2;
    if (a.from === a.to) {
      html += `<circle cx="${x1}" cy="${y1 - 8}" r="9" fill="none" stroke="${a.color}" stroke-width="${w}" opacity="${op}"/>` +
        (a.label ? `<text x="${x1}" y="${y1 - 22}" text-anchor="middle" fill="${a.color}" font-size="13" font-weight="900" stroke="#0a0f1e" stroke-width="3" paint-order="stroke" opacity="${op}">${esc(a.label)}</text>` : '');
      continue;
    }
    const lift = (a.lift || 22) + Math.min(26, Math.abs(x2 - x1) * 0.14);
    const cy = Math.min(y1, y2) - lift, mx = (x1 + x2) / 2;
    html += `<path d="M${x1},${y1} Q${mx},${cy} ${x2},${y2}" fill="none" stroke="${a.color}" stroke-width="${w}" stroke-linecap="round" marker-end="url(#ah)" opacity="${op}" ${a.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
    if (a.label) html += `<text x="${mx}" y="${(y1 + y2) / 4 + cy / 2 - 3}" text-anchor="middle" fill="${a.color}" font-size="13" font-weight="900" stroke="#0a0f1e" stroke-width="3" paint-order="stroke" opacity="${op}">${esc(a.label)}</text>`;
  }
  svg.innerHTML = html;
}
function planArrows(pv) {
  const list = [], f = G.focus;
  for (const a of pv.acts) {
    const dim = !!f && a.u !== f && !a.targets.includes(f);
    const bold = !!f && a.u === f;
    if (isAttack(a.kind)) for (const t of a.targets) list.push({ from: a.u, to: t, label: String(a.n), color: sideOf(a.u) === 'A' ? '#ffd27a' : '#ff7a6e', lift: sideOf(a.u) === 'A' ? 16 : 34, dim, bold });
    else if (a.kind === 'heal') list.push({ from: a.u, to: a.targets[0], label: '+' + a.n, color: '#8ff0b5', lift: 10, dim, bold });
    else if (a.kind === 'guard') list.push({ from: a.u, to: a.u, label: '방패', color: '#ffd27a', dim, bold });
  }
  for (const b of pv.booms) for (const t of b.targets) list.push({ from: b.u, to: t, label: '4', color: '#ffb84d', dash: true, lift: 8, dim: !!f && b.u !== f && t !== f });
  drawArrows(list);
}

/* ---------- 계획 화면 ---------- */
function renderMeters() {
  const b = G.b, p = G.party, used = usedNow(), moves = G.movesBefore + used, lost = lostOf(G.state.hp);
  $('m-round').querySelector('b').textContent = `${G.round}/${b.rounds}`;
  $('m-swaps').querySelector('b').textContent = `${used}/${b.swaps}`;
  $('m-swaps').classList.toggle('full', used >= b.swaps);
  const me = $('m-edits'); me.querySelector('b').textContent = `${moves}/${p.s2}`;
  me.classList.toggle('ok', moves <= p.s2); me.classList.toggle('over', moves > p.s2);
  const ml = $('m-lost'); ml.querySelector('b').textContent = `${lost}/${p.s3}`;
  ml.classList.toggle('ok', lost <= p.s3); ml.classList.toggle('over', lost > p.s3);
}
function renderInfo(pv) {
  const box = $('info'), id = G.focus;
  if (!id || !(id in G.state.hp)) {
    const doomed = G.form.filter(x => pv.after[x] <= 0), killed = G.state.E.filter(x => pv.after[x] <= 0);
    const hurt = G.form.reduce((t, x) => t + Math.max(0, G.state.hp[x] - Math.max(0, pv.after[x])), 0);
    const pre = G.sel ? `<b>${esc(dn(G.sel))}</b>${iga(nameOf(G.sel))} 골라졌어요. 자리를 바꿀 <b>다른 아군</b>을 탭해요. 같은 아군을 다시 탭하면 취소돼요.<br>`
      : '아군 둘을 차례로 탭하면 <b>자리가 바뀌어요.</b> 유닛을 탭하면 할 일을 자세히 보여요.<br>';
    box.innerHTML = pre + (doomed.length

      : `<span class="now">이번 마디 예상: 적 ${killed.length}명 쓰러짐 · 아군 피해 ${hurt}</span>`);
    return;
  }

    `<span>체력 ${G.state.hp[id]}/${u.hp}${after !== G.state.hp[id] ? ` → ${Math.max(0, after)}` : ''}</span></div>` +
    `<div>습관: ${esc(HABIT_TEXT[nameOf(id)])}</div><div class="now">이번 마디: ${esc(actText(a))}</div>` +
    (after <= 0 ? `<div class="warn">⚠ 이대로면 이번 마디에 쓰러져요</div>` : '');
}
function renderPlan() {
  const pv = runRound(G.state, G.form);
  updateField({ A: G.form, E: G.state.E, hp: G.state.hp, live: new Set(G.form.concat(G.state.E)), pv });
  placeGround();
  renderMeters();
  renderInfo(pv);
  planArrows(pv);
  $('a-undo').disabled = !G.history.length;
  $('a-reset').disabled = usedNow() === 0;
}
function renderAll() {
  $('act-plan').classList.toggle('hidden', G.playing);
  $('act-play').classList.toggle('hidden', !G.playing);
  if (!G.playing) {
    $('msg').className = 'msg';
    $('msg').textContent = `${G.round}마디 · 자리를 바꾸고 시작 ▶`;
    renderPlan();
  }
}
function onTok(id) {
  if (!G || G.playing) return;
  if (sideOf(id) === 'E') { G.focus = G.focus === id ? null : id; renderPlan(); return; }
  if (!G.sel) { G.sel = id; G.focus = id; renderPlan(); tutorial('selected'); return; }
  if (G.sel === id) { G.sel = null; renderPlan(); return; }
  const i = G.form.indexOf(G.sel), j = G.form.indexOf(id);
  const next = G.form.slice(); next[i] = id; next[j] = G.sel;
  if (swapDistance(G.start, next) > G.b.swaps) {
    const el = tokEl(id);
    if (el) el.querySelector('.body').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 300 });
    toast(`이번 마디 이동을 다 썼어요 (${G.b.swaps}번). 바꾼 둘을 다시 바꾸면 돌려받아요`);
    return;
  }
  G.form = next; G.sel = null; G.focus = id;
  arrangeAllies();
  renderPlan();
  setTimeout(() => { if (G && !G.playing) planArrows(runRound(G.state, G.form)); }, 340);
  tutorial('swapped');
}

/* ---------- 재생 ---------- */
function sleep(ms) {
  if (skipping) return Promise.resolve();
  return new Promise(res => { const t = setTimeout(() => { skipWake = null; res(); }, ms / speed); skipWake = () => { clearTimeout(t); skipWake = null; res(); }; });
}
function floatText(id, text, cls) {
  const el = tokEl(id);
  if (!el || skipping) return;
  const f = document.createElement('div');
  f.className = 'float ' + cls; f.textContent = text;
  el.appendChild(f);
  setTimeout(() => f.remove(), 950);
}
/* ---------- 움직임 (공격, 화살, 회복, 폭발) ---------- */
const durOf = ms => ms / speed;
function rel(el) { const R = $('stage').getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: r.left - R.left + r.width / 2, w: r.width, h: r.height, top: r.top - R.top, bottom: r.bottom - R.top }; }
function bodyOf(id) { const el = tokEl(id); return el ? el.querySelector('.body') : null; }
function spawn(cls, x, y, html) { const d = document.createElement('div'); d.className = cls; d.style.transform = `translate(${x}px,${y}px)`; if (html) d.innerHTML = html; $('fx').appendChild(d); return d; }
function shakeStage() { if (reduceMotion || skipping) return; const st = $('stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); }

  const r = anchor.getBoundingClientRect();
  const w = Math.min(280, window.innerWidth - 24);
  c.style.width = w + 'px';
  const left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left + r.width / 2 - w / 2));
  c.style.left = left + 'px';
  c.style.setProperty('--ax', Math.max(16, Math.min(w - 16, r.left + r.width / 2 - left)) + 'px');
  const h = c.offsetHeight;
  if (r.top - h - 14 > 8) { c.style.top = (r.top - h - 12) + 'px'; c.classList.add('above'); }
  else { c.style.top = (r.bottom + 12) + 'px'; c.classList.add('below'); }
  coachDismiss = opts && opts.dismiss;
}
function hideCoach() { $('coach').classList.add('hidden'); coachDismiss = null; }
$('coach').addEventListener('click', () => { if (coachDismiss) hideCoach(); });

function tutorial(ev) {
  if (!G || G.playing) return;
  if (G.n === 1 && G.round === 1) {
    const knight = G.form.find(id => nameOf(id) === '기사');
    if (ev === 'start') setTimeout(() => G && !G.sel && knight && tokEl(knight) && coachAt(tokEl(knight), '지금 맨 앞(1번 자리)은 <b>궁수</b>예요. 궁수는 맨 앞에선 활을 못 쏘고, 기사는 맨 앞이 아니면 칼이 안 닿아요.<br><b>기사</b>를 탭해 보세요.'), 450);
    else if (ev === 'selected') { const ar = G.form.find(id => nameOf(id) === '궁수'); if (ar && tokEl(ar)) coachAt(tokEl(ar), '이제 <b>궁수</b>를 탭하면 둘의 자리가 바뀌어요.'); }
    else if (ev === 'swapped') coachAt($('a-go'), '화살표와 체력 막대에 이번 마디 결과가 미리 보여요. 준비됐으면 <b>시작 ▶</b>');
    else if (ev === 'started') hideCoach();
  } else if (G.n === 2 && G.round === 1 && ev === 'start') {
    setTimeout(() => G && coachAt($('stage'), '<b>사제는 자기와 바로 옆 아군만</b> 고쳐요. 매 마디 맞는 아군 옆에 세워 두세요. 이동 횟수는 마디마다 다시 채워져요.', { dismiss: true }), 450);
  }
}

/* ---------- 단추 연결 ---------- */
$('t-rules').addEventListener('click', openRules);
$('t-reset').addEventListener('click', () => {
  openModal(`<h2>기록 지우기</h2><p>별과 열린 판 기록을 모두 지울까요?</p><div class="row"><button class="btn" data-no>아니요</button><button class="btn primary" data-yes>지우기</button></div>`, sheet => {
    sheet.querySelector('[data-no]').addEventListener('click', closeModal);
    sheet.querySelector('[data-yes]').addEventListener('click', () => { save = { best: {}, party: {} }; persist(); closeModal(); renderTitle(); toast('기록을 지웠어요'); });
  });
});
$('b-back').addEventListener('click', () => { if (G && G.playing) { skipping = true; if (skipWake) skipWake(); } goTitle(); });
$('b-help').addEventListener('click', openRules);
$('a-go').addEventListener('click', playRound);
$('a-reset').addEventListener('click', () => { if (!G || G.playing) return; G.form = G.start.slice(); G.sel = null; arrangeAllies(); renderPlan(); setTimeout(() => { if (G && !G.playing) planArrows(runRound(G.state, G.form)); }, 340); });
$('a-undo').addEventListener('click', undoRound);
$('a-speed').addEventListener('click', () => { speed = speed === 1 ? 2 : 1; $('a-speed').textContent = speed === 1 ? '2배속' : '1배속'; });
$('a-skip').addEventListener('click', () => { skipping = true; if (skipWake) skipWake(); });
$('modal').addEventListener('click', e => { if (e.target === $('modal') && !$('sheet').querySelector('[data-retry],[data-next],[data-again]')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').classList.contains('hidden') && $('sheet').querySelector('[data-close]')) closeModal(); });
window.addEventListener('resize', () => { if (G && !G.playing) renderPlan(); hideCoach(); });

renderTitle();
</script>
