<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>붕어빵 제국</title>
<meta name="description" content="손님이 주문한 붕어빵을 구워 건네고, 번 돈으로 틀과 메뉴를 늘려 리어카에서 본점까지 키우는 장사 게임.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gothic+A1:wght@400;500;700;800&display=swap">
<style>
/* 레이아웃: 차양 아래 한 판 — 위는 손님 카운터, 아래는 철판(틀)과 옆 선반(속재료·진열대). 하루 장사가 끝나면 가게 정비 시트가 덮는다. */
:root{
  color-scheme: dark;
  --night:#11172a; --night-2:#182036; --panel:#1d2640; --panel-2:#26304f; --line:#323d64;
  --snow:#eef1f8; --mist:#99a3c4; --dim:#5f6990;
  --dough:#f2b45a; --crust:#b8681f; --bean:#8f2b3b; --tarp:#d8412f; --canvas:#f3ece2;
  --gold:#ffd66e; --gold-glow:rgba(255,214,110,.35); --ok:#7ad8a8; --warn:#f2b45a; --bad:#ef6a52; --bad-glow:rgba(239,106,82,.35);
  --iron:#2a2f3e; --iron-2:#161a25; --cavity:#0c0f17; --cavity-edge:#3a4152; --batter:#f1e2bf; --char:#1d120b;
  --wood:#7a4a2a; --wood-2:#57331b; --shadow:rgba(4,6,14,.5); --scrim:rgba(8,10,20,.74);
  --m-red:#7d2333; --m-choux:#f1d98a; --m-matcha:#86b25e; --m-pizza:#e0532f;
  --st1:#d8412f; --st2:#e0702c; --st3:#2f62a8; --st4:#23875a; --st5:#d9a23a;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-num:"Do Hyeon","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --t-xs:12px; --t-sm:13px; --t-md:15px; --t-lg:19px; --t-xl:26px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{margin:0; background:var(--night); color:var(--snow); font-family:var(--f-body); font-size:var(--t-md); line-height:1.5; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit}
h1,h2,h3{text-wrap:balance; margin:0}
.defs{position:absolute; width:0; height:0; overflow:hidden}
.eyebrow{font-size:var(--t-xs); font-weight:800; letter-spacing:.12em; color:var(--mist)}
.muted{color:var(--mist); font-size:var(--t-sm)}
.h{font-family:var(--f-display); font-weight:400; font-size:var(--t-lg); letter-spacing:.02em}

/* 차양 */
.awning{--sa:var(--st1); --sb:var(--canvas); position:relative; z-index:3; height:56px; display:flex; justify-content:center; align-items:flex-end; padding-inline:16px;
  background:repeating-linear-gradient(90deg,var(--sa) 0 48px,var(--sb) 48px 96px)}
.awning::after{content:""; position:absolute; left:0; right:0; top:100%; height:14px;
  background:
    radial-gradient(circle at 24px 0,var(--sa) 0 23px,transparent 24px) 0 0/96px 14px repeat-x,
    radial-gradient(circle at 72px 0,var(--sb) 0 23px,transparent 24px) 0 0/96px 14px repeat-x;
  filter:drop-shadow(0 6px 5px var(--shadow))}
.sign{position:relative; z-index:1; top:22px; display:flex; align-items:center; gap:12px; background:var(--night-2); border:2px solid var(--dough); border-radius:8px; padding:6px 16px 7px; box-shadow:0 10px 24px var(--shadow)}
.sign h1{font-family:var(--f-display); font-weight:400; font-size:var(--t-xl); line-height:1; color:var(--dough); letter-spacing:.02em; white-space:nowrap}
.tier{font-size:var(--t-xs); font-weight:800; color:var(--night); background:var(--dough); border-radius:999px; padding:3px 10px; white-space:nowrap}

/* 판 */
.shop{max-width:1180px; margin-inline:auto; padding-inline:16px; padding-block:48px 32px; display:flex; flex-direction:column; gap:14px}
.hud{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:18px; align-items:center; padding:10px 16px; background:var(--night-2); border:1px solid var(--line); border-radius:14px}
.hud-day b{display:block; font-family:var(--f-display); font-weight:400; font-size:var(--t-lg); line-height:1.1}
.hud-time{display:flex; align-items:center; gap:10px; min-width:0}
.time-bar{flex:1; height:10px; border-radius:999px; background:var(--panel); box-shadow:inset 0 0 0 1px var(--line); overflow:hidden}
.time-bar i{display:block; height:100%; width:100%; border-radius:inherit; background:linear-gradient(90deg,var(--dough),var(--gold))}
.time-bar.closing i{background:var(--dim)}
.time-label{font-family:var(--f-num); font-size:var(--t-lg); font-variant-numeric:tabular-nums; min-width:3.2em; text-align:right}
.hud-money{text-align:right}
.hud-money b{display:block; font-family:var(--f-num); font-weight:400; font-size:var(--t-xl); line-height:1.05; font-variant-numeric:tabular-nums}
.hud-money span{font-size:var(--t-xs); color:var(--mist)}
.hud-money span b{display:inline; font-size:var(--t-sm); color:var(--dough)}

/* 손님 카운터 */
.counter{position:relative; padding:12px 12px 22px; background:var(--night-2); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.counter::after{content:""; position:absolute; left:0; right:0; bottom:0; height:12px; background:linear-gradient(var(--wood),var(--wood-2))}
.queue{display:grid; grid-template-columns:repeat(var(--slots,2),minmax(0,1fr)); gap:10px}
.cust{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; min-height:176px; padding:10px 8px; border-radius:12px; border:1px solid var(--line); background:var(--panel); cursor:pointer; text-align:center; transition:border-color .15s,background-color .15s,opacity .5s,transform .5s}
.cust.empty{cursor:default; border-style:dashed; background:transparent; justify-content:center; color:var(--dim); font-size:var(--t-sm)}
.cust.can{border-color:var(--gold); background:var(--panel-2); box-shadow:0 0 0 1px var(--gold)}
.cust:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.cust.bye{opacity:0; transform:translateY(-14px); pointer-events:none}
.cust.bye.angry{transform:translateX(18px)}
.cust.nudge{animation:nudge .28s}
.cust svg.face{width:58px; height:58px; flex:none}
.cust-name{font-size:var(--t-xs); color:var(--mist); font-weight:700; line-height:1}
.bubble{position:relative; display:flex; flex-wrap:wrap; justify-content:center; gap:4px; width:fit-content; max-width:100%; padding:6px; border-radius:10px; background:var(--canvas); color:var(--night); font-size:var(--t-sm); font-weight:800}
.bubble::before{content:""; position:absolute; top:-6px; left:50%; margin-left:-6px; border:6px solid transparent; border-top:0; border-bottom-color:var(--canvas)}
.bubble.say{font-weight:700}
.ord{display:inline-flex; align-items:center; gap:4px; padding:1px 6px; border-radius:999px; white-space:nowrap}
.ord i{width:10px; height:10px; border-radius:50%; background:var(--c); box-shadow:0 0 0 1px var(--night)}
.ord.ok{background:var(--ok)}
.pat{width:100%; height:6px; border-radius:999px; background:var(--iron-2); overflow:hidden; margin-top:auto}
.pat i{display:block; height:100%; width:100%; background:var(--ok); border-radius:inherit}
.pat.mid i{background:var(--warn)} .pat.low i{background:var(--bad)}
.cust-hint{font-size:var(--t-xs); font-weight:800; color:var(--gold); min-height:1.2em; line-height:1.2}

/* 작업대 */
.work{display:grid; grid-template-columns:minmax(0,1fr) 300px; grid-template-areas:"molds fill" "molds tray" "molds guide"; grid-template-rows:auto auto 1fr; gap:14px; align-items:start}
.molds-panel{grid-area:molds; display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:16px; background:radial-gradient(120% 90% at 50% 0,var(--iron),var(--iron-2)); border:1px solid var(--line)}
.fill-panel{grid-area:fill} .tray-panel{grid-area:tray} .guide{grid-area:guide}
.panel-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.molds{display:grid; grid-template-columns:repeat(var(--cols,2),minmax(0,190px)); justify-content:center; gap:10px}
.mold{--p:0; position:relative; display:flex; flex-direction:column; align-items:stretch; gap:5px; min-width:0; padding:8px 8px 7px; border-radius:12px; border:1px solid var(--line); background:var(--iron-2); cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; transition:box-shadow .15s}
.mold:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.mold svg{display:block; width:100%; height:auto}
.mold .cavity{fill:var(--cavity); stroke:var(--cavity-edge); stroke-width:3}
.mold .batter{fill:var(--batter)}
.mold .filling{fill:var(--fill,var(--m-red)); opacity:calc(1 - var(--p) * .55)}
.mold .sear{fill:var(--crust); opacity:calc(var(--p) * .6)}
.mold .char{fill:var(--char); opacity:.78}
.mold .batter,.mold .filling,.mold .sear,.mold .baked,.mold .char{display:none}
.mold[data-state="batter"] .batter{display:inline}
.mold:is([data-state="cookA"],[data-state="readyA"]) :is(.batter,.filling,.sear){display:inline}
.mold[data-state="readyA"] .sear{opacity:.6}
.mold[data-state="readyA"] .filling{opacity:.45}
.mold:is([data-state="cookB"],[data-state="done"]) .baked{display:inline}
.mold[data-state="cookB"] .baked{opacity:calc(.5 + var(--p) * .5)}
.mold[data-state="burnt"] :is(.baked,.char){display:inline}
.mold:is([data-state="readyA"],[data-state="done"]){border-color:var(--gold); box-shadow:0 0 0 2px var(--gold),0 0 18px var(--gold-glow)}
.mold.hot{border-color:var(--bad); box-shadow:0 0 0 2px var(--bad),0 0 18px var(--bad-glow)}
.mold[data-state="burnt"]{border-color:var(--bad)}
.mold-bar{height:6px; border-radius:999px; background:var(--cavity); overflow:hidden}
.mold-bar i{display:block; height:100%; width:0; border-radius:inherit; background:var(--dough)}
.mold:is([data-state="readyA"],[data-state="done"]) .mold-bar i{background:var(--gold)}
.mold.hot .mold-bar i,.mold[data-state="burnt"] .mold-bar i{background:var(--bad)}
.mold-label{font-size:var(--t-xs); font-weight:800; color:var(--mist); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mold:is([data-state="readyA"],[data-state="done"]) .mold-label{color:var(--gold)}
.mold[data-state="burnt"] .mold-label,.mold.hot .mold-label{color:var(--bad)}
.nudge{animation:nudge .28s}
@keyframes nudge{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}

.side-card{display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:14px; background:var(--night-2); border:1px solid var(--line)}
.fill-list{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.fill{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel); cursor:pointer; text-align:left; min-width:0}
.fill i{flex:none; width:18px; height:18px; border-radius:50%; background:var(--c); box-shadow:0 0 0 2px var(--night)}
.fill span{display:flex; flex-direction:column; line-height:1.2; min-width:0}
.fill b{font-weight:800; font-size:var(--t-sm)}
.fill small{font-size:var(--t-xs); color:var(--mist)}
.fill[aria-pressed="true"]{border-color:var(--gold); background:var(--panel-2); box-shadow:0 0 0 1px var(--gold)}
.fill:disabled{cursor:not-allowed; opacity:.45}
.fill:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.kbd{font-size:10px; color:var(--dim); margin-left:auto; font-weight:800}
.tray-list{display:flex; flex-wrap:wrap; gap:6px; min-height:30px}
.tray-chip{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:var(--panel); border:1px solid var(--line); font-weight:800; font-size:var(--t-sm); font-variant-numeric:tabular-nums}
.tray-chip i{width:12px; height:12px; border-radius:50%; background:var(--c)}
.tray-chip.zero{opacity:.4}
.tray-cap{height:6px; border-radius:999px; background:var(--panel); overflow:hidden}
.tray-cap i{display:block; height:100%; width:0; background:var(--dough); border-radius:inherit; transition:width .15s}
.tray-cap.full i{background:var(--bad)}
.guide ol{margin:0; padding-left:1.3em; display:flex; flex-direction:column; gap:4px; font-size:var(--t-sm); color:var(--mist)}
.guide b{color:var(--snow)}

/* 시트(개점 전·마감) */
.overlay{position:fixed; inset:0; z-index:30; display:grid; place-items:start center; overflow-y:auto; background:var(--scrim); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  padding-inline:16px; padding-block:calc(env(safe-area-inset-top,0px) + 28px) calc(env(safe-area-inset-bottom,0px) + 28px)}
.sheet{width:min(100%,660px); display:flex; flex-direction:column; gap:18px; padding:22px 20px 0; border-radius:18px; background:var(--night-2); border:1px solid var(--line); box-shadow:0 30px 60px var(--shadow)}
.sheet-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap}
.sheet-head h2{font-family:var(--f-display); font-weight:400; font-size:var(--t-xl); color:var(--dough); line-height:1.15}
.stars{font-size:var(--t-lg); color:var(--gold); letter-spacing:.08em}
.sheet p{margin:0; color:var(--mist); max-width:62ch}
.steps{margin:0; padding-left:1.4em; display:flex; flex-direction:column; gap:6px}
.steps b{color:var(--dough)}
.results{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:0}
.results div{padding:10px 12px; border-radius:12px; background:var(--panel); border:1px solid var(--line); min-width:0}
.results dt{font-size:var(--t-xs); color:var(--mist); font-weight:700}
.results dd{margin:0; font-family:var(--f-num); font-size:var(--t-lg); font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.sec{display:flex; flex-direction:column; gap:8px}
.sec-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.list{display:flex; flex-direction:column; gap:8px}
.row{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center; width:100%; text-align:left; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--panel); cursor:pointer; transition:border-color .15s,background-color .15s}
.row.can{border-color:var(--dough); background:var(--panel-2)}
.row:disabled{cursor:default; opacity:.55}
.row.cur:disabled{opacity:1; border-color:var(--dough)}
.row:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.chip{width:44px; height:44px; border-radius:10px; display:grid; place-items:center; background:var(--bean); color:var(--dough); font-family:var(--f-display); font-size:14px; line-height:1; box-shadow:inset 0 -3px 0 var(--shadow)}
.stage-chip{background:var(--sc); color:var(--snow); font-size:18px}
.row-main{display:flex; flex-direction:column; gap:1px; min-width:0}
.row-name{font-weight:800}
.row-desc{font-size:var(--t-xs); color:var(--mist)}
.row-fx{font-size:var(--t-xs); color:var(--dough); font-weight:700}
.row-side{display:flex; flex-direction:column; align-items:flex-end; gap:2px; text-align:right}
.row-cost{font-family:var(--f-num); font-size:var(--t-md); color:var(--dough); white-space:nowrap}
.row:not(.can) .row-cost{color:var(--mist)}
.lv{font-size:var(--t-xs); color:var(--mist); font-weight:700; white-space:nowrap}
.tag{font-size:var(--t-xs); font-weight:800; border-radius:999px; padding:2px 8px; background:var(--panel-2); color:var(--mist); white-space:nowrap}
.tag.now{background:var(--dough); color:var(--night)}
.sheet-foot{position:sticky; bottom:0; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-inline:-20px; padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px)); background:var(--night-2); border-top:1px solid var(--line); border-radius:0 0 18px 18px}
.sheet-money{font-family:var(--f-num); font-size:var(--t-lg); color:var(--snow); font-variant-numeric:tabular-nums}
.btn{border:0; border-radius:12px; padding:12px 20px; font-weight:800; background:var(--dough); color:var(--night); cursor:pointer}
.btn:focus-visible,.btn-ghost:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.btn-ghost{align-self:flex-start; border:1px solid var(--line); background:transparent; color:var(--mist); border-radius:10px; padding:8px 14px; font-size:var(--t-sm); font-weight:700; cursor:pointer}
.btn-ghost.warn{border-color:var(--tarp); color:var(--snow)}

/* 효과 */
.fx{position:fixed; inset:0; pointer-events:none; z-index:25; overflow:hidden}
.float{position:absolute; font-family:var(--f-num); font-size:22px; color:var(--gold); text-shadow:0 2px 0 var(--shadow); white-space:nowrap; animation:rise 1s ease-out forwards}
.float.small{font-size:16px; color:var(--snow)}
.float.bad{color:var(--bad); font-size:17px}
@keyframes rise{from{opacity:1; transform:translate(-50%,-50%)}to{opacity:0; transform:translate(-50%,calc(-50% - 60px))}}
.toasts{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); transform:translateX(-50%); z-index:40; display:flex; flex-direction:column; gap:8px; width:min(calc(100vw - 32px),380px); pointer-events:none}
.toast{padding:10px 14px; border-radius:12px; border:1px solid var(--dough); background:var(--panel-2); box-shadow:0 12px 30px var(--shadow); animation:toast-in .25s ease; transition:opacity .3s,transform .3s}
.toast b{display:block; color:var(--dough)}
.toast span{font-size:var(--t-sm); color:var(--mist)}
.toast.out{opacity:0; transform:translateY(8px)}
@keyframes toast-in{from{opacity:0; transform:translateY(10px)}}

@media (max-width:860px){
  .work{grid-template-columns:minmax(0,1fr); grid-template-areas:"tray" "molds" "fill"; grid-template-rows:auto}
  .guide{display:none}
  .fill-list{grid-template-columns:repeat(4,minmax(0,1fr))}
  .fill{flex-direction:column; gap:4px; padding:8px 4px; text-align:center}
  .fill span{align-items:center}
  .kbd{display:none}
  .fill-panel .panel-head .muted{display:none}
  .tray-panel{flex-direction:row; align-items:center; flex-wrap:wrap; gap:8px 12px; padding:10px 12px}
  .tray-panel .tray-list{flex:1 1 160px}
  .tray-panel .tray-cap{flex:1 0 100%}
}
@media (max-width:560px){
  .shop{padding-block:42px 24px; gap:10px}
  .awning{height:48px}
  .sign{top:18px; padding:5px 12px 6px}
  .sign h1{font-size:21px}
  .hud{grid-template-columns:auto minmax(0,1fr); gap:6px 12px; padding:8px 12px}
  .hud-money{grid-column:1 / -1; display:flex; justify-content:space-between; align-items:baseline; text-align:left}
  .hud-money .eyebrow{display:none}
  .hud-money b{font-size:var(--t-lg)}
  .counter{padding:8px 8px 18px}
  .queue{gap:6px}
  .cust{min-height:156px; padding:8px 4px; gap:4px}
  .cust svg.face{width:44px; height:44px}
  .bubble{padding:4px; font-size:var(--t-xs)}
  .molds-panel{padding:10px}
  .molds{gap:8px}
  .mold{padding:6px 6px 5px}
  .side-card{padding:10px 12px}
  .results{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet{padding:18px 16px 0}
  .sheet-foot{margin-inline:-16px; padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
  .float{animation:none; opacity:.9}
}
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="g-dough" cx="42%" cy="38%" r="72%">
      <stop offset="0" stop-color="#f8d488"/>
      <stop offset=".5" stop-color="#eba64a"/>
      <stop offset="1" stop-color="#b5661f"/>
    </radialGradient>
    <path id="fish" d="M18 82C18 44 62 22 112 24C150 26 172 42 188 60L216 34C222 29 232 32 230 41L220 80L230 119C232 128 222 131 216 126L188 100C172 118 150 134 112 136C62 138 18 120 18 82Z"/>
    <clipPath id="c-body"><use href="#fish"/></clipPath>
    <symbol id="bung" viewBox="0 0 240 160">
      <path d="M12 82C12 38 60 15 112 17C154 19 176 36 190 52L214 27C224 19 240 26 237 41L228 80L237 119C240 134 224 141 214 133L190 108C176 124 154 141 112 143C60 145 12 126 12 82Z" fill="#9b5418" opacity=".55"/>
      <use href="#fish" fill="url(#g-dough)" stroke="#8a4512" stroke-width="3" stroke-linejoin="round"/>

          <li>한 번 더 눌러 고른 <b>속</b>을 넣어요.</li>
          <li>노릇해지면 눌러 <b>뒤집어요</b>. 늦으면 타요.</li>
          <li>다 익으면 눌러 <b>진열대</b>로 옮겨요.</li>
          <li>주문한 게 다 있으면 <b>손님</b>을 눌러 건네요.</li>

<script>
"use strict";
(() => {
/* ===== 규칙 ===== */
const DAY_LEN = 100;                 // 하루 영업 시간(초)
const READY_A = 3.5, READY_B = 5;    // 뒤집기·꺼내기를 기다려 주는 시간(지나면 탐)
const HELPER_DELAY = 0.35;
const COOK = [4.0, 3.4, 2.9, 2.5, 2.2];      // 화력 단계별 한 면 굽는 시간
const TRAY = [6, 9, 12, 16, 20];             // 진열대 단계별 보관 개수
const PATIENCE = [1, 1.2, 1.4, 1.6];         // 친절 교육 단계별 인내심
const SPAWN = [1, 0.85, 0.72, 0.62];         // 전단지 단계별 손님 간격
const SAVE_KEY = 'bungeo-shop-v2';

const MENUS = [
  { id:'red',    name:'팥',     price:500,  color:'var(--m-red)',    weight:5 },
  { id:'choux',  name:'슈크림', price:700,  color:'var(--m-choux)',  weight:3 },
  { id:'matcha', name:'녹차',   price:900,  color:'var(--m-matcha)', weight:2 },
  { id:'pizza',  name:'피자',   price:1200, color:'var(--m-pizza)',  weight:2 },
];
const MENU = Object.fromEntries(MENUS.map(m => [m.id, m]));

const STAGES = [
  { name:'리어카 노점',      cost:0,       slots:2, maxMolds:3, mul:1,    spawn:7.5, stripe:'--st1', perk:'손님 자리 2 · 틀 최대 3개' },
  { name:'포장마차',         cost:30000,   slots:3, maxMolds:4, mul:1.25, spawn:6.4, stripe:'--st2', perk:'손님 자리 3 · 틀 최대 4개 · 값 ×1.25 · 슈크림과 알바생(꺼내기)' },
  { name:'골목 가게',        cost:100000,  slots:3, maxMolds:6, mul:1.6,  spawn:5.4, stripe:'--st3', perk:'틀 최대 6개 · 값 ×1.6 · 녹차와 알바생(뒤집기)' },
  { name:'역 앞 매장',       cost:300000,  slots:4, maxMolds:8, mul:2.2,  spawn:4.6, stripe:'--st4', perk:'손님 자리 4 · 틀 최대 8개 · 값 ×2.2 · 피자 붕어빵' },
  { name:'붕어빵 제국 본점', cost:1000000, slots:4, maxMolds:9, mul:3,    spawn:4,   stripe:'--st5', perk:'틀 최대 9개 · 값 ×3 · 붕어빵 제국 완성' },
];

const UPS = [
  { id:'mold',    sign:'틀',   name:'붕어빵 틀 추가', levels:[3000, 9000, 20000, 45000, 90000, 160000, 280000],
    fx:l => `동시에 굽는 틀 ${2 + l}개 → ${3 + l}개`, cap:s => STAGES[s.stage].maxMolds - 2, capNote:'가게를 넓히면 틀을 더 놓을 수 있어요' },
  { id:'heat',    sign:'불',   name:'화력 강화',      levels:[8000, 35000, 120000, 350000], fx:l => `한 면 굽는 시간 ${COOK[l]}초 → ${COOK[l + 1]}초` },
  { id:'tray',    sign:'판',   name:'진열대 확장',    levels:[5000, 25000, 80000, 200000],  fx:l => `진열대 ${TRAY[l]}개 → ${TRAY[l + 1]}개` },
  { id:'kind',    sign:'미소', name:'친절 교육',      levels:[15000, 70000, 250000],        fx:l => `손님이 기다려 주는 시간 ×${PATIENCE[l]} → ×${PATIENCE[l + 1]}` },
  { id:'ad',      sign:'홍보', name:'전단지 홍보',    levels:[10000, 50000, 180000],        fx:l => `손님이 오는 간격 ${Math.round((1 - SPAWN[l + 1]) * 100)}% 짧게` },
  { id:'choux',   sign:'슈',   name:'슈크림 메뉴',    levels:[12000],  stage:1, fx:() => '1개 700원부터. 학생과 꼬마가 좋아해요' },
  { id:'collect', sign:'알바', name:'알바생: 꺼내기', levels:[40000],  stage:1, fx:() => '다 익은 붕어빵을 알아서 진열대로 옮겨요' },
  { id:'matcha',  sign:'녹차', name:'녹차 메뉴',      levels:[50000],  stage:2, fx:() => '1개 900원부터. 직장인이 좋아해요' },
  { id:'flip',    sign:'알바', name:'알바생: 뒤집기', levels:[120000], stage:2, fx:() => '노릇해진 붕어빵을 알아서 뒤집어요' },
  { id:'pizza',   sign:'피자', name:'피자 붕어빵',    levels:[150000], stage:3, fx:() => '1개 1,200원부터. 할머니도 좋아해요' },
];

const CUSTOMERS = [
  { id:'kid',     name:'꼬마',   patience:30, min:1, max:2, tip:1,   w:3, likes:'choux',  coat:'#e8b83a' },
  { id:'student', name:'학생',   patience:24, min:1, max:3, tip:1,   w:4, likes:'choux',  coat:'#34508a' },
  { id:'worker',  name:'직장인', patience:18, min:2, max:4, tip:1.6, w:3, likes:'matcha', coat:'#59627a' },
  { id:'grandma', name:'할머니', patience:36, min:3, max:6, tip:1.2, w:2, likes:'pizza',  coat:'#7a4f8a' },
];
const SKINS = ['#f2c9a0', '#e8b48a', '#d79e74', '#f5d3b3'];

/* ===== 도우미 ===== */
const $ = sel => document.querySelector(sel);
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
function pickW(list, wf) {
  const ws = list.map(wf), sum = ws.reduce((a, b) => a + b, 0);
  let r = Math.random() * sum;
  for (let i = 0; i < list.length; i++) if ((r -= ws[i]) <= 0) return list[i];
  return list[list.length - 1];
}
const KUNITS = [[1e12, '조'], [1e8, '억'], [1e4, '만']];
function fmt(n) {
  n = Math.round(n);
  if (n < 1e5) return n.toLocaleString('ko-KR');
  for (const [u, name] of KUNITS) if (n >= u) { const v = n / u; return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + name; }
}
const won = n => fmt(n) + '원';
const fmtClock = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ===== 상태 ===== */
let S;              // 저장되는 가게 상태
let G = null;       // 오늘 영업 상태 (장사 중일 때만)
let selected = 'red';
let last = performance.now(), uiAcc = 0, confirmWipe = 0;
const els = {
  awning:$('#awning'), stageName:$('#stageName'), dayLabel:$('#dayLabel'), timeBar:$('#timeBar'), timeFill:$('#timeFill'), timeLabel:$('#timeLabel'),
  money:$('#money'), todayMoney:$('#todayMoney'), queue:$('#queue'), molds:$('#molds'), cookInfo:$('#cookInfo'),
  fillings:$('#fillings'), tray:$('#tray'), trayCount:$('#trayCount'), trayCap:$('#trayCap'), guide:$('#guide'),
  overlay:$('#overlay'), sheet:$('#sheet'), fx:$('#fx'), toasts:$('#toasts'),
};

function fresh() {
  return { v:2, day:1, money:0, stage:0, up:{ mold:0, heat:0, tray:0, kind:0, ad:0, choux:0, collect:0, matcha:0, flip:0, pizza:0 },
    total:{ sold:0, served:0, revenue:0 }, best:0 };
}
function revive(o) {
  if (!o || o.v !== 2) return null;
  const s = Object.assign(fresh(), o);
  s.up = Object.assign(fresh().up, o.up);
  s.total = Object.assign(fresh().total, o.total);
  return s;
}
function load() { try { const raw = localStorage.getItem(SAVE_KEY); return raw ? revive(JSON.parse(raw)) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 저장 불가: 이번 세션만 유지 */ } }

const unlocked = id => id === 'red' || S.up[id] > 0;
const stage = () => STAGES[S.stage];
const trayCap = () => TRAY[S.up.tray];
const trayCount = () => G ? Object.values(G.tray).reduce((a, b) => a + b, 0) : 0;
const priceOf = id => Math.round(MENU[id].price * stage().mul / 10) * 10;

/* ===== 효과 ===== */
function floatAt(node, text, cls) {
  const r = node.getBoundingClientRect();
  const f = h('span', 'float' + (cls ? ' ' + cls : ''));
  f.textContent = text;
  f.style.left = (r.left + r.width / 2) + 'px';
  f.style.top = (r.top + r.height / 3) + 'px';
  els.fx.append(f);
  setTimeout(() => f.remove(), 1000);
}
function toast(title, body) {
  const t = h('div', 'toast');
  t.append(h('b'), h('span'));
  t.firstChild.textContent = title;
  t.lastChild.textContent = body;
  els.toasts.append(t);
  while (els.toasts.childElementCount > 3) els.toasts.firstChild.remove();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 3400);
}
function nudge(node) { node.classList.remove('nudge'); void node.offsetWidth; node.classList.add('nudge'); }

function paintStage() {
  const st = stage();
  els.awning.style.setProperty('--sa', `var(${st.stripe})`);
  els.awning.style.setProperty('--sb', S.stage === STAGES.length - 1 ? 'var(--night-2)' : 'var(--canvas)');
  els.stageName.textContent = st.name;
}

/* ===== 틀 ===== */
const MOLD_SVG = `<svg viewBox="0 0 240 160" aria-hidden="true">
  <use class="cavity" href="#fish"/>
  <use class="batter" href="#fish" transform="translate(9 6) scale(.925)"/>
  <ellipse class="filling" cx="120" cy="80" rx="44" ry="21"/>
  <use class="sear" href="#fish" transform="translate(9 6) scale(.925)"/>
  <use class="baked" href="#bung" width="240" height="160"/>
  <use class="char" href="#fish"/>
</svg><span class="mold-bar"><i></i></span><span class="mold-label"></span>`;

function buildMolds() {
  els.molds.textContent = '';
  G.molds.forEach(m => {
    const b = h('button', 'mold', MOLD_SVG);
    b.type = 'button';
    b.addEventListener('click', () => onMold(m));
    m.el = b; m.bar = b.querySelector('.mold-bar i'); m.label = b.querySelector('.mold-label');
    els.molds.append(b);
    paintMold(m);
  });
  layoutMolds();
  els.cookInfo.textContent = `한 면 ${COOK[S.up.heat].toFixed(1)}초`;
}
function layoutMolds() {
  if (!G) return;
  const n = G.molds.length;
  const cols = innerWidth < 560 ? (n === 4 ? 2 : Math.min(n, 3)) : (n <= 4 ? n : n <= 6 || n === 9 ? 3 : 4);
  els.molds.style.setProperty('--cols', cols);
}
addEventListener('resize', layoutMolds);

function moldLabel(m) {
  const f = m.fill ? MENU[m.fill].name + ' · ' : '';
  return {
    empty:'반죽 붓기', batter:MENU[selected].name + ' 넣기', cookA:f + '굽는 중', readyA:'뒤집기!',
    cookB:f + '굽는 중', done:'꺼내기!', burnt:'탔어요 · 버리기',
  }[m.state];
}
function paintMold(m) {
  m.el.dataset.state = m.state;
  if (m.fill) m.el.style.setProperty('--fill', MENU[m.fill].color);
  const label = moldLabel(m);
  m.label.textContent = label;
  m.el.setAttribute('aria-label', label);
}
function setMold(m, state) { m.state = state; m.t = 0; m.el.classList.remove('hot'); paintMold(m); }
function onMold(m) {
  if (!G) return;
  switch (m.state) {
    case 'empty': setMold(m, 'batter'); break;
    case 'batter': m.fill = selected; setMold(m, 'cookA'); break;
    case 'cookA': case 'cookB': nudge(m.el); floatAt(m.el, '아직 굽는 중', 'small'); break;
    case 'readyA': setMold(m, 'cookB'); break;
    case 'done': collect(m, false); break;
    case 'burnt': G.today.burnt++; m.fill = null; setMold(m, 'empty'); break;
  }
}
function collect(m, auto) {
  if (trayCount() >= trayCap()) {
    if (!auto) { nudge(m.el); floatAt(m.el, '진열대가 꽉 찼어요', 'bad'); }
    return;
  }
  G.tray[m.fill] = (G.tray[m.fill] || 0) + 1;
  m.fill = null;
  setMold(m, 'empty');
  renderTray();
}
function tickMolds(dt) {
  const cook = COOK[S.up.heat];
  for (const m of G.molds) {
    m.t += dt;
    if (m.state === 'cookA' && m.t >= cook) setMold(m, 'readyA');
    else if (m.state === 'readyA') {
      if (S.up.flip && m.t >= HELPER_DELAY) setMold(m, 'cookB');
      else if (m.t >= READY_A) setMold(m, 'burnt');
    } else if (m.state === 'cookB' && m.t >= cook) setMold(m, 'done');
    else if (m.state === 'done') {
      if (S.up.collect && m.t >= HELPER_DELAY && trayCount() < trayCap()) collect(m, true);
      else if (m.t >= READY_B) setMold(m, 'burnt');
    }
  }
}
function drawMolds() {
  const cook = COOK[S.up.heat];
  for (const m of G.molds) {
    let p = 0, bar = 0, hot = false;
    if (m.state === 'cookA' || m.state === 'cookB') { p = Math.min(1, m.t / cook); bar = p; }
    else if (m.state === 'readyA') { bar = 1 - m.t / READY_A; hot = m.t / READY_A > 0.55; }
    else if (m.state === 'done') { bar = 1 - m.t / READY_B; hot = m.t / READY_B > 0.55; }
    else if (m.state === 'burnt') bar = 1;
    m.el.style.setProperty('--p', p.toFixed(3));
    m.bar.style.width = (bar * 100).toFixed(1) + '%';
    if (m.el.classList.contains('hot') !== hot) m.el.classList.toggle('hot', hot);
  }
}

/* ===== 속재료·진열대 ===== */
function renderFillings() {
  els.fillings.textContent = '';
  MENUS.forEach((m, i) => {
    const open = unlocked(m.id);
    const b = h('button', 'fill', `<i></i><span><b>${m.name}</b><small>${open ? won(priceOf(m.id)) : '아직 없어요'}</small></span><span class="kbd">${i + 1}</span>`);
    b.type = 'button';
    b.style.setProperty('--c', m.color);
    b.disabled = !open;
    b.setAttribute('aria-pressed', String(selected === m.id));
    b.addEventListener('click', () => selectFill(m.id));
    els.fillings.append(b);
  });
}
function selectFill(id) {
  if (!unlocked(id)) return;
  selected = id;
  [...els.fillings.children].forEach((b, i) => b.setAttribute('aria-pressed', String(MENUS[i].id === id)));
  if (G) for (const m of G.molds) if (m.state === 'batter') paintMold(m);
}
addEventListener('keydown', e => {
  const n = +e.key;
  if (G && n >= 1 && n <= MENUS.length) selectFill(MENUS[n - 1].id);
});
function renderTray() {
  if (!G) return;
  els.tray.textContent = '';
  for (const m of MENUS) {
    if (!unlocked(m.id)) continue;
    const c = G.tray[m.id] || 0;
    const chip = h('span', 'tray-chip' + (c ? '' : ' zero'), `<i></i>${m.name} ${c}`);
    chip.style.setProperty('--c', m.color);
    els.tray.append(chip);
  }
  const n = trayCount(), cap = trayCap();
  els.trayCount.textContent = `${n} / ${cap}`;
  els.trayCap.firstElementChild.style.width = (n / cap * 100) + '%';
  els.trayCap.classList.toggle('full', n >= cap);
}

/* ===== 손님 ===== */
const MOUTH = { happy:'M27 33q5 4 10 0', meh:'M28 34h8', mad:'M27 35q5 -4 10 0' };
function face(c) {
  const t = c.type.id;
  const hair = {
    kid:'<path d="M17 25C17 9 47 9 47 25Z" fill="#d8412f"/><rect x="15" y="22" width="34" height="6" rx="3" fill="#f3ece2"/><circle cx="32" cy="8" r="4.5" fill="#f3ece2"/>',
    student:'<path d="M19 26C17 11 47 9 45 25C40 18 30 17 19 26Z" fill="#2b2118"/>',
    worker:'<path d="M19 23C20 11 44 11 45 22C38 16 26 16 19 23Z" fill="#3a2a1f"/>',
    grandma:'<circle cx="32" cy="11" r="6" fill="#cfc9c1"/><path d="M18 27C17 13 47 13 46 27C42 19 22 19 18 27Z" fill="#cfc9c1"/>',
  }[t];
  const extra = {
    kid:'<circle cx="24" cy="31" r="2.6" fill="#f08a8a" opacity=".55"/><circle cx="40" cy="31" r="2.6" fill="#f08a8a" opacity=".55"/>',
    student:'<path d="M22 47L25 62M42 47L39 62" stroke="#1d2238" stroke-width="3" stroke-linecap="round"/>',
    worker:'<circle cx="27" cy="27" r="4.4" fill="none" stroke="#1d2238" stroke-width="1.6"/><circle cx="37" cy="27" r="4.4" fill="none" stroke="#1d2238" stroke-width="1.6"/><path d="M31.4 27h1.2" stroke="#1d2238" stroke-width="1.6"/><path d="M29 44l3 3 3-3-3 14z" fill="#c23a3a"/>',
    grandma:'<path d="M21 42C26 46 38 46 43 42L44 47C38 50 26 50 20 47Z" fill="#d8412f"/>',
  }[t];
  return `<svg class="face" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M9 64C9 47 21 41 32 41C43 41 55 47 55 64Z" fill="${c.type.coat}"/>
    ${t === 'worker' ? '<path d="M27 41L32 50L37 41Z" fill="#eef1f8"/>' : ''}
    <circle cx="32" cy="27" r="13" fill="${c.skin}"/>${hair}
    <circle cx="27" cy="27" r="1.7" fill="#2a1a12"/><circle cx="37" cy="27" r="1.7" fill="#2a1a12"/>
    <path class="mouth" d="${MOUTH.happy}" fill="none" stroke="#2a1a12" stroke-width="1.8" stroke-linecap="round"/>${extra}
  </svg>`;
}
function buildQueue() {
  els.queue.style.setProperty('--slots', G.slots.length);
  els.queue.textContent = '';
  G.slots.forEach((_, k) => {
    const b = h('button', 'cust');
    b.type = 'button';
    b.addEventListener('click', () => serve(k));
    els.queue.append(b);
    renderSlot(k);
  });
}
function renderSlot(k) {
  const b = els.queue.children[k], c = G.slots[k];
  b.className = 'cust';
  if (!c) {
    b.classList.add('empty');
    b.textContent = G.closing ? '마감' : '빈 자리';
    b.disabled = true;
    b.removeAttribute('aria-label');
    return;
  }
  b.disabled = false;
  const items = Object.entries(c.order).map(([id, n]) => `<span class="ord" data-id="${id}" style="--c:${MENU[id].color}"><i></i>${MENU[id].name} ${n}</span>`).join('');
  b.innerHTML = `${face(c)}<span class="cust-name">${c.type.name}</span><span class="bubble">${items}</span><span class="cust-hint"></span><span class="pat"><i></i></span>`;
  b.setAttribute('aria-label', `${c.type.name} 주문: ` + Object.entries(c.order).map(([id, n]) => `${MENU[id].name} ${n}개`).join(', '));
}
function spawn(k) {
  const type = pickW(CUSTOMERS, t => t.w);
  const menus = MENUS.filter(m => unlocked(m.id));
  const n = randInt(type.min, type.max + Math.floor(S.stage / 2));
  const order = {};
  for (let i = 0; i < n; i++) {
    let m = pickW(menus, x => x.weight * (x.id === type.likes ? 2.5 : 1));
    const kinds = Object.keys(order);
    if (!order[m.id] && kinds.length >= (S.stage >= 3 ? 3 : 2)) m = MENU[kinds[randInt(0, kinds.length - 1)]];
    order[m.id] = (order[m.id] || 0) + 1;
  }
  const patience = type.patience * PATIENCE[S.up.kind] * (1 + n * 0.06);
  G.slots[k] = { type, order, n, patience, left:patience, skin:SKINS[randInt(0, SKINS.length - 1)], mood:'happy', leaving:0 };
  renderSlot(k);
}
const canServe = c => Object.entries(c.order).every(([id, n]) => (G.tray[id] || 0) >= n);
function serve(k) {
  const c = G && G.slots[k], b = els.queue.children[k];
  if (!c || c.leaving) return;
  if (!canServe(c)) {
    const [id, n] = Object.entries(c.order).find(([id, n]) => (G.tray[id] || 0) < n);
    nudge(b);
    floatAt(b, `${MENU[id].name} ${n - (G.tray[id] || 0)}개가 모자라요`, 'bad');
    return;
  }
  let pay = 0;
  for (const [id, n] of Object.entries(c.order)) { G.tray[id] -= n; pay += priceOf(id) * n; }
  const frac = c.left / c.patience;
  const tip = Math.round(pay * (frac >= 0.6 ? 0.2 : frac >= 0.3 ? 0.1 : 0) * c.type.tip / 10) * 10;
  S.money += pay + tip;
  const t = G.today;
  t.revenue += pay; t.tips += tip; t.sold += c.n; t.served++;
  floatAt(b, '+' + won(pay + tip));
  if (tip) setTimeout(() => floatAt(b, '팁 ' + won(tip), 'small'), 160);
  leave(k, true);
  renderTray();
}
function leave(k, happy) {
  const c = G.slots[k], b = els.queue.children[k];
  c.leaving = 0.6;
  if (!happy) G.today.lost++;
  const bubble = b.querySelector('.bubble');
  bubble.className = 'bubble say';
  bubble.textContent = happy ? '잘 먹을게요!' : '그냥 갈게요…';
  b.querySelector('.mouth').setAttribute('d', happy ? MOUTH.happy : MOUTH.mad);
  b.querySelector('.cust-hint').textContent = '';
  b.classList.remove('can');
  requestAnimationFrame(() => b.classList.add('bye', happy ? 'happy' : 'angry'));
}
function tickCustomers(dt) {
  G.slots.forEach((c, k) => {
    if (!c) return;
    if (c.leaving) { c.leaving -= dt; if (c.leaving <= 0) { G.slots[k] = null; renderSlot(k); } return; }
    c.left -= dt;
    if (c.left <= 0) leave(k, false);
  });
  if (G.closing) return;
  G.spawnIn -= dt;
  if (G.spawnIn <= 0) {
    const k = G.slots.indexOf(null);
    if (k >= 0) { spawn(k); G.spawnIn = stage().spawn * SPAWN[S.up.ad] * rand(0.7, 1.3); }
    else G.spawnIn = 0.8;
  }
}
function drawCustomers() {
  G.slots.forEach((c, k) => {
    if (!c || c.leaving) return;
    const b = els.queue.children[k], frac = Math.max(0, c.left / c.patience);
    const pat = b.querySelector('.pat');
    pat.firstElementChild.style.width = (frac * 100) + '%';
    pat.className = 'pat' + (frac < 0.3 ? ' low' : frac < 0.6 ? ' mid' : '');
    const mood = frac < 0.3 ? 'mad' : frac < 0.6 ? 'meh' : 'happy';
    if (mood !== c.mood) { c.mood = mood; b.querySelector('.mouth').setAttribute('d', MOUTH[mood]); }
    const ok = canServe(c);
    b.classList.toggle('can', ok);
    b.querySelector('.cust-hint').textContent = ok ? '눌러서 건네기' : '';
    b.querySelectorAll('.ord').forEach(o => o.classList.toggle('ok', (G.tray[o.dataset.id] || 0) >= c.order[o.dataset.id]));
  });
}

/* ===== 하루 ===== */
function startDay() {
  G = {
    time:DAY_LEN, closing:false, tray:{}, spawnIn:1.2,
    molds:Array.from({ length:2 + S.up.mold }, () => ({ state:'empty', t:0, fill:null })),
    slots:new Array(stage().slots).fill(null),
    today:{ sold:0, served:0, lost:0, revenue:0, tips:0, burnt:0 },
  };
  if (!unlocked(selected)) selected = 'red';
  els.overlay.hidden = true;
  paintStage();
  buildMolds();
  buildQueue();
  renderFillings();
  renderTray();
  els.guide.hidden = S.day > 3;
  els.timeBar.classList.remove('closing');
  updateHud();
  last = performance.now();
}
function endDay() {
  const t = G.today;
  t.burnt += G.molds.filter(m => m.state === 'burnt').length;
  t.leftover = trayCount();
  S.total.sold += t.sold; S.total.served += t.served; S.total.revenue += t.revenue + t.tips;
  S.best = Math.max(S.best, t.revenue + t.tips);
  const day = S.day;
  S.day++;
  G = null;
  save();
  openSheet('result', t, day);
}

/* ===== 개점 전·마감 시트 ===== */
function stars(t) {
  const all = t.served + t.lost;
  const n = all ? 1 + Math.round(t.served / all * 4) : 1;
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}
function openSheet(mode, t, day) {
  let head;
  if (mode === 'intro') {
    head = `<div class="sheet-head"><h2 id="sheetTitle">어서 오세요, 사장님</h2></div>
      <p>리어카 한 대로 시작하는 붕어빵 장사예요. 손님이 주문한 붕어빵을 구워서 건네고, 번 돈으로 틀과 메뉴를 늘리고 가게를 넓혀 보세요.</p>
      <ol class="steps">
        <li><b>빈 틀</b>을 눌러 반죽을 부어요.</li>
        <li>한 번 더 눌러 <b>속</b>을 넣어요. 넣을 속은 속재료 칸에서 고르고, 키보드 1~4로도 바꿀 수 있어요.</li>
        <li>노릇해져 테두리가 빛나면 눌러서 <b>뒤집어요</b>. 너무 늦으면 타요.</li>
        <li>다 익으면 눌러서 <b>진열대</b>로 옮겨요.</li>
        <li>주문한 붕어빵이 진열대에 다 있으면 <b>손님</b>을 눌러 건네요. 빨리 건넬수록 팁을 더 받아요.</li>
      </ol>
      <p>하루 장사는 ${DAY_LEN}초예요. 문을 닫으면 번 돈으로 가게를 정비해요.</p>`;
  } else if (mode === 'result') {
    head = `<div class="sheet-head"><h2 id="sheetTitle">${day}일차 마감</h2><span class="stars" role="img" aria-label="평점 ${stars(t).split('★').length - 1}점">${stars(t)}</span></div>
      <dl class="results">
        <div><dt>판 붕어빵</dt><dd>${t.sold}개</dd></div>
        <div><dt>손님</dt><dd>${t.served}명 / ${t.served + t.lost}명</dd></div>
        <div><dt>매출</dt><dd>${won(t.revenue)}</dd></div>
        <div><dt>팁</dt><dd>${won(t.tips)}</dd></div>
        <div><dt>탄 붕어빵</dt><dd>${t.burnt}개</dd></div>
        <div><dt>남은 붕어빵</dt><dd>${t.leftover}개</dd></div>
      </dl>
      <p>${t.lost ? `그냥 돌아간 손님이 ${t.lost}명 있었어요. 틀을 늘리거나 화력을 올리면 더 빨리 구울 수 있어요.` : '오늘 온 손님을 모두 받았어요.'}</p>`;
  } else {
    head = `<div class="sheet-head"><h2 id="sheetTitle">다시 오셨네요, 사장님</h2></div><p>${S.day}일차 장사를 준비할 차례예요.</p>`;
  }
  const shop = mode === 'intro' ? '' : `
    <div class="sec"><div class="sec-head"><h3 class="h">가게 확장</h3><span class="muted">지금: ${stage().name}</span></div><div class="list" id="stageList"></div></div>
    <div class="sec"><div class="sec-head"><h3 class="h">장비와 메뉴</h3></div><div class="list" id="upList"></div></div>
    <button class="btn-ghost" type="button" id="wipeBtn">처음부터 다시 하기</button>`;
  els.sheet.innerHTML = head + shop + `
    <div class="sheet-foot"><span class="muted">금고 <b class="sheet-money" id="sheetMoney">${won(S.money)}</b></span>
    <button class="btn" type="button" id="startBtn">${S.day}일차 장사 시작</button></div>`;
  $('#startBtn').addEventListener('click', startDay);
  if (mode !== 'intro') { renderShopLists(); bindWipe(); }
  els.overlay.hidden = false;
  els.overlay.scrollTop = 0;
  paintStage();
  updateHud();
  setTimeout(() => $('#startBtn').focus({ preventScroll:true }), 50);
}
function renderShopLists() {
  const sl = $('#stageList'), ul = $('#upList');
  sl.textContent = ''; ul.textContent = '';
  STAGES.forEach((st, i) => {
    const next = i === S.stage + 1;
    const side = i < S.stage ? '<span class="tag">지나옴</span>' : i === S.stage ? '<span class="tag now">지금</span>'
      : `<span class="row-cost">${won(st.cost)}</span>${next ? '<span class="lv">눌러서 확장</span>' : ''}`;
    const b = h('button', 'row' + (i === S.stage ? ' cur' : ''), `<span class="chip stage-chip" style="--sc:var(${st.stripe})">${i + 1}</span>
      <span class="row-main"><span class="row-name">${st.name}</span><span class="row-desc">${st.perk}</span></span>
      <span class="row-side">${side}</span>`);
    b.type = 'button';
    b.disabled = !next;
    if (next) {
      b.classList.toggle('can', S.money >= st.cost);
      b.addEventListener('click', () => {
        if (S.money < st.cost) return nudge(b);
        S.money -= st.cost;
        S.stage = i;
        save(); paintStage(); renderShopLists(); updateSheetMoney();
        toast('가게를 넓혔어요: ' + st.name, st.perk);
      });
    }
    sl.append(b);
  });
  for (const u of UPS) {
    const lvl = S.up[u.id];
    const locked = u.stage != null && S.stage < u.stage;
    const maxed = lvl >= u.levels.length;
    const capped = !maxed && u.cap && lvl >= u.cap(S);
    const cost = maxed ? 0 : u.levels[lvl];
    const desc = locked ? `${STAGES[u.stage].name}부터 살 수 있어요` : maxed ? '모두 갖췄어요' : capped ? u.capNote : u.fx(lvl);
    const lv = u.levels.length > 1 ? `<span class="lv">${lvl} / ${u.levels.length}단계</span>` : '';
    const b = h('button', 'row', `<span class="chip">${u.sign}</span>
      <span class="row-main"><span class="row-name">${u.name}</span><span class="${locked || capped || maxed ? 'row-desc' : 'row-fx'}">${desc}</span></span>
      <span class="row-side">${maxed ? '<span class="tag">완료</span>' : `<span class="row-cost">${won(cost)}</span>`}${lv}</span>`);
    b.type = 'button';
    b.disabled = locked || maxed || capped;
    if (!b.disabled) {
      b.classList.toggle('can', S.money >= cost);
      b.addEventListener('click', () => {
        if (S.money < cost) return nudge(b);
        S.money -= cost;
        S.up[u.id]++;
        if (MENU[u.id]) selected = u.id;
        save(); renderShopLists(); updateSheetMoney();
      });
    }
    ul.append(b);
  }
}
function updateSheetMoney() { const m = $('#sheetMoney'); if (m) m.textContent = won(S.money); updateHud(); }
function bindWipe() {
  const b = $('#wipeBtn');
  b.addEventListener('click', () => {
    if (Date.now() - confirmWipe > 4000) {
      confirmWipe = Date.now();
      b.classList.add('warn');
      b.textContent = '한 번 더 누르면 모든 기록이 사라져요';
      setTimeout(() => { if (b.isConnected && Date.now() - confirmWipe >= 4000) { b.classList.remove('warn'); b.textContent = '처음부터 다시 하기'; } }, 4100);
      return;
    }
    confirmWipe = 0;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    S = fresh();
    selected = 'red';
    openSheet('intro');
  });
}

/* ===== 화면 갱신·루프 ===== */
function updateHud() {
  els.money.textContent = won(S.money);
  els.todayMoney.textContent = won(G ? G.today.revenue + G.today.tips : 0);
  els.dayLabel.textContent = S.day + '일차';
  els.timeFill.style.width = (G ? G.time / DAY_LEN * 100 : 100) + '%';
  els.timeLabel.textContent = G ? (G.closing ? '마감' : fmtClock(G.time)) : fmtClock(DAY_LEN);
}
function step(dt) {
  if (!G.closing) {
    G.time -= dt;
    if (G.time <= 0) {
      G.time = 0;
      G.closing = true;
      els.timeBar.classList.add('closing');
      // 마감 뒤에는 기다리는 손님도 길어야 15초만 더 기다려요
      G.slots.forEach((c, k) => { if (!c) renderSlot(k); else c.left = Math.min(c.left, 15); });
      toast('마감 시간이에요', '기다리는 손님까지만 받고 문을 닫아요.');
    }
  }
  tickMolds(dt);
  tickCustomers(dt);
  if (G.closing && G.slots.every(c => !c)) endDay();
}
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);   // 탭을 떠나 있으면 사실상 멈춤
  last = now;
  if (G && els.overlay.hidden) {
    step(dt);
    if (G) {
      drawMolds();
      uiAcc += dt;
      if (uiAcc > 0.1) { uiAcc = 0; drawCustomers(); updateHud(); }
    }
  }
  requestAnimationFrame(frame);
}

function start(data) {
  S = (data && data.save && revive(data.save)) || load();
  if (S) openSheet('resume');
  else { S = fresh(); openSheet('intro'); }
  addEventListener('pagehide', save);
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save:JSON.parse(JSON.stringify(S)) }));
  requestAnimationFrame(frame);
}
window.claude && window.claude.hot && window.claude.hot.ready
  ? window.claude.hot.ready(start)
  : start(window.claude && window.claude.hot && window.claude.hot.data || {});
})();
</script>
</body>
