<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중심별</title>
<meta name="description" content="중심별을 눌러 별빛을 모으고, 별을 하나씩 밝혀 업그레이드 별자리를 바깥으로 넓혀 가는 클릭 게임.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbit&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 화면 전체가 밤하늘. 한가운데 중심별, 업그레이드 별들이 여섯 갈래로 퍼져 나간다. 왼쪽 위 계기판, 오른쪽(좁으면 아래) 별 정보. */
:root{
  color-scheme:dark;
  --void:#060913; --space:#0c1224; --panel:rgba(14,20,38,.9); --panel-solid:#0f1629; --line:#26304f; --line-2:#3a4672;
  --text:#eef1fb; --muted:#9ba5c7; --dim:#5d6789; --core:#fff3cf; --core-glow:rgba(255,214,110,.55);
  --b-click:#ffd66e; --b-auto:#7fd8ff; --b-amp:#c39bff; --b-luck:#ff8fb1; --b-meteor:#ffad66; --b-res:#8ff0b5; --b-link:#e2dbff; --b-deep:#fff3cf; --b-planet:#9ab6ff; --b-nova:#f477ff;
  --good:#8ff0b5; --shadow:rgba(0,0,0,.5);
  --f-display:"Orbit","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --t-xs:12px; --t-sm:13px; --t-md:15px; --t-lg:19px; --t-xl:28px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%; overflow:hidden}
body{margin:0; background:var(--void); color:var(--text); font-family:var(--f-body); font-size:var(--t-md); line-height:1.5; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit}
h1,h2,h3{margin:0; text-wrap:balance}

.stage{position:fixed; inset:0; touch-action:none; background:radial-gradient(70% 70% at 50% 50%,var(--space),var(--void))}
#sky,#tree{position:absolute; inset:0; width:100%; height:100%; display:block}
#tree{cursor:grab}
#tree.panning{cursor:grabbing}

/* 별 지도 */
.edge{stroke:var(--line-2); stroke-width:1.5; vector-effect:non-scaling-stroke; fill:none}
.edge.ghost{stroke:var(--line); stroke-dasharray:3 5}
.edge.lit{stroke:var(--c); stroke-width:2.5; opacity:.85}
.edge.cross{stroke:var(--c); stroke-dasharray:2 5; opacity:.7}
.edge.cross.lit{stroke-dasharray:6 4; opacity:.9}
.edge.cross.ghost{stroke:var(--c); opacity:.35}
/* 밝힌 선 위로 중심에서 바깥으로 흘러가는 빛 */
.flow{fill:none; stroke:var(--core); stroke-width:3; stroke-linecap:round; stroke-dasharray:1 23; vector-effect:non-scaling-stroke; opacity:.85; display:none; animation:flow 1.5s linear infinite}
.flow.on{display:inline}
@keyframes flow{to{stroke-dashoffset:-24}}
.corona{animation:breathe 4s ease-in-out infinite}
.rays{animation:spin 120s linear infinite}
.rays line{stroke:var(--core); stroke-linecap:round; opacity:.22}
@keyframes breathe{50%{transform:scale(1.08); opacity:.85}}
.stage-track{fill:none; stroke:var(--line-2); stroke-width:3; opacity:.6}
.track{fill:none; stroke-width:1; vector-effect:non-scaling-stroke; stroke-dasharray:2 8; opacity:.4}
.track.t-planet{stroke:var(--b-planet)} .track.t-nova{stroke:var(--b-nova)}
#tree.far .node:not(.can):not(.sel) .cost{display:none}
/* 중심별 둘레를 도는 행성 */
.planet{cursor:pointer; outline:none}
.planet .p-glow{fill:var(--pc); opacity:0}
.planet .p-arc{fill:none; stroke:var(--pc); stroke-width:2.5; stroke-linecap:round; transform:rotate(-90deg); opacity:.8}
.planet .p-body{fill:var(--pc); stroke:var(--void); stroke-width:1.5}
.planet .p-shine{fill:#ffffff; opacity:.55}
.planet .p-ring{fill:none; stroke:var(--pc); stroke-width:2; opacity:0}
.planet.ringed .p-ring{opacity:.9}
.planet:not(.ready) .p-body{opacity:.55}
.planet.ready .p-glow{animation:glow 1s ease-in-out infinite}
.planet:focus-visible .p-arc{stroke:var(--text)}
.nova-ring{fill:none; stroke:var(--b-nova); stroke-width:4; stroke-linecap:round; transform:rotate(-90deg); opacity:0; transition:opacity .3s}
.core.nova-on .nova-ring{opacity:.9}
.core.nova-full .nova-ring{animation:novaPulse .8s ease-in-out infinite}
@keyframes novaPulse{50%{opacity:.35}}
.corona-nova{opacity:0; transition:opacity .4s}
#coreGlow.nova-active .corona-nova{opacity:1; animation:breathe 1.2s ease-in-out infinite}
.chip.nova{pointer-events:auto; cursor:pointer; font:inherit; font-size:var(--t-xs); font-weight:700; background:var(--b-nova); color:var(--void); border-color:transparent; padding:3px 12px; animation:novaPulse 1s ease-in-out infinite}
.chip.nova-buff{background:var(--b-nova); color:var(--void); border-color:transparent}
.float.pl{color:var(--b-planet)}
/* 화면 전환 탭 */
.views{position:fixed; z-index:6; top:calc(env(safe-area-inset-top,0px) + 14px); left:50%; transform:translateX(-50%); display:flex; gap:4px; padding:4px; border-radius:12px; background:var(--panel); border:1px solid var(--line-2); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.views button{position:relative; border:0; background:transparent; color:var(--muted); font-weight:700; font-size:var(--t-sm); padding:7px 18px; border-radius:9px; cursor:pointer}
.views button[aria-selected="true"]{background:var(--panel-solid); color:var(--text); box-shadow:inset 0 0 0 1px var(--line-2)}
.views button:focus-visible{outline:2px solid var(--b-click); outline-offset:1px}
.views .dot{position:absolute; top:4px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--b-nova); display:none}
.views button.has .dot{display:block}
/* 은하(빅뱅 업그레이드) */
#galaxy{position:absolute; inset:0; width:100%; height:100%; display:block}
.arm{fill:none; stroke:var(--c); stroke-width:2; vector-effect:non-scaling-stroke; opacity:.55}
.arm-glow{fill:none; stroke:var(--c); stroke-width:46; stroke-linecap:round; opacity:.07}
.gnode{cursor:pointer; outline:none}
.gnode .hex{fill:var(--panel-solid); stroke:var(--c); stroke-width:2}
.gnode .ghalo{fill:var(--c); opacity:0}
.gnode .glab{fill:var(--text); font-family:var(--f-display); font-size:12px; text-anchor:middle; dominant-baseline:central; pointer-events:none}
.gnode .glv{fill:var(--muted); font-family:var(--f-display); font-size:11px; text-anchor:middle; dominant-baseline:central; paint-order:stroke; stroke:var(--void); stroke-width:3px; pointer-events:none}
.gnode.locked{opacity:.35}
.gnode.locked .hex{stroke-dasharray:3 4}
.gnode.own .hex{fill:var(--c); fill-opacity:.22}
.gnode.max .hex{fill:var(--c); fill-opacity:1; stroke:var(--text)}
.gnode.max .glab{fill:var(--void)}
.gnode.can .hex{stroke-width:3.5}
.gnode.can .ghalo{animation:glow 1.1s ease-in-out infinite}
.gnode.can .glv{fill:var(--c); font-weight:700}
.gnode.sel .hex{stroke:var(--text)}
.gnode:focus-visible .hex{stroke:var(--text); stroke-width:3}
.gal-core{cursor:pointer; outline:none}
.gal-core .swirl{animation:spin 50s linear infinite}
.gal-core .swirl ellipse{fill:none; stroke:var(--b-deep); stroke-width:1.5; opacity:.45}
.gal-core.ready .gc-ring{animation:novaPulse 1s ease-in-out infinite}
.gal-core .gc-ring{fill:none; stroke:var(--b-deep); stroke-width:2.5; opacity:.6}
.gal-core:focus-visible .gc-ring{stroke:var(--text); opacity:1}
/* 도감 */
.codex{position:fixed; z-index:4; overflow-y:auto; padding:6px 16px 24px; display:flex; flex-direction:column; gap:12px}
.codex-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.codex-head h2{font-family:var(--f-display); font-weight:400; font-size:var(--t-lg)}
.ach-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px}
.ach{display:flex; gap:12px; align-items:center; padding:12px; border-radius:14px; border:1px solid var(--line); background:var(--panel)}
.ach svg{flex:none; width:64px; height:44px}
.ach svg line{stroke:var(--line-2); stroke-width:1.5}
.ach svg circle{fill:var(--dim)}
.ach.done{border-color:var(--b-click); background:var(--panel-solid)}
.ach.done svg line{stroke:var(--b-click)}
.ach.done svg circle{fill:var(--core)}
.ach-main{display:flex; flex-direction:column; gap:3px; min-width:0; flex:1}
.ach-main b{font-weight:700}
.ach-main .goal{font-size:var(--t-xs); color:var(--muted)}
.ach-main .rw{font-size:var(--t-xs); color:var(--b-click); font-weight:700}
.ach:not(.done) .rw{color:var(--dim)}
.bar{height:5px; border-radius:3px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--b-click); border-radius:inherit}
.chip.bb{pointer-events:auto; cursor:pointer; font:inherit; font-size:var(--t-xs); font-weight:700; background:var(--b-deep); color:var(--void); border-color:transparent; padding:3px 12px}
.chip.all,.chip.ab{pointer-events:auto; cursor:pointer; font:inherit; font-size:var(--t-xs); font-weight:700; padding:3px 12px}
.chip.all{background:transparent; border-color:var(--b-click); color:var(--b-click)}
.chip.ab[aria-pressed="false"]{color:var(--muted)}
.chip.bb:focus-visible,.chip.all:focus-visible,.chip.ab:focus-visible{outline:2px solid var(--text); outline-offset:2px}
.btn.bang{background:var(--b-deep)}
.btn.bang.warn{background:var(--b-nova)}
.stage-ring{fill:none; stroke:var(--b-click); stroke-width:3.5; stroke-linecap:round; transform:rotate(-90deg); transition:stroke-dasharray .6s ease}
.node{cursor:pointer; outline:none}
.node .halo{fill:var(--c); opacity:0}
.node .avl{fill:none; stroke:var(--c); stroke-width:2.5; stroke-dasharray:5 5; opacity:0}
.node .disc{fill:var(--panel-solid); stroke:var(--c); stroke-width:2}
.node .prog{fill:none; stroke:var(--c); stroke-width:3; stroke-linecap:round; transform:rotate(-90deg); opacity:.9}
.node .lab{fill:var(--muted); font-family:var(--f-display); font-size:12px; text-anchor:middle; dominant-baseline:central; pointer-events:none}
.node .cost{fill:var(--dim); font-family:var(--f-display); font-size:11px; text-anchor:middle; dominant-baseline:central; pointer-events:none; paint-order:stroke; stroke:var(--void); stroke-width:3px}
.node .badge{display:none}
.node .badge circle{fill:var(--c)}
.node .badge path{fill:var(--void)}
/* 아직 살 수 없는 별: 흐리게 */
.node.avail .disc{stroke-dasharray:4 3; opacity:.5}
.node.avail .lab{fill:var(--dim)}
.node.lit .disc{fill:var(--c); fill-opacity:.2}
.node.lit .lab{fill:var(--muted)}
/* 지금 살 수 있는 별: 돌아가는 점선 고리 + 맥박 + ▲ 표시 + 밝은 값 */
.node.can .disc{opacity:1; stroke-dasharray:none; stroke-width:3}
.node.can .lab{fill:var(--text)}
.node.can .halo{animation:glow 1.1s ease-in-out infinite}
.node.can .avl{opacity:1; animation:spin 5s linear infinite}
.node.can .badge{display:inline}
.node.can .cost{fill:var(--c); font-size:12px; font-weight:700}
@keyframes glow{0%,100%{opacity:.18; transform:scale(1)}50%{opacity:.5; transform:scale(1.22)}}
@keyframes spin{to{transform:rotate(360deg)}}
.node.max .disc{fill:var(--c); fill-opacity:1; stroke:var(--text); opacity:1}
.node.max .lab{fill:var(--void)}
.node.sel .ring{opacity:1}
.node .ring{fill:none; stroke:var(--text); stroke-width:1.5; opacity:0}
.node:focus-visible .ring{opacity:1; stroke:var(--b-click)}
.node.ghost{pointer-events:none}
.node.ghost .disc{fill:var(--line); stroke:none}
.node.ghost.cross{pointer-events:auto}
.node.ghost.cross .disc{fill:var(--panel-solid); stroke:var(--c); stroke-dasharray:2 3; stroke-width:1.5}
.node.ghost.cross .lab{fill:var(--c)}
.node.fresh .ring{opacity:1; stroke:var(--c); stroke-width:2.5; transform-box:fill-box; transform-origin:center; animation:ping 1.3s ease-out infinite}
@keyframes ping{0%{transform:scale(.7); opacity:1}100%{transform:scale(1.9); opacity:0}}
.node.pop .disc{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.core{cursor:pointer; outline:none}
.core .body{transform-box:fill-box; transform-origin:center; transition:transform .08s}
.core.hit .body{animation:press .14s ease}
@keyframes press{50%{transform:scale(.9)}}
.core:focus-visible .focus{opacity:1}
.core .focus{fill:none; stroke:var(--b-click); stroke-width:2; opacity:0}

/* 계기판 */
.hud{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); left:16px; z-index:5; pointer-events:none; display:flex; flex-direction:column; gap:2px; max-width:calc(100% - 140px)}
.brand{display:flex; align-items:baseline; gap:10px}
.brand h1{font-family:var(--f-display); font-weight:400; font-size:var(--t-lg); letter-spacing:.04em}
.brand span{font-size:var(--t-sm); color:var(--b-click)}
.money{font-family:var(--f-display); font-size:var(--t-xl); line-height:1.15; font-variant-numeric:tabular-nums; word-break:keep-all}
.money small{font-family:var(--f-body); font-size:var(--t-sm); color:var(--muted); margin-left:6px}
.rates{font-size:var(--t-sm); color:var(--muted)}
.rates b{font-family:var(--f-display); font-weight:400; color:var(--text)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.chip{font-size:var(--t-xs); font-weight:700; border-radius:999px; padding:2px 10px; background:var(--panel); border:1px solid var(--line-2); color:var(--text); font-variant-numeric:tabular-nums}
.chip.buff{background:var(--b-meteor); color:var(--void); border-color:transparent}
.chip.go{pointer-events:auto; cursor:pointer; font:inherit; font-size:var(--t-xs); font-weight:700; background:var(--b-click); color:var(--void); border-color:transparent; padding:3px 12px}
.chip.go:focus-visible{outline:2px solid var(--text); outline-offset:2px}
.chip.idle{color:var(--muted)}
.tools{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); right:16px; z-index:5; display:flex; gap:8px}
.tbtn{border:1px solid var(--line-2); background:var(--panel); color:var(--text); border-radius:10px; padding:7px 12px; font-size:var(--t-sm); font-weight:700; cursor:pointer}
.tbtn:focus-visible{outline:2px solid var(--b-click); outline-offset:2px}
.tbtn[aria-pressed="false"]{color:var(--muted)}
.brand .next{font-size:var(--t-xs); color:var(--muted)}
/* 처음 하는 사람 안내 말풍선 */
.coach{position:fixed; z-index:9; left:0; top:0; transform:translate(-50%,-100%); pointer-events:none; padding:8px 12px; border-radius:10px; background:var(--core); color:var(--void); font-size:var(--t-sm); font-weight:700; white-space:nowrap; box-shadow:0 8px 24px var(--shadow); animation:bob 1.2s ease-in-out infinite}
.coach::after{content:""; position:absolute; left:50%; bottom:-6px; margin-left:-6px; border:6px solid transparent; border-bottom:0; border-top-color:var(--core)}
@keyframes bob{50%{margin-top:-6px}}
.impact{display:flex; flex-wrap:wrap; gap:6px}
.impact span{font-size:var(--t-xs); font-weight:700; border-radius:999px; padding:3px 10px; background:var(--panel-solid); border:1px solid var(--line-2); color:var(--muted)}
.impact b{color:var(--good); font-family:var(--f-display); font-weight:400; font-size:var(--t-sm)}

/* 별 정보 */
.info{position:fixed; z-index:6; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); width:340px; display:flex; flex-direction:column; gap:10px; padding:16px;
  background:var(--panel); border:1px solid var(--line-2); border-radius:16px; box-shadow:0 18px 40px var(--shadow); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.info .kicker{display:flex; align-items:center; gap:8px; font-size:var(--t-xs); font-weight:700; letter-spacing:.08em; color:var(--muted)}
.info .kicker i{width:10px; height:10px; border-radius:50%; background:var(--c)}
.info h2{font-family:var(--f-display); font-weight:400; font-size:var(--t-lg); line-height:1.2}
.info p{margin:0; font-size:var(--t-sm); color:var(--muted)}
.fxline{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; font-size:var(--t-sm)}
.fxline b{color:var(--c,var(--text))}
.lvbar{display:flex; gap:3px}
.lvbar i{flex:1; height:5px; border-radius:3px; background:var(--line)}
.lvbar i.on{background:var(--c)}
.actions{display:flex; gap:8px; flex-wrap:wrap}
.btn{flex:1 1 auto; border:0; border-radius:10px; padding:10px 14px; font-weight:700; font-size:var(--t-sm); background:var(--c,var(--b-click)); color:var(--void); cursor:pointer; font-variant-numeric:tabular-nums}
.btn.ghost{flex:0 1 auto; background:transparent; color:var(--text); box-shadow:inset 0 0 0 1px var(--line-2)}
.btn:disabled{background:var(--line); color:var(--dim); box-shadow:none; cursor:not-allowed}
.btn.warn{background:var(--b-luck); color:var(--void)}
.btn:focus-visible{outline:2px solid var(--text); outline-offset:2px}
.clues{list-style:none; margin:0; padding:10px 12px; display:flex; flex-direction:column; gap:6px; border-radius:10px; border:1px dashed var(--line-2); font-size:var(--t-sm); color:var(--muted)}
.clues b{color:var(--text)}
.clues .ok{color:var(--good)}
.chip.next{border-color:var(--b-deep); color:var(--b-deep)}
.legend{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 10px; margin:0; padding:0; list-style:none}
.legend li{display:flex; align-items:center; gap:6px; font-size:var(--t-xs); color:var(--muted)}
.legend i{width:8px; height:8px; border-radius:50%; background:var(--c)}
.shake{animation:shake .28s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}

/* 효과 */
.fx{position:fixed; inset:0; z-index:7; pointer-events:none; overflow:hidden}
.float{position:absolute; font-family:var(--f-display); font-size:18px; color:var(--core); text-shadow:0 0 8px var(--core-glow); white-space:nowrap; animation:rise .9s ease-out forwards}
.float.crit{font-size:26px; color:var(--b-luck); text-shadow:0 0 10px var(--b-luck)}
.float.big{font-size:26px; color:var(--b-meteor)}
.float.lvup{font-size:14px; color:var(--text); text-shadow:0 0 8px var(--shadow)}
@keyframes rise{from{opacity:1; transform:translate(-50%,-50%)}to{opacity:0; transform:translate(-50%,calc(-50% - 64px))}}
.meteor{position:fixed; z-index:8; left:0; top:0; width:120px; height:40px; padding:0; border:0; background:none; cursor:pointer}
.meteor svg{display:block; width:100%; height:100%; overflow:visible}
.meteor:focus-visible{outline:2px solid var(--b-meteor); outline-offset:4px}
.toasts{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 64px); transform:translateX(-50%); z-index:20; display:flex; flex-direction:column; gap:8px; width:min(calc(100vw - 32px),360px); pointer-events:none}
.toast{padding:10px 14px; border-radius:12px; border:1px solid var(--b-click); background:var(--panel-solid); box-shadow:0 12px 30px var(--shadow); animation:toast-in .25s ease; transition:opacity .3s,transform .3s}
.toast b{display:block; color:var(--b-click)}
.toast span{font-size:var(--t-sm); color:var(--muted)}
.toast.out{opacity:0; transform:translateY(-8px)}
@keyframes toast-in{from{opacity:0; transform:translateY(-10px)}}

.dialog{position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:16px; background:rgba(4,6,14,.7)}
.dialog .box{width:min(100%,420px); display:flex; flex-direction:column; gap:14px; padding:20px; border-radius:16px; background:var(--panel-solid); border:1px solid var(--line-2)}
.dialog h2{font-family:var(--f-display); font-weight:400; font-size:var(--t-lg)}
.stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:0}
.stats div{padding:8px 10px; border-radius:10px; border:1px solid var(--line); min-width:0}
.stats dt{font-size:var(--t-xs); color:var(--muted); font-weight:700}
.stats dd{margin:0; font-family:var(--f-display); overflow-wrap:anywhere}

@media (max-width:760px){
  .info{left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 50px); width:auto; border-radius:16px 16px 0 0; padding:12px 16px; gap:8px; max-height:44%; overflow-y:auto}
  .views{top:auto; bottom:0; left:0; right:0; transform:none; border-radius:0; border-width:1px 0 0; padding:5px 8px calc(env(safe-area-inset-bottom,0px) + 5px); gap:6px}

      case 'costDown': r.costMul *= 1 - n.v * lv; break;
      case 'meteor': r.meteor = true; break;
      case 'meteorFreq': r.meteorFreq *= Math.pow(n.v, lv); break;
      case 'meteorMul': r.meteorMul *= Math.pow(n.v, lv); break;
      case 'meteorDur': r.meteorDur += n.v * lv; break;
      case 'meteorSlow': r.meteorSlow = n.v; break;
      case 'perNode': r.perNode += n.v * lv; break;
      case 'autoClick': r.autoClick += n.v * lv; break;
      case 'offline': r.offline += n.v * lv; break;
      case 'planet': r.planets += n.v * lv; break;
      case 'planetMul': r.planetMul *= Math.pow(n.v, lv); break;
      case 'planetCd': r.planetCd *= Math.pow(n.v, lv); break;
      case 'nova': r.nova = true; break;
      case 'novaCharge': r.novaCharge += n.v * lv; break;
      case 'novaPower': r.novaPower += n.v * lv; break;
      case 'novaDur': r.novaDur += n.v * lv; break;
      case 'novaAuto': r.novaAuto += n.v * lv; break;
      case 'novaCrit': r.novaCrit += n.v * lv; break;
    }
  }
  // 은하(영구) 업그레이드
  r.shardMul = 1; r.double = 0; r.offlineCap = 8; r.autoBuy = 0; r.autoMeteor = false; r.autoPlanet = false; r.autoNova = false;
  for (const n of PRESTIGE) {
    const lv = puOf(s, n.id);
    if (!lv) continue;
    switch (n.k) {
      case 'all': r.all *= 1 + n.v * lv; break;
      case 'all2': r.all *= Math.pow(n.v, lv); break;
      case 'click': r.clickMul *= Math.pow(n.v, lv); break;
      case 'auto': r.autoMul *= Math.pow(n.v, lv); break;
      case 'discount': r.costMul *= 1 - n.v * lv; break;
      case 'crit': r.crit += n.v * lv; break;
      case 'double': r.double += n.v * lv; break;
      case 'meteorFreq': r.meteorFreq *= Math.pow(n.v, lv); break;
      case 'novaPower': r.novaPower += n.v * lv; break;
      case 'planet': r.planets += n.v * lv; break;
      case 'shard': r.shardMul *= 1 + n.v * lv; break;
      case 'offline': r.offline += 0.1 * lv; r.offlineCap += 4 * lv; break;
      case 'autoBuy': r.autoBuy = AUTO_BUY[Math.min(lv, 3)]; break;
      case 'autoMeteor': r.autoMeteor = true; break;
      case 'autoPlanet': r.autoPlanet = true; break;
      case 'autoNova': r.autoNova = true; break;
    }
  }
  // 도감 보너스
  const ach = { all:0, click:0, crit:0, critMul:0, meteor:0, planet:0, nova:0, shard:0 };
  for (const id in (s.ach || {})) { const a = ACH[id]; if (a) for (const k in a.fx) ach[k] += a.fx[k]; }
  r.all *= 1 + ach.all; r.clickMul *= 1 + ach.click; r.crit += ach.crit; r.critMul += ach.critMul;
  r.meteorMul *= 1 + ach.meteor; r.planetMul *= 1 + ach.planet; r.novaPower += ach.nova; r.shardMul *= 1 + ach.shard;
  r.all *= 1 + r.perNode * r.lit;
  r.crit = Math.min(1, r.crit);
  r.auto = r.autoAdd * r.autoMul * r.all;                                   // 위성 수입
  r.click = r.clickAdd * r.clickMul * r.all + r.fromAuto * r.auto;          // 섬광 전 한 번
  r.clickAvg = (r.click * (1 + r.crit * (r.critMul - 1)) + r.crit * r.critSec * r.auto) * (1 + r.double);
  r.perSec = r.auto + r.autoClick * r.clickAvg;                             // 가만히 있어도 들어오는 별빛
  return r;
}

// 별 효과를 사람이 읽는 말로
function effText(n, lv) {
  const v = n.v, f = x => fmt(x);
  switch (n.k) {
    case 'clickAdd': return `클릭당 +${f(v * lv)}`;
    case 'clickMul': return `클릭 ×${Math.pow(v, lv) < 1e4 ? trim(Math.pow(v, lv)) : f(Math.pow(v, lv))}`;
    case 'autoAdd': return `초당 +${f(v * lv)}`;
    case 'autoMul': return `위성 수입 ×${trim(Math.pow(v, lv))}`;
    case 'allMul': return `모든 별빛 ×${trim(Math.pow(v, lv))}`;
    case 'combo': return `연타 보너스 최대 +${Math.round(v * lv * 100)}%`;
    case 'critChance': return `섬광 확률 +${Math.round(v * lv * 100)}%`;
    case 'critMul': return `섬광 배율 ×${CRIT_BASE + v * lv}`;
    case 'critSec': return `섬광 때 위성 수입 ${v * lv}초치 추가`;
    case 'fromAuto': return `클릭마다 위성 수입의 ${Math.round(v * lv * 100)}% 추가`;
    case 'costDown': return `별 밝히는 값 −${Math.round(v * lv * 100)}%`;
    case 'meteor': return lv ? '유성이 지나가요' : '유성이 아직 없어요';
    case 'meteorFreq': return `유성 간격 −${Math.round((1 - Math.pow(v, lv)) * 100)}%`;
    case 'meteorMul': return `유성 별빛 ×${trim(Math.pow(v, lv))}`;
    case 'meteorDur': return `유성 효과 +${v * lv}초`;
    case 'meteorSlow': return lv ? '유성이 두 배 천천히' : '보통 속도';
    case 'perNode': return `밝힌 별 하나마다 모든 별빛 +${Math.round(v * lv * 100)}%`;
    case 'autoClick': return `초당 ${trim(v * lv)}번 저절로 반짝`;
    case 'offline': return `자리 비운 동안 ${Math.round((0.5 + v * lv) * 100)}% 모으기`;
    case 'planet': return lv ? '행성이 하나 더 돌아요' : '행성이 아직 없어요';
    case 'planetMul': return `행성 별빛 ×${trim(Math.pow(v, lv))}`;
    case 'planetCd': return `행성 충전 시간 −${Math.round((1 - Math.pow(v, lv)) * 100)}%`;
    case 'nova': return lv ? '초신성 게이지가 생겨요' : '게이지가 아직 없어요';
    case 'novaCharge': return `게이지 차는 속도 +${Math.round(v * lv * 100)}%`;
    case 'novaPower': return `폭발 배율 ×${3 + v * lv}`;
    case 'novaDur': return `폭발 시간 ${8 + v * lv}초`;
    case 'novaAuto': return `게이지가 초당 ${trim(v * lv)}%씩 저절로 차요`;
    case 'novaCrit': return `폭발하는 동안 섬광 확률 +${Math.round(v * lv * 100)}%`;
  }
}
function nodeLabel(n) {
  return { clickAdd:'+' + fmt(n.v), clickMul:'×' + n.v, autoAdd:'+' + fmt(n.v) + '/s', autoMul:'×' + n.v, allMul:'×' + n.v, combo:'연타',
    critChance:Math.round(n.v * 100) + '%', critMul:'+' + n.v + '배', critSec:'+' + n.v + '초', fromAuto:Math.round(n.v * 100) + '%', costDown:'−' + Math.round(n.v * 100) + '%',
    meteor:'유성', meteorFreq:'자주', meteorMul:'×' + n.v, meteorDur:'+' + n.v + '초', meteorSlow:'느리게', perNode:'+' + Math.round(n.v * 100) + '%',
    autoClick:'자동', offline:'기억', planet:'행성', planetMul:'×' + n.v, planetCd:'공전', nova:'초신성', novaCharge:'충전',
    novaPower:'+' + n.v + '배', novaDur:'+' + n.v + '초', novaAuto:'연쇄', novaCrit:'감마' }[n.k];
}
const trim = x => (Math.round(x * 100) / 100).toLocaleString('ko-KR');

// 이번 우주에서 모은 별빛으로 받는 성운 조각
// 별빛 1억부터 1개, 자릿수가 늘수록 제곱으로 늘어요 (10억 4개 · 1조 25개 · 1경 81개)
const shardsFor = (run, d) => run < SHARD_UNIT ? 0 : Math.floor(Math.pow(Math.log10(run / SHARD_UNIT) + 1, 2) * d.shardMul);
// 조각을 하나 더 받으려면 모아야 할 별빛
const nextShardAt = (run, d) => { const n = shardsFor(run, d) + 1; return SHARD_UNIT * Math.pow(10, Math.sqrt(n / d.shardMul) - 1); };
const KUNITS = [[1e44,'재'],[1e40,'정'],[1e36,'간'],[1e32,'구'],[1e28,'양'],[1e24,'자'],[1e20,'해'],[1e16,'경'],[1e12,'조'],[1e8,'억'],[1e4,'만']];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1e4) return (n < 100 && n % 1 ? Math.round(n * 10) / 10 : Math.floor(n)).toLocaleString('ko-KR');
  if (n >= 1e48) return n.toExponential(2);
  for (const [u, name] of KUNITS) if (n >= u) {
    const v = n / u;
    return (v >= 1000 ? Math.floor(v).toLocaleString('ko-KR') : v >= 100 ? v.toFixed(1) : v.toFixed(2)) + name;
  }
}
function fmtTime(sec) {
  sec = Math.floor(sec);
  const hh = Math.floor(sec / 3600), mm = Math.floor(sec % 3600 / 60), ss = sec % 60;
  return hh ? `${hh}시간 ${mm}분` : mm ? `${mm}분 ${ss}초` : `${ss}초`;
}

<script>
"use strict";
/* ===== 화면과 조작 ===== */
(() => {
const SAVE_KEY = 'center-star-v1';
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = sel => document.querySelector(sel);
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

let S, D;
let sel = null, combo = 0, lastClickAt = 0, meteorIn = 45, meteorAlive = false, meteorAnim = null;
let last = performance.now(), uiAcc = 1, saveAcc = 0, lastStage = '', confirmWipe = 0;
const view = { x:0, y:0, s:1 }, target = { x:0, y:0, s:1 };
let panGoal = null;

const nodeEls = {}, edgeEls = {};
const particles = [], rings = [];
let flash = 0, shakeT = 0, shownMoney = 0;

const els = {
  stage:$('#stage'), sky:$('#sky'), svg:$('#tree'), world:$('#world'), edges:$('#edges'), nodes:$('#nodes'), core:$('#core'), coreGlow:$('#coreGlow'),
  money:$('#money'), rate:$('#rate'), perClick:$('#perClick'), stageName:$('#stageName'), stageNext:$('#stageNext'), chips:$('#chips'),
  stageRing:$('#stageRing'), rays:$('#rays'), coach:$('#coach'), soundBtn:$('#soundBtn'),
  tracks:$('#tracks'), planets:$('#planets'), novaRing:$('#novaRing'),
  galaxy:$('#galaxy'), galWorld:$('#galWorld'), galArms:$('#galArms'), galCore:$('#galCore'), gnodes:$('#gnodes'),
  codex:$('#codex'), views:$('#views'), shardInfo:$('#shardInfo'), fitBtn:$('#fitBtn'),
  info:$('#info'), fx:$('#fx'), meteor:$('#meteor'), toasts:$('#toasts'),
  statsDialog:$('#statsDialog'), stats:$('#stats'), wipeBtn:$('#wipeBtn'),

/* --- 상태 --- */
function fresh() {
  return { v:1, money:0, total:0, run:0, clicks:0, crits:0, meteors:0, planetHits:0, novas:0, nova:0, lv:{}, buffs:[], playSec:0, lastSeen:Date.now(),
    pu:{}, ach:{}, achNew:0, shards:0, shardsTotal:0, rebirths:0, autoBuyOn:true };
}
function revive(o) {
  if (!o || o.v !== 1) return null;
  const s = Object.assign(fresh(), o);
  s.lv = {};
  for (const id in o.lv || {}) if (NODE[id]) s.lv[id] = Math.min(NODE[id].max, o.lv[id] | 0);
  s.buffs = (o.buffs || []).filter(b => b.until > Date.now());

  return s;
}
function load() { try { const raw = localStorage.getItem(SAVE_KEY); return raw ? revive(JSON.parse(raw)) : null; } catch (e) { return null; } }
function save() { S.lastSeen = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 저장 불가: 이번 세션만 유지 */ } }

const shower = () => S.buffs.some(b => b.kind === 'shower');
const novaOn = () => S.buffs.some(b => b.kind === 'nova');
const buffMul = () => (shower() ? 3 : 1) * (novaOn() ? D.novaPower : 1);
const perSecNow = () => D.perSec * buffMul();
const comboMul = () => 1 + Math.min(D.combo, Math.max(0, combo - 1) * 0.01);
function recompute() { D = derive(S); }
function earn(v) { S.money += v; S.total += v; S.run += v; }

/* --- 효과 --- */
function floatText(x, y, text, cls) {

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {

    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 160;

// 화면 공간에서 퍼지는 고리(충격파)
function ring(x, y, r0, r1, life, color, w) { if (rings.length < 40) rings.push({ x, y, r0, r1, life, age:0, color, w:w || 2 }); }

/* --- 소리: 파일 없이 바로 합성해요 --- */
const Sound = (() => {
  let ac = null, master = null, on = true;
  try { on = localStorage.getItem('center-star-sound') !== 'off'; } catch (e) {}
  function ready() {
    if (!on) return null;
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;

    }
    if (ac.state === 'suspended') ac.resume();
    return ac;

    const a = ready(); if (!a) return;
    const t0 = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();

  const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];   // 5음계: 연타할수록 올라가요
  return {

    reveal() { [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) => tone(f, 0.45, 'sine', 0.13, i * 0.08)); },
    stage() { [392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.6, 'triangle', 0.13, i * 0.1)); },
    meteor() { tone(1400, 0.9, 'sine', 0.05, 0, 500); },
    catch() { [783.99, 1046.5, 1567.98].forEach((f, i) => tone(f, 0.3, 'triangle', 0.16, i * 0.06)); },
    deny() { tone(196, 0.14, 'square', 0.05); },
    planet() { tone(880, 0.25, 'triangle', 0.16); tone(1318.51, 0.35, 'sine', 0.12, 0.07); },
    bang() { tone(330, 1.8, 'sawtooth', 0.08, 0, 40); [261.63, 329.63, 392, 523.25, 659.25, 1046.5].forEach((f, i) => tone(f, 1.6, 'sine', 0.1, 0.5 + i * 0.09)); },
    ach() { [659.25, 783.99, 987.77, 1318.51].forEach((f, i) => tone(f, 0.4, 'triangle', 0.13, i * 0.07)); },
    novaReady() { tone(392, 0.7, 'sine', 0.12, 0, 1568); },
    nova() { [130.81, 196, 261.63, 392, 523.25, 783.99, 1046.5].forEach((f, i) => tone(f, 1.4, i < 3 ? 'triangle' : 'sine', 0.12, i * 0.04)); },

})();
function paintSoundBtn() { els.soundBtn.textContent = Sound.on ? '소리 켬' : '소리 끔'; els.soundBtn.setAttribute('aria-pressed', String(Sound.on)); }

/* --- 별자리 그리기 --- */

/* --- 루프 --- */
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 5) {
    // 탭을 떠나 있던 동안에도 위성은 돌아요
    const g = D.perSec * Math.min(dt, D.offlineCap * 3600);
    earn(g);
    if (dt > 60 && g > 0) toast('다녀오셨어요', `${fmtTime(dt)} 동안 별빛 ${fmt(g)}을 모았어요.`);
    dt = 0;
  }
  S.playSec += dt;
  const nowMs = Date.now();
  if (S.buffs.some(b => b.until <= nowMs)) S.buffs = S.buffs.filter(b => b.until > nowMs);
  earn(perSecNow() * dt);
  if (now / 1000 - lastClickAt > COMBO_WINDOW) combo = 0;
  if (D.meteor && !meteorAlive && (meteorIn -= dt) <= 0) launchMeteor();
  if (D.novaAuto) chargeNova(D.novaAuto * dt);
  if (D.autoBuy && S.autoBuyOn !== false && (autoAcc += dt) >= D.autoBuy) {
    autoAcc = 0;
    const l = affordableList();
    if (l.length) buy(l[0].id, true);
  }
  updatePlanets(dt);
  paintNova();
  if (panGoal && !follow) {
    const t = 1 - Math.exp(-dt * 8);
    view.x += (panGoal.x - view.x) * t; view.y += (panGoal.y - view.y) * t;
    applyView();
    if (Math.hypot(panGoal.x - view.x, panGoal.y - view.y) < 0.5) panGoal = null;
  }
  if (follow) {
    const t = 1 - Math.exp(-dt * 5);
    const ds = target.s - view.s;
    view.x += (target.x - view.x) * t; view.y += (target.y - view.y) * t; view.s += ds * t;
    applyView();
    if (Math.abs(ds) > 1e-4) placeNodes();
  }
  if (shakeT > 0) {
    shakeT = Math.max(0, shakeT - dt);
    const m = shakeT * 18;
    els.world.setAttribute('transform', `translate(${view.x + (Math.random() - 0.5) * m} ${view.y + (Math.random() - 0.5) * m}) scale(${view.s})`);
    if (shakeT === 0) applyView();
  }
  drawSky(dt, now);
  updateMoney(dt);
  positionCoach();
  uiAcc += dt; saveAcc += dt;
  if (uiAcc > 0.15) { uiAcc = 0; updateHud(); updateCoach(); }
  if (saveAcc > 5) { saveAcc = 0; save(); }
  requestAnimationFrame(frame);
}

const PLANET_CD = 30;   // 행성이 다시 빛날 때까지(초)
function syncPlanets() {
  while (planets.length < Math.min(3, D.planets)) {
    const i = planets.length;

    g.style.setProperty('--pc', PLANET_TINTS[i]);

      '<ellipse class="p-ring" rx="15" ry="4.5" transform="rotate(-22)"/><circle class="p-body" r="' + [9, 8, 11][i] + '"/><circle class="p-shine" cx="-3" cy="-3" r="2.5"/>';
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapPlanet(i); } });
    els.planets.append(g);
    planets.push({ el:g, arc:g.querySelector('.p-arc'), phase:i * 2.1, speed:[0.32, -0.24, 0.18][i], off:[0, 7, -6][i], charge:0.6, x:0, y:0 });

}
function updatePlanets(dt) {

  const k = (narrow() ? 0.8 : 1) / view.s, cd = PLANET_CD * D.planetCd, ringed = lvOf(S, 'p3') > 0;
  for (const p of planets) {

  let k = 0;
  for (let i = 0; i < 200; i++) {
    const l = PRESTIGE.filter(n => pOpen(S, n) && puOf(S, n.id) < n.max && pCost(n, puOf(S, n.id)) <= S.shards).sort((a, b) => pCost(a, puOf(S, a.id)) - pCost(b, puOf(S, b.id)));
    if (!l.length || !buyP(l[0].id, true)) break;
    k++;
  }
  if (k) { Sound.buy(); toast('은하를 키웠어요', `영구 업그레이드 ${k}단계를 한 번에 올렸어요.`); renderInfo(); }
}
function renderGalaxyInfo() {
  const box = els.info;
  if (!selG) {
    // 빅뱅 안내
    box.style.setProperty('--c', 'var(--b-deep)');
    const gain = shardsFor(S.run, D), next = nextShardAt(S.run, D);
    box.innerHTML = `<div class="kicker"><i></i>빅뱅 · 지금은 ${(S.rebirths || 0) + 1}번째 우주</div>
      <h2>빅뱅으로 새 우주를</h2>
      <p>밝힌 별과 별빛을 모두 내려놓고 작은 별 하나에서 다시 시작해요. 대신 성운 조각을 받아 은하를 영구히 키워요. 은하 업그레이드와 도감은 그대로 남아요.</p>
      <div class="impact"><span>가진 성운 조각 <b>${fmt(S.shards)}</b></span><span>이번 우주 별빛 <b>${fmt(S.run)}</b></span></div>
      <div class="fxline">${gain >= 1 ? `지금 빅뱅하면 <b>성운 조각 +${fmt(gain)}</b>` : `별빛을 <b>${fmt(SHARD_UNIT)}</b> 모으면 빅뱅할 수 있어요`}</div>
      <p>${gain >= 1 ? `별빛을 ${fmt(Math.max(0, next - S.run))} 더 모으면 조각이 하나 더 늘어요.` : `지금 ${fmt(S.run)} / ${fmt(SHARD_UNIT)}`}</p>
      <div class="actions"></div>`;
    const acts = box.querySelector('.actions');
    const bb = h('button', 'btn bang');
    bb.type = 'button'; bb.id = 'bangBtn';
    bb.textContent = gain >= 1 ? `빅뱅하기 · 조각 +${fmt(gain)}` : '아직 빅뱅할 수 없어요';
    bb.disabled = gain < 1;
    bb.addEventListener('click', () => {
      if (Date.now() - confirmBang > 4000) {
        confirmBang = Date.now();
        bb.classList.add('warn'); bb.textContent = '한 번 더 누르면 새 우주가 시작돼요';
        setTimeout(() => { if (bb.isConnected && bb.classList.contains('warn')) { bb.classList.remove('warn'); bb.textContent = `빅뱅하기 · 조각 +${fmt(shardsFor(S.run, D))}`; } }, 4000);
        return;
      }
      confirmBang = 0;
      bigBang();
    });
    const ba = h('button', 'btn ghost');
    ba.type = 'button'; ba.id = 'buyAllP'; ba.textContent = '모두 키우기';
    ba.addEventListener('click', buyAllP);
    acts.append(bb, ba);
    return;
  }
  const n = PNODE[selG], arm = ARMS[n.arm], lv = puOf(S, n.id), max = lv >= n.max, open = pOpen(S, n), cost = max ? 0 : pCost(n, lv);
  box.style.setProperty('--c', arm.color);
  box.innerHTML = `<div class="kicker"><i></i>은하 · ${arm.name} · ${lv} / ${n.max}단계</div>
    <h2>${n.name}</h2>
    <p>${n.desc}</p>
    <div class="lvbar" aria-hidden="true">${Array.from({ length:n.max }, (_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('')}</div>
    <div class="fxline">${lv ? `<span>지금 <b>${pEffText(n, lv)}</b></span>` : ''}${max ? '' : `<span>${lv ? '→ 다음' : '사면'} <b>${pEffText(n, lv + 1)}</b></span>`}</div>
    <p>빅뱅해도 사라지지 않는 영구 업그레이드예요.</p>
    <div class="actions"></div>`;
  const acts = box.querySelector('.actions');
  const b = h('button', 'btn');
  b.type = 'button'; b.id = 'buyP';
  b.textContent = max ? '다 키웠어요' : !open ? `앞의 ‘${n.prev.name}’을(를) 먼저 키워요` : `키우기 · 성운 조각 ${fmt(cost)}`;
  b.disabled = max || !open || cost > S.shards;
  b.addEventListener('click', () => buyP(n.id));
  acts.append(b);
}
function refreshGalaxyButtons() {
  const b = document.getElementById('buyP');
  if (b && selG) { const n = PNODE[selG], lv = puOf(S, n.id); if (lv < n.max && pOpen(S, n)) b.disabled = pCost(n, lv) > S.shards; }
  const bb = document.getElementById('bangBtn');
  if (bb && !selG && !bb.classList.contains('warn')) { const gain = shardsFor(S.run, D); bb.disabled = gain < 1; bb.textContent = gain >= 1 ? `빅뱅하기 · 조각 +${fmt(gain)}` : '아직 빅뱅할 수 없어요'; }
}
function bigBang() {
  const gain = shardsFor(S.run, D);
  if (gain < 1) return;
  if (!calm) { flash = 0.8; shakeT = 0.4; }
  const cx = innerWidth / 2, cy = innerHeight / 2;
  ring(cx, cy, 10, Math.max(innerWidth, innerHeight), 1.8, COLORS.core, 5);
  ring(cx, cy, 10, Math.max(innerWidth, innerHeight) * 0.7, 1.4, COLORS.nova, 3);
  burst(cx, cy, COLORS.core, 60);
  Sound.bang();
  S.shards += gain; S.shardsTotal = (S.shardsTotal || 0) + gain; S.rebirths = (S.rebirths || 0) + 1;
  S.lv = {}; S.run = 0; S.buffs = []; S.nova = 0;
  S.money = START_MONEY[Math.min(5, puOf(S, 'g2'))];
  if (puOf(S, 'g3')) for (const n of NODES) if (!n.p && !n.req && !n.total) S.lv[n.id] = 1;
  for (const k in freshUntil) delete freshUntil[k];
  boot();
  selG = null;
  setView('galaxy');
  toast('빅뱅! 새 우주가 열렸어요', `성운 조각 ${fmt(gain)}개를 받았어요. 은하에서 영구 업그레이드를 골라 보세요.`);
  save();
}

/* --- 도감 --- */
function consSvg(id) {
  // 별자리 그림: 이름에서 정해지는 점 다섯 개를 이어요
  let h0 = 0;
  for (const ch of id) h0 = (h0 * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { h0 = (h0 * 1103515245 + 12345) >>> 0; return (h0 >>> 8) / 16777216; };
  const pts = Array.from({ length:5 }, (_, i) => [8 + i * 12 + rnd() * 6, 8 + rnd() * 28]);
  const lines = pts.slice(1).map((p, i) => `<line x1="${pts[i][0].toFixed(1)}" y1="${pts[i][1].toFixed(1)}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}"/>`).join('');
  return `<svg viewBox="0 0 64 44" aria-hidden="true">${lines}${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6"/>`).join('')}</svg>`;
}
function renderCodex() {
  const done = Object.keys(S.ach).length;
  els.codex.innerHTML = `<div class="codex-head"><h2>별자리 도감</h2><span class="muted" style="color:var(--muted);font-size:var(--t-sm)">${done} / ${ACHS.length} 완성 · 보너스는 빅뱅해도 남아요</span></div>
    <div class="ach-grid">${ACHS.map(a => {
      const ok = !!S.ach[a.id], [cur, goal] = a.prog(S, D), pct = Math.min(1, cur / goal);
      return `<div class="ach${ok ? ' done' : ''}">${consSvg(a.id)}<div class="ach-main"><b>${a.name}</b><span class="goal">${a.goal}${ok ? ' · 완성' : ` · ${fmt(Math.min(cur, goal))} / ${fmt(goal)}`}</span>
        <div class="bar"><i style="width:${(pct * 100).toFixed(1)}%"></i></div><span class="rw">${achFxText(a.fx)}</span></div></div>`;
    }).join('')}</div>`;
}
function layoutCodex() {
  // 도감은 계기판 아래부터 채워요
  const a = area(), top = Math.max(a.y, document.querySelector('.hud').getBoundingClientRect().bottom + 10);
  Object.assign(els.codex.style, { left:a.x + 'px', top:top + 'px', width:a.w + 'px', height:(a.y + a.h - top) + 'px' });
}
function renderCodexInfo() {
  const box = els.info, sum = {};
  for (const id in S.ach) for (const k in ACH[id].fx) sum[k] = (sum[k] || 0) + ACH[id].fx[k];
  box.style.setProperty('--c', 'var(--b-click)');
  box.innerHTML = `<div class="kicker"><i></i>도감 · ${Object.keys(S.ach).length} / ${ACHS.length}</div>
    <h2>해내면 열리는 업그레이드</h2>
    <p>도감의 별자리는 별빛으로 사지 않아요. 적힌 목표를 해내면 저절로 완성되고, 보너스가 영구히 붙어요.</p>
    <div class="fxline">${Object.keys(sum).length ? `지금까지 받은 보너스 <b>${achFxText(sum)}</b>` : '아직 완성한 별자리가 없어요'}</div>`;
}
function checkAch() {
  const got = ACHS.filter(a => { if (S.ach[a.id]) return false; const [cur, goal] = a.prog(S, D); return cur >= goal; });
  if (!got.length) return;
  for (const a of got) S.ach[a.id] = Date.now();
  S.achNew = (S.achNew || 0) + got.length;
  recompute();
  for (const a of got) toast('도감 별자리 완성: ' + a.name, achFxText(a.fx) + ' · 영구 보너스');
  Sound.ach();
  if (curView === 'codex') { S.achNew = 0; renderCodex(); renderInfo(); }
}
function start(data) {
  S = (data && data.save && revive(data.save)) || load() || fresh();
  readColors();
  buildRays();
  buildGalaxy();
  paintSoundBtn();
  sizeSky();
  boot();
  const away = (Date.now() - S.lastSeen) / 1000;
  if (away > 60 && D.perSec > 0) {
    const secs = Math.min(away, D.offlineCap * 3600), g = D.perSec * secs * D.offline;
    earn(g);
    toast('위성들이 일하고 있었어요', `자리를 비운 ${fmtTime(secs)} 동안 별빛 ${fmt(g)}을 모았어요.`);
  }
  addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  addEventListener('pagehide', save);
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save:JSON.parse(JSON.stringify(S)) }));
  last = performance.now();
  requestAnimationFrame(frame);
}
window.claude && window.claude.hot && window.claude.hot.ready
  ? window.claude.hot.ready(start)
  : start(window.claude && window.claude.hot && window.claude.hot.data || {});
})();
</script>
