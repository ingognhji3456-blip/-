<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중심별</title>
<meta name="description" content="중심별을 눌러 별빛을 모으고, 별을 하나씩 밝혀 업그레이드 별자리를 바깥으로 넓혀 가는 클릭 게임.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbit&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 화면 전체가 밤하늘. 한가운데 중심별, 업그레이드 별들이 여섯 갈래로 퍼져 나간다. 왼쪽 위 계기판, 오른쪽(좁으면 아래) 별 정보. */
:root{
  color-scheme:dark;
  --void:#060913; --space:#0c1224; --panel:rgba(14,20,38,.9); --panel-solid:#0f1629; --line:#26304f; --line-2:#3a4672;
  --text:#eef1fb; --muted:#9ba5c7; --dim:#5d6789; --core:#fff3cf; --core-glow:rgba(255,214,110,.55);
  --b-click:#ffd66e; --b-auto:#7fd8ff; --b-amp:#c39bff; --b-luck:#ff8fb1; --b-meteor:#ffad66; --b-res:#8ff0b5; --b-link:#e2dbff; --b-deep:#fff3cf;
  --good:#8ff0b5; --shadow:rgba(0,0,0,.5);
  --f-display:"Orbit","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --t-xs:12px; --t-sm:13px; --t-md:15px; --t-lg:19px; --t-xl:28px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%; overflow:hidden}
body{margin:0; background:var(--void); color:var(--text); font-family:var(--f-body); font-size:var(--t-md); line-height:1.5; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit}
h1,h2,h3{margin:0; text-wrap:balance}

.stage{position:fixed; inset:0; touch-action:none; background:radial-gradient(70% 70% at 50% 50%,var(--space),var(--void))}
#sky,#tree{position:absolute; inset:0; width:100%; height:100%; display:block}
#tree{cursor:grab}
#tree.panning{cursor:grabbing}

/* 별 지도 */
.edge{stroke:var(--line-2); stroke-width:1.5; vector-effect:non-scaling-stroke; fill:none}
.edge.ghost{stroke:var(--line); stroke-dasharray:3 5}
.edge.lit{stroke:var(--c); stroke-width:2.5; opacity:.85}
.edge.cross{stroke:var(--c); stroke-dasharray:2 5; opacity:.7}
.edge.cross.lit{stroke-dasharray:6 4; opacity:.9}
.edge.cross.ghost{stroke:var(--c); opacity:.35}
/* 밝힌 선 위로 중심에서 바깥으로 흘러가는 빛 */
.flow{fill:none; stroke:var(--core); stroke-width:3; stroke-linecap:round; stroke-dasharray:1 23; vector-effect:non-scaling-stroke; opacity:.85; display:none; animation:flow 1.5s linear infinite}
.flow.on{display:inline}
@keyframes flow{to{stroke-dashoffset:-24}}
.corona{animation:breathe 4s ease-in-out infinite}
.rays{animation:spin 120s linear infinite}
.rays line{stroke:var(--core); stroke-linecap:round; opacity:.22}
@keyframes breathe{50%{transform:scale(1.08); opacity:.85}}
.stage-track{fill:none; stroke:var(--line-2); stroke-width:3; opacity:.6}
.stage-ring{fill:none; stroke:var(--b-click); stroke-width:3.5; stroke-linecap:round; transform:rotate(-90deg); transition:stroke-dasharray .6s ease}
.node{cursor:pointer; outline:none}
.node .halo{fill:var(--c); opacity:0}
.node .avl{fill:none; stroke:var(--c); stroke-width:2.5; stroke-dasharray:5 5; opacity:0}
.node .disc{fill:var(--panel-solid); stroke:var(--c); stroke-width:2}
.node .prog{fill:none; stroke:var(--c); stroke-width:3; stroke-linecap:round; transform:rotate(-90deg); opacity:.9}
.node .lab{fill:var(--muted); font-family:var(--f-display); font-size:12px; text-anchor:middle; dominant-baseline:central; pointer-events:none}
.node .cost{fill:var(--dim); font-family:var(--f-display); font-size:11px; text-anchor:middle; dominant-baseline:central; pointer-events:none; paint-order:stroke; stroke:var(--void); stroke-width:3px}
.node .badge{display:none}
.node .badge circle{fill:var(--c)}
.node .badge path{fill:var(--void)}
/* 아직 살 수 없는 별: 흐리게 */
.node.avail .disc{stroke-dasharray:4 3; opacity:.5}
.node.avail .lab{fill:var(--dim)}
.node.lit .disc{fill:var(--c); fill-opacity:.2}
.node.lit .lab{fill:var(--muted)}
/* 지금 살 수 있는 별: 돌아가는 점선 고리 + 맥박 + ▲ 표시 + 밝은 값 */
.node.can .disc{opacity:1; stroke-dasharray:none; stroke-width:3}
.node.can .lab{fill:var(--text)}
.node.can .halo{animation:glow 1.1s ease-in-out infinite}
.node.can .avl{opacity:1; animation:spin 5s linear infinite}
.node.can .badge{display:inline}
.node.can .cost{fill:var(--c); font-size:12px; font-weight:700}
@keyframes glow{0%,100%{opacity:.18; transform:scale(1)}50%{opacity:.5; transform:scale(1.22)}}
@keyframes spin{to{transform:rotate(360deg)}}
.node.max .disc{fill:var(--c); fill-opacity:1; stroke:var(--text); opacity:1}
.node.max .lab{fill:var(--void)}
.node.sel .ring{opacity:1}
.node .ring{fill:none; stroke:var(--text); stroke-width:1.5; opacity:0}
.node:focus-visible .ring{opacity:1; stroke:var(--b-click)}
.node.ghost{pointer-events:none}
.node.ghost .disc{fill:var(--line); stroke:none}
.node.ghost.cross{pointer-events:auto}
.node.ghost.cross .disc{fill:var(--panel-solid); stroke:var(--c); stroke-dasharray:2 3; stroke-width:1.5}
.node.ghost.cross .lab{fill:var(--c)}
.node.fresh .ring{opacity:1; stroke:var(--c); stroke-width:2.5; transform-box:fill-box; transform-origin:center; animation:ping 1.3s ease-out infinite}
@keyframes ping{0%{transform:scale(.7); opacity:1}100%{transform:scale(1.9); opacity:0}}
.node.pop .disc{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.core{cursor:pointer; outline:none}
.core .body{transform-box:fill-box; transform-origin:center; transition:transform .08s}
.core.hit .body{animation:press .14s ease}
@keyframes press{50%{transform:scale(.9)}}
.core:focus-visible .focus{opacity:1}
.core .focus{fill:none; stroke:var(--b-click); stroke-width:2; opacity:0}

/* 계기판 */
.hud{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); left:16px; z-index:5; pointer-events:none; display:flex; flex-direction:column; gap:2px; max-width:calc(100% - 140px)}
.brand{display:flex; align-items:baseline; gap:10px}
.brand h1{font-family:var(--f-display); font-weight:400; font-size:var(--t-lg); letter-spacing:.04em}
.brand span{font-size:var(--t-sm); color:var(--b-click)}
.money{font-family:var(--f-display); font-size:var(--t-xl); line-height:1.15; font-variant-numeric:tabular-nums; word-break:keep-all}
.money small{font-family:var(--f-body); font-size:var(--t-sm); color:var(--muted); margin-left:6px}
.rates{font-size:var(--t-sm); color:var(--muted)}
.rates b{font-family:var(--f-display); font-weight:400; color:var(--text)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.chip{font-size:var(--t-xs); font-weight:700; border-radius:999px; padding:2px 10px; background:var(--panel); border:1px solid var(--line-2); color:var(--text); font-variant-numeric:tabular-nums}
.chip.buff{background:var(--b-meteor); color:var(--void); border-color:transparent}
.chip.go{pointer-events:auto; cursor:pointer; font:inherit; font-size:var(--t-xs); font-weight:700; background:var(--b-click); color:var(--void); border-color:transparent; padding:3px 12px}
.chip.go:focus-visible{outline:2px solid var(--text); outline-offset:2px}
.chip.idle{color:var(--muted)}
.tools{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); right:16px; z-index:5; display:flex; gap:8px}
.tbtn{border:1px solid var(--line-2); background:var(--panel); color:var(--text); border-radius:10px; padding:7px 12px; font-size:var(--t-sm); font-weight:700; cursor:pointer}
.tbtn:focus-visible{outline:2px solid var(--b-click); outline-offset:2px}
.tbtn[aria-pressed="false"]{color:var(--muted)}
.brand .next{font-size:var(--t-xs); color:var(--muted)}
/* 처음 하는 사람 안내 말풍선 */
.coach{position:fixed; z-index:9; left:0; top:0; transform:translate(-50%,-100%); pointer-events:none; padding:8px 12px; border-radius:10px; background:var(--core); color:var(--void); font-size:var(--t-sm); font-weight:700; white-space:nowrap; box-shadow:0 8px 24px var(--shadow); animation:bob 1.2s ease-in-out infinite}
.coach::after{content:""; position:absolute; left:50%; bottom:-6px; margin-left:-6px; border:6px solid transparent; border-bottom:0; border-top-color:var(--core)}
@keyframes bob{50%{margin-top:-6px}}
.impact{display:flex; flex-wrap:wrap; gap:6px}
.impact span{font-size:var(--t-xs); font-weight:700; border-radius:999px; padding:3px 10px; background:var(--panel-solid); border:1px solid var(--line-2); color:var(--muted)}
.impact b{color:var(--good); font-family:var(--f-display); font-weight:400; font-size:var(--t-sm)}

/* 별 정보 */
.info{position:fixed; z-index:6; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); width:340px; display:flex; flex-direction:column; gap:10px; padding:16px;
  background:var(--panel); border:1px solid var(--line-2); border-radius:16px; box-shadow:0 18px 40px var(--shadow); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.info .kicker{display:flex; align-items:center; gap:8px; font-size:var(--t-xs); font-weight:700; letter-spacing:.08em; color:var(--muted)}
.info .kicker i{width:10px; height:10px; border-radius:50%; background:var(--c)}
.info h2{font-family:var(--f-display); font-weight:400; font-size:var(--t-lg); line-height:1.2}
.info p{margin:0; font-size:var(--t-sm); color:var(--muted)}
.fxline{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; font-size:var(--t-sm)}
.fxline b{color:var(--c,var(--text))}
.lvbar{display:flex; gap:3px}
.lvbar i{flex:1; height:5px; border-radius:3px; background:var(--line)}
.lvbar i.on{background:var(--c)}
.actions{display:flex; gap:8px; flex-wrap:wrap}
.btn{flex:1 1 auto; border:0; border-radius:10px; padding:10px 14px; font-weight:700; font-size:var(--t-sm); background:var(--c,var(--b-click)); color:var(--void); cursor:pointer; font-variant-numeric:tabular-nums}
.btn.ghost{flex:0 1 auto; background:transparent; color:var(--text); box-shadow:inset 0 0 0 1px var(--line-2)}
.btn:disabled{background:var(--line); color:var(--dim); box-shadow:none; cursor:not-allowed}
.btn.warn{background:var(--b-luck); color:var(--void)}
.btn:focus-visible{outline:2px solid var(--text); outline-offset:2px}
.clues{list-style:none; margin:0; padding:10px 12px; display:flex; flex-direction:column; gap:6px; border-radius:10px; border:1px dashed var(--line-2); font-size:var(--t-sm); color:var(--muted)}
.clues b{color:var(--text)}
.clues .ok{color:var(--good)}
.chip.next{border-color:var(--b-deep); color:var(--b-deep)}
.legend{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 10px; margin:0; padding:0; list-style:none}
.legend li{display:flex; align-items:center; gap:6px; font-size:var(--t-xs); color:var(--muted)}
.legend i{width:8px; height:8px; border-radius:50%; background:var(--c)}
.shake{animation:shake .28s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}

/* 효과 */
.fx{position:fixed; inset:0; z-index:7; pointer-events:none; overflow:hidden}
.float{position:absolute; font-family:var(--f-display); font-size:18px; color:var(--core); text-shadow:0 0 8px var(--core-glow); white-space:nowrap; animation:rise .9s ease-out forwards}
.float.crit{font-size:26px; color:var(--b-luck); text-shadow:0 0 10px var(--b-luck)}
.float.big{font-size:26px; color:var(--b-meteor)}
.float.lvup{font-size:14px; color:var(--text); text-shadow:0 0 8px var(--shadow)}
@keyframes rise{from{opacity:1; transform:translate(-50%,-50%)}to{opacity:0; transform:translate(-50%,calc(-50% - 64px))}}
.meteor{position:fixed; z-index:8; left:0; top:0; width:120px; height:40px; padding:0; border:0; background:none; cursor:pointer}
.meteor svg{display:block; width:100%; height:100%; overflow:visible}
.meteor:focus-visible{outline:2px solid var(--b-meteor); outline-offset:4px}
.toasts{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 14px); transform:translateX(-50%); z-index:20; display:flex; flex-direction:column; gap:8px; width:min(calc(100vw - 32px),360px); pointer-events:none}
.toast{padding:10px 14px; border-radius:12px; border:1px solid var(--b-click); background:var(--panel-solid); box-shadow:0 12px 30px var(--shadow); animation:toast-in .25s ease; transition:opacity .3s,transform .3s}
.toast b{display:block; color:var(--b-click)}
.toast span{font-size:var(--t-sm); color:var(--muted)}
.toast.out{opacity:0; transform:translateY(-8px)}
@keyframes toast-in{from{opacity:0; transform:translateY(-10px)}}

.dialog{position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:16px; background:rgba(4,6,14,.7)}
.dialog .box{width:min(100%,420px); display:flex; flex-direction:column; gap:14px; padding:20px; border-radius:16px; background:var(--panel-solid); border:1px solid var(--line-2)}
.dialog h2{font-family:var(--f-display); font-weight:400; font-size:var(--t-lg)}
.stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:0}
.stats div{padding:8px 10px; border-radius:10px; border:1px solid var(--line); min-width:0}
.stats dt{font-size:var(--t-xs); color:var(--muted); font-weight:700}
.stats dd{margin:0; font-family:var(--f-display); overflow-wrap:anywhere}

@media (max-width:760px){
  .info{left:0; right:0; bottom:0; width:auto; border-radius:16px 16px 0 0; padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px); gap:8px; max-height:48%; overflow-y:auto}
  .info .legend{display:none}
  .chip.minor{display:none}
  .money{font-size:24px}
  .hud{max-width:calc(100% - 180px)}
  .tools{flex-direction:column; align-items:flex-end}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
  .float{animation:none; opacity:.9}
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <canvas id="sky" aria-hidden="true"></canvas>
  <svg id="tree" role="group" aria-label="업그레이드 별자리">
    <defs>
      <radialGradient id="g-core" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".35" stop-color="#fff3cf"/>
        <stop offset=".7" stop-color="#ffd66e" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ffd66e" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g id="world">
      <g id="coreGlow" pointer-events="none"><g class="rays" id="rays"></g><circle class="corona" r="92" fill="url(#g-core)"/></g>
      <g id="edges"></g>
      <g id="core" class="core" role="button" tabindex="0" aria-label="중심별 눌러서 별빛 모으기">
        <g class="body">
          <circle r="60" fill="transparent"/>
          <path d="M0 -46 C6 -12 12 -6 46 0 C12 6 6 12 0 46 C-6 12 -12 6 -46 0 C-12 -6 -6 -12 0 -46Z" fill="#fffaf0"/>
          <path d="M0 -46 C6 -12 12 -6 46 0 C12 6 6 12 0 46 C-6 12 -12 6 -46 0 C-12 -6 -6 -12 0 -46Z" fill="#fff3cf" opacity=".75" transform="rotate(45) scale(.55)"/>
          <circle r="16" fill="#ffffff"/>
        </g>
        <circle class="stage-track" r="68"/>
        <circle class="stage-ring" id="stageRing" r="68" pathLength="100" stroke-dasharray="0 100"/>
        <circle class="focus" r="58"/>
      </g>
      <g id="nodes"></g>
    </g>
  </svg>
</div>

<header class="hud">
  <div class="brand"><h1>중심별</h1><span id="stageName">작은 별</span><span class="next" id="stageNext"></span></div>
  <div class="money"><span id="money">0</span><small>별빛</small></div>
  <div class="rates">초당 <b id="rate">0</b> · 클릭당 <b id="perClick">1</b></div>
  <div class="chips" id="chips"></div>
</header>
<div class="tools">
  <button class="tbtn" type="button" id="fitBtn">가운데로</button>
  <button class="tbtn" type="button" id="statsBtn">기록</button>
  <button class="tbtn" type="button" id="soundBtn" aria-pressed="true">소리 켬</button>
</div>
<div class="coach" id="coach" hidden></div>
<aside class="info" id="info" aria-live="polite"></aside>
<div class="fx" id="fx" aria-hidden="true"></div>
<button class="meteor" id="meteor" type="button" hidden aria-label="유성 잡기">
  <svg viewBox="0 0 120 40" aria-hidden="true">
    <defs><linearGradient id="g-tail" x1="0" x2="1"><stop offset="0" stop-color="#ffad66" stop-opacity="0"/><stop offset="1" stop-color="#ffd66e"/></linearGradient></defs>
    <path d="M0 20 L100 13 L100 27 Z" fill="url(#g-tail)"/>
    <circle cx="102" cy="20" r="10" fill="#fff3cf"/>
    <circle cx="102" cy="20" r="16" fill="#ffd66e" opacity=".3"/>
  </svg>
</button>
<div class="dialog" id="statsDialog" hidden role="dialog" aria-modal="true" aria-labelledby="statsTitle">
  <div class="box">
    <h2 id="statsTitle">기록</h2>
    <dl class="stats" id="stats"></dl>
    <div class="actions">
      <button class="btn ghost" type="button" id="wipeBtn">처음부터 다시 하기</button>
      <button class="btn" type="button" id="closeStats">닫기</button>
    </div>
  </div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script id="core-rules">
"use strict";
/* ===== 규칙 (DOM 없음) ===== */
const RING_GAP = 120;      // 고리 하나 사이 거리
const CRIT_BASE = 3;       // 섬광 기본 배율
const COMBO_WINDOW = 0.5;  // 이 시간 안에 다시 누르면 연타가 이어짐

const BRANCHES = {
  click:  { name:'손끝', color:'var(--b-click)',  angle:-90, note:'클릭' },
  auto:   { name:'위성', color:'var(--b-auto)',   angle:-30, note:'자동 수입' },
  amp:    { name:'증폭', color:'var(--b-amp)',    angle:30,  note:'전체 배율' },
  luck:   { name:'행운', color:'var(--b-luck)',   angle:90,  note:'섬광' },
  meteor: { name:'유성', color:'var(--b-meteor)', angle:150, note:'유성' },
  res:    { name:'공명', color:'var(--b-res)',    angle:210, note:'연결' },
  link:   { name:'연결', color:'var(--b-link)',   angle:0,   note:'두 갈래 사이' },
  deep:   { name:'심연', color:'var(--b-deep)',   angle:0,   note:'단계를 쌓으면' },
};

const NODES = [
  { id:'a1', br:'click', p:null, ring:1, off:0,   name:'첫 반짝임',   desc:'중심별을 누를 때마다 별빛을 더 모아요.', k:'clickAdd', v:1, max:10, cost:10, g:1.5 },
  { id:'a2', br:'click', p:'a1', ring:2, off:0,   name:'단단한 손끝', desc:'누르는 힘이 두 배가 돼요.', k:'clickMul', v:2, max:3, cost:400, g:12 },
  { id:'a3', br:'click', p:'a2', ring:3, off:-11, name:'연타 리듬',   desc:'쉬지 않고 누를수록 별빛이 늘어요.', k:'combo', v:0.05, max:5, cost:1.5e4, g:3 },
  { id:'a4', br:'click', p:'a2', ring:3, off:11,  name:'빛 모으기',   desc:'한 번에 모으는 별빛이 크게 늘어요.', k:'clickAdd', v:8, max:10, cost:6000, g:1.6 },

];
const NODE = Object.fromEntries(NODES.map(n => [n.id, n]));
NODES.forEach(n => {
  if (!n.flat) n.cost *= Math.pow(n.ring < 3 ? 3 : 6, Math.max(0, n.ring - 2));   // 바깥 고리로 갈수록 값이 가파르게 뛰어요
  const a = (n.ang != null ? n.ang : BRANCHES[n.br].angle + n.off) * Math.PI / 180, r = n.ring * RING_GAP;
  n.x = Math.cos(a) * r; n.y = Math.sin(a) * r;
  n.kids = NODES.filter(m => m.p === n.id).map(m => m.id);
});
const STAGES = [[0, '작은 별'], [5, '별자리'], [12, '성단'], [24, '성운'], [36, '은하'], [48, '은하단'], [NODES.length, '우주']];
const MILESTONES = NODES.filter(n => n.total).map(n => n.total).sort((a, b) => a - b);

const lvOf = (s, id) => s.lv[id] || 0;
const totalLv = s => { let t = 0; for (const k in s.lv) t += s.lv[k]; return t; };
const reqMet = (s, n) => (!n.req || n.req.every(([id, l]) => lvOf(s, id) >= l)) && (!n.total || totalLv(s) >= n.total);
const isVisible = (s, n) => (!n.p || lvOf(s, n.p) > 0) && reqMet(s, n);
const costOf = (n, lv, d) => Math.ceil(n.cost * Math.pow(n.g, lv) * d.costMul);
const stageOf = lit => { let t = STAGES[0][1]; for (const [at, name] of STAGES) if (lit >= at) t = name; return t; };

function derive(s) {
  const r = { clickAdd:1, clickMul:1, autoAdd:0, autoMul:1, all:1, combo:0, crit:0, critMul:CRIT_BASE, critSec:0, fromAuto:0, costMul:1,
    meteor:false, meteorFreq:1, meteorMul:1, meteorDur:0, meteorSlow:1, perNode:0, autoClick:0, offline:0.5, lit:0 };
  for (const n of NODES) {
    const lv = lvOf(s, n.id);
    if (!lv) continue;
    r.lit++;
    switch (n.k) {
      case 'clickAdd': r.clickAdd += n.v * lv; break;
      case 'clickMul': r.clickMul *= Math.pow(n.v, lv); break;
      case 'autoAdd': r.autoAdd += n.v * lv; break;
      case 'autoMul': r.autoMul *= Math.pow(n.v, lv); break;
      case 'allMul': r.all *= Math.pow(n.v, lv); break;
      case 'combo': r.combo += n.v * lv; break;
      case 'critChance': r.crit += n.v * lv; break;
      case 'critMul': r.critMul += n.v * lv; break;
      case 'critSec': r.critSec += n.v * lv; break;
      case 'fromAuto': r.fromAuto += n.v * lv; break;
      case 'costDown': r.costMul = 1 - n.v * lv; break;
      case 'meteor': r.meteor = true; break;
      case 'meteorFreq': r.meteorFreq *= Math.pow(n.v, lv); break;
      case 'meteorMul': r.meteorMul *= Math.pow(n.v, lv); break;
      case 'meteorDur': r.meteorDur += n.v * lv; break;
      case 'meteorSlow': r.meteorSlow = n.v; break;
      case 'perNode': r.perNode += n.v * lv; break;
      case 'autoClick': r.autoClick += n.v * lv; break;
      case 'offline': r.offline += n.v * lv; break;
    }
  }
  r.all *= 1 + r.perNode * r.lit;
  r.crit = Math.min(1, r.crit);
  r.auto = r.autoAdd * r.autoMul * r.all;                                   // 위성 수입
  r.click = r.clickAdd * r.clickMul * r.all + r.fromAuto * r.auto;          // 섬광 전 한 번
  r.clickAvg = r.click * (1 + r.crit * (r.critMul - 1)) + r.crit * r.critSec * r.auto;
  r.perSec = r.auto + r.autoClick * r.clickAvg;                             // 가만히 있어도 들어오는 별빛
  return r;
}

// 별 효과를 사람이 읽는 말로
function effText(n, lv) {
  const v = n.v, f = x => fmt(x);
  switch (n.k) {
    case 'clickAdd': return `클릭당 +${f(v * lv)}`;
    case 'clickMul': return `클릭 ×${f(Math.pow(v, lv))}`;
    case 'autoAdd': return `초당 +${f(v * lv)}`;
    case 'autoMul': return `위성 수입 ×${trim(Math.pow(v, lv))}`;
    case 'allMul': return `모든 별빛 ×${trim(Math.pow(v, lv))}`;
    case 'combo': return `연타 보너스 최대 +${Math.round(v * lv * 100)}%`;
    case 'critChance': return `섬광 확률 +${Math.round(v * lv * 100)}%`;
    case 'critMul': return `섬광 배율 ×${CRIT_BASE + v * lv}`;
    case 'critSec': return `섬광 때 위성 수입 ${v * lv}초치 추가`;
    case 'fromAuto': return `클릭마다 위성 수입의 ${Math.round(v * lv * 100)}% 추가`;
    case 'costDown': return `별 밝히는 값 −${Math.round(v * lv * 100)}%`;
    case 'meteor': return lv ? '유성이 지나가요' : '유성이 아직 없어요';
    case 'meteorFreq': return `유성 간격 −${Math.round((1 - Math.pow(v, lv)) * 100)}%`;
    case 'meteorMul': return `유성 별빛 ×${trim(Math.pow(v, lv))}`;
    case 'meteorDur': return `유성 효과 +${v * lv}초`;
    case 'meteorSlow': return lv ? '유성이 두 배 천천히' : '보통 속도';
    case 'perNode': return `밝힌 별 하나마다 모든 별빛 +${Math.round(v * lv * 100)}%`;
    case 'autoClick': return `초당 ${trim(v * lv)}번 저절로 반짝`;
    case 'offline': return `자리 비운 동안 ${Math.round((0.5 + v * lv) * 100)}% 모으기`;
  }
}
function nodeLabel(n) {
  return { clickAdd:'+' + fmt(n.v), clickMul:'×' + n.v, autoAdd:'+' + fmt(n.v) + '/s', autoMul:'×' + n.v, allMul:'×' + n.v, combo:'연타',
    critChance:Math.round(n.v * 100) + '%', critMul:'+' + n.v + '배', critSec:'+' + n.v + '초', fromAuto:Math.round(n.v * 100) + '%', costDown:'−' + Math.round(n.v * 100) + '%',
    meteor:'유성', meteorFreq:'자주', meteorMul:'×' + n.v, meteorDur:'+' + n.v + '초', meteorSlow:'느리게', perNode:'+' + Math.round(n.v * 100) + '%',
    autoClick:'자동', offline:'기억' }[n.k];
}
const trim = x => (Math.round(x * 100) / 100).toLocaleString('ko-KR');

const KUNITS = [[1e44,'재'],[1e40,'정'],[1e36,'간'],[1e32,'구'],[1e28,'양'],[1e24,'자'],[1e20,'해'],[1e16,'경'],[1e12,'조'],[1e8,'억'],[1e4,'만']];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1e4) return (n < 100 && n % 1 ? Math.round(n * 10) / 10 : Math.floor(n)).toLocaleString('ko-KR');
  if (n >= 1e48) return n.toExponential(2);
  for (const [u, name] of KUNITS) if (n >= u) {
    const v = n / u;
    return (v >= 1000 ? Math.floor(v).toLocaleString('ko-KR') : v >= 100 ? v.toFixed(1) : v.toFixed(2)) + name;
  }
}
function fmtTime(sec) {
  sec = Math.floor(sec);
  const hh = Math.floor(sec / 3600), mm = Math.floor(sec % 3600 / 60), ss = sec % 60;
  return hh ? `${hh}시간 ${mm}분` : mm ? `${mm}분 ${ss}초` : `${ss}초`;
}

/* --- 상태 --- */
function fresh() { return { v:1, money:0, total:0, clicks:0, crits:0, meteors:0, lv:{}, buffs:[], playSec:0, lastSeen:Date.now() }; }
function revive(o) {
  if (!o || o.v !== 1) return null;
  const s = Object.assign(fresh(), o);
  s.lv = {};
  for (const id in o.lv || {}) if (NODE[id]) s.lv[id] = Math.min(NODE[id].max, o.lv[id] | 0);
  s.buffs = (o.buffs || []).filter(b => b.until > Date.now());
  return s;
}
function load() { try { const raw = localStorage.getItem(SAVE_KEY); return raw ? revive(JSON.parse(raw)) : null; } catch (e) { return null; } }

function burst(x, y, color, n) {

    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 160;
    particles.push({ x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, life:0.6 + Math.random() * 0.5, age:0, color });

}

/* --- 소리: 파일 없이 바로 합성해요 --- */
const Sound = (() => {
  let ac = null, master = null, on = true;
  try { on = localStorage.getItem('center-star-sound') !== 'off'; } catch (e) {}
  function ready() {
    if (!on) return null;
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.22; master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, type, vol, delay, slideTo) {
    const a = ready(); if (!a) return;
    const t0 = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];   // 5음계: 연타할수록 올라가요
  return {
    get on() { return on; },
    toggle() { on = !on; try { localStorage.setItem('center-star-sound', on ? 'on' : 'off'); } catch (e) {} if (on) ready(); return on; },
    click(c) { tone(SCALE[Math.min(SCALE.length - 1, Math.floor((c - 1) / 3))], 0.14, 'triangle', 0.16); },
    crit() { tone(1567.98, 0.3, 'sine', 0.2); tone(2093, 0.4, 'sine', 0.12, 0.06); tone(392, 0.25, 'triangle', 0.12); },
    buy() { [659.25, 987.77, 1318.51].forEach((f, i) => tone(f, 0.22, 'sine', 0.16, i * 0.05)); },
    reveal() { [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) => tone(f, 0.45, 'sine', 0.13, i * 0.08)); },
    stage() { [392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.6, 'triangle', 0.13, i * 0.1)); },
    meteor() { tone(1400, 0.9, 'sine', 0.05, 0, 500); },
    catch() { [783.99, 1046.5, 1567.98].forEach((f, i) => tone(f, 0.3, 'triangle', 0.16, i * 0.06)); },
    deny() { tone(196, 0.14, 'square', 0.05); },
  };
})();

function toast(title, body) {

function shake(node) { node.classList.remove('shake'); void node.offsetWidth; node.classList.add('shake'); }
const cssColor = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const toScreen = (wx, wy) => [view.x + wx * view.s, view.y + wy * view.s];

/* --- 중심별 누르기 --- */
function collect(x, y) {
  const now = performance.now() / 1000;
  combo = now - lastClickAt < COMBO_WINDOW ? combo + 1 : 1;
  lastClickAt = now;
  const isCrit = Math.random() < D.crit;
  let v = D.click * comboMul() * buffMul();
  if (isCrit) { v = v * D.critMul + D.critSec * D.auto * buffMul(); S.crits++; }
  earn(v);
  S.clicks++;
  floatText(x + (Math.random() * 40 - 20), y - 30, (isCrit ? '섬광! +' : '+') + fmt(v), isCrit ? 'crit' : '');
  const [cx, cy] = toScreen(0, 0);
  burst(cx, cy, isCrit ? COLORS.luck : COLORS.core, isCrit ? 16 : 5);
  ring(cx, cy, coreR() * 0.8, coreR() * 2.2, 0.45, isCrit ? COLORS.luck : COLORS.core, isCrit ? 3 : 1.5);
  if (isCrit) { if (!calm) { flash = 0.22; shakeT = 0.18; } Sound.crit(); } else Sound.click(combo);
  els.core.classList.remove('hit'); void els.core.getBBox(); els.core.classList.add('hit');
}
els.core.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  e.preventDefault();
  if (e.repeat) return;
  const [cx, cy] = toScreen(0, 0);
  collect(cx, cy);
});

/* --- 별자리 그리기 --- */
function buildTree() {
  els.edges.textContent = ''; els.nodes.textContent = '';
  for (const n of NODES) {
    // 선: 부모에서(일반) · 조건 별들에서(연결 별) · 중심별에서(첫 고리) · 없음(심연의 별)
    const froms = n.p ? [n.p] : n.req ? n.req.map(r => r[0]) : n.total ? [] : [null];
    edgeEls[n.id] = froms.map(from => {
      const p = from ? NODE[from] : { x:0, y:0 };
      const e = sv('line', { x1:p.x, y1:p.y, x2:n.x, y2:n.y, class:'edge' });
      e.style.setProperty('--c', BRANCHES[n.br].color);
      const f = sv('line', { x1:p.x, y1:p.y, x2:n.x, y2:n.y, class:'flow' });
      els.edges.append(e, f);
      return { el:e, flow:f, from };
    });
    const g = sv('g', { class:'node', tabindex:'0', role:'button', 'data-id':n.id });
    g.style.setProperty('--c', BRANCHES[n.br].color);
    const badge = sv('g', { class:'badge' });
    badge.append(sv('circle', { cx:17, cy:-17, r:8 }), sv('path', { d:'M12.5 -14.5 L17 -21 L21.5 -14.5 Z' }));
    g.append(
      sv('circle', { class:'halo', r:30 }),
      sv('circle', { class:'avl', r:28 }),
      sv('circle', { class:'disc', r:20 }),
      sv('circle', { class:'prog', r:24, pathLength:100, 'stroke-dasharray':'0 100' }),
      sv('circle', { class:'ring', r:29 }),
      badge,
    );
    const t = sv('text', { class:'lab' });
    t.textContent = nodeLabel(n);
    const c = sv('text', { class:'cost', y:39 });
    g.append(t, c);
    g.addEventListener('focus', () => select(n.id));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); buy(n.id); } });
    els.nodes.append(g);
    nodeEls[n.id] = g;
  }
  placeNodes();
}
// 별과 중심별은 확대·축소와 상관없이 화면에서 거의 같은 크기로 보여요
const narrow = () => innerWidth <= 760;
const stageIndex = () => { let k = 0; STAGES.forEach(([at], i) => { if (D.lit >= at) k = i; }); return k; };
// 중심별 크기(화면 px): 단계가 오를수록 조금씩 커지지만 첫 고리와는 겹치지 않아요
function coreR() {
  const gap = RING_GAP * view.s;
  return Math.max(22, Math.min(54, gap * 0.42, gap * 0.34 * (1 + 0.06 * stageIndex())));
}
function placeNodes() {
  const k = (narrow() ? 0.85 : 1) / view.s;
  for (const n of NODES) nodeEls[n.id].setAttribute('transform', `translate(${n.x} ${n.y}) scale(${k})`);
  const c = coreR() / 46 / view.s;
  els.core.setAttribute('transform', `scale(${c})`);
  els.coreGlow.setAttribute('transform', `scale(${c})`);
}
// 상태: hidden(안 보임) · ghost(다음에 열릴 자리) · avail · lit · max
function nodeState(n) {
  const lv = lvOf(S, n.id);
  if (lv >= n.max) return 'max';
  if (lv > 0) return 'lit';
  if (isVisible(S, n)) return 'avail';
  if (n.req) return n.req.some(([id, l]) => lvOf(S, id) >= l) ? 'ghost' : 'hidden';   // 조건 하나라도 채우면 흐릿하게 보여요
  if (n.total) return 'hidden';
  if (n.p && isVisible(S, NODE[n.p])) return 'ghost';
  return 'hidden';
}
const freshUntil = {};
function paintNode(n, pop) {
  const g = nodeEls[n.id], st = nodeState(n), lv = lvOf(S, n.id), cross = !!n.req, mystery = st === 'ghost' && cross;
  const can = (st === 'avail' || st === 'lit') && costOf(n, lv, D) <= S.money;
  const fresh = (freshUntil[n.id] || 0) > Date.now();
  g.setAttribute('class', `node ${st}${cross ? ' cross' : ''}${can ? ' can' : ''}${sel === n.id ? ' sel' : ''}${pop ? ' pop' : ''}${fresh ? ' fresh' : ''}`);
  g.style.display = st === 'hidden' ? 'none' : '';
  g.querySelector('.disc').setAttribute('r', st === 'ghost' ? (mystery ? 12 : 5) : 20);
  const lab = g.querySelector('.lab');
  lab.style.display = st === 'ghost' && !mystery ? 'none' : '';
  lab.textContent = mystery ? '?' : nodeLabel(n);
  g.querySelector('.prog').setAttribute('stroke-dasharray', `${(lv / n.max) * 100} 100`);
  const costEl = g.querySelector('.cost');
  costEl.textContent = st === 'avail' || st === 'lit' ? fmt(costOf(n, lv, D)) : '';
  g.setAttribute('tabindex', st === 'ghost' && !mystery ? '-1' : '0');
  g.setAttribute('aria-label', mystery ? '아직 열리지 않은 연결 별' : `${n.name}, ${lv} / ${n.max}단계` + (st === 'avail' || st === 'lit' ? `, ${fmt(costOf(n, lv, D))} 별빛` : ''));
  for (const { el, flow, from } of edgeEls[n.id]) {
    const show = st !== 'hidden' && !(mystery && from && !n.req.some(([id, l]) => id === from && lvOf(S, id) >= l));
    el.style.display = show ? '' : 'none';
    el.setAttribute('class', 'edge' + (cross ? ' cross' : '') + (st === 'ghost' ? ' ghost' : lv > 0 ? ' lit' : ''));
    flow.setAttribute('class', 'flow' + (show && lv > 0 ? ' on' : ''));
  }
}
function paintAll() { for (const n of NODES) paintNode(n); }
function updateAffordable() {
  for (const n of NODES) {
    const st = nodeState(n);
    if (st !== 'avail' && st !== 'lit') continue;
    nodeEls[n.id].classList.toggle('can', costOf(n, lvOf(S, n.id), D) <= S.money);
  }
}

/* --- 보기(이동·확대) --- */
function area() {
  const W = innerWidth, H = innerHeight, nr = narrow();
  const infoH = nr ? els.info.offsetHeight : 0, infoW = nr ? 0 : els.info.offsetWidth + 32;
  const top = nr ? 120 : 20;
  return { x:0, y:top, w:W - infoW, h:H - top - infoH };
}
function fitTarget() {
  let R = 0;
  for (const n of NODES) { const st = nodeState(n); if (st !== 'hidden') R = Math.max(R, Math.hypot(n.x, n.y)); }
  R = Math.max(R, RING_GAP) + 50;
  const a = area();
  const minS = (narrow() ? 66 : 56) / RING_GAP, maxS = 1.15;   // 고리 사이가 이보다 좁아지면 대신 끌어서 봐요
  target.s = Math.max(minS, Math.min(maxS, Math.min(a.w, a.h) / (2 * R)));
  target.x = a.x + a.w / 2; target.y = a.y + a.h / 2;
}
function applyView() { els.world.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.s})`); }
function zoomAt(cx, cy, ns) {
  ns = Math.max(0.2, Math.min(2, ns));
  panGoal = null;
  const wx = (cx - view.x) / view.s, wy = (cy - view.y) / view.s;
  view.s = ns; view.x = cx - wx * ns; view.y = cy - wy * ns;
  applyView(); placeNodes();
}
$('#fitBtn').addEventListener('click', () => { follow = true; panGoal = null; fitTarget(); });
addEventListener('resize', () => { sizeSky(); if (follow) fitTarget(); });

const pointers = new Map();
let drag = null, pinch = null;
els.svg.addEventListener('pointerdown', e => {
  if (e.target.closest('#core')) { e.preventDefault(); if (e.button === 0) collect(e.clientX, e.clientY); return; }
  els.svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 1) {
    const ng = e.target.closest('.node');
    drag = { sx:e.clientX, sy:e.clientY, moved:false, node:ng ? ng.dataset.id : null, type:e.pointerType };
  } else if (pointers.size === 2) {
    if (drag) drag.moved = true;
    const [p, q] = [...pointers.values()];
    pinch = { d:Math.hypot(p.x - q.x, p.y - q.y), s:view.s };
  }
});
els.svg.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId);
  if (!prev) {
    if (e.pointerType === 'mouse') { const ng = e.target.closest('.node'); if (ng && (!ng.classList.contains('ghost') || ng.classList.contains('cross')) && sel !== ng.dataset.id) select(ng.dataset.id); }
    return;
  }
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2 && pinch) {
    const [p, q] = [...pointers.values()];
    const d = Math.hypot(p.x - q.x, p.y - q.y);
    follow = false;
    zoomAt((p.x + q.x) / 2, (p.y + q.y) / 2, pinch.s * d / pinch.d);
    return;
  }
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) { drag.moved = true; els.svg.classList.add('panning'); }
  if (drag.moved) { follow = false; panGoal = null; view.x += dx; view.y += dy; applyView(); }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) {
    if (drag && !drag.moved && drag.node && e.type === 'pointerup') tapNode(drag.node, drag.type);
    else if (drag && !drag.moved && !drag.node && e.type === 'pointerup') select(null);
    drag = null;
    els.svg.classList.remove('panning');
  }
}
els.svg.addEventListener('pointerup', endPointer);
els.svg.addEventListener('pointercancel', endPointer);
els.svg.addEventListener('wheel', e => { e.preventDefault(); follow = false; zoomAt(e.clientX, e.clientY, view.s * Math.exp(-e.deltaY * 0.0015)); }, { passive:false });

function tapNode(id, type) {
  if (type === 'mouse' || sel === id) { select(id); buy(id); }
  else select(id);
}

/* --- 별 정보·밝히기 --- */
function select(id) {
  const prev = sel;
  sel = id;
  if (prev && NODE[prev]) paintNode(NODE[prev]);
  if (id) paintNode(NODE[id]);
  renderInfo();
}
function maxBuy(n) {
  let lv = lvOf(S, n.id), money = S.money, k = 0, total = 0;
  while (lv < n.max) { const c = costOf(n, lv, D); if (c > money) break; money -= c; total += c; lv++; k++; }
  return { k, total };
}

  }

    box.innerHTML = `<div class="kicker"><i></i>연결 별 · 아직 닫혀 있어요</div>

      <ul class="clues">${n.req.map(([id, l]) => { const r = NODE[id], have = lvOf(S, id);
        return `<li class="${have >= l ? 'ok' : ''}">${BRANCHES[r.br].name} <b>${r.name}</b> ${l}단계 · 지금 ${have}${have >= l ? ' ✓' : ''}</li>`; }).join('')}</ul>`;
    return;
  }

  box.innerHTML = `<div class="kicker"><i></i>${br.name} · ${lv} / ${n.max}단계</div>
    <h2>${n.name}</h2>
    <p>${n.desc}</p>
    <div class="lvbar" aria-hidden="true">${bars}</div>
    <div class="fxline">${lv ? `<span>지금 <b>${effText(n, lv)}</b></span>` : ''}${maxed ? '' : `<span>${lv ? '→ 다음' : '밝히면'} <b>${effText(n, lv + 1)}</b></span>`}</div>
    ${impactLine(n)}
    ${clueList(n)}
    <div class="actions"></div>`;
  const acts = box.querySelector('.actions');
  if (st === 'ghost' || st === 'hidden') { acts.innerHTML = '<p>안쪽 별을 먼저 밝혀야 해요.</p>'; return; }
  const b1 = h('button', 'btn');
  b1.type = 'button'; b1.id = 'buyOne';
  b1.textContent = maxed ? '다 밝혔어요' : `${lv ? '한 단계 더' : '밝히기'} · ${fmt(cost)} 별빛`;
  b1.disabled = maxed || cost > S.money;
  b1.addEventListener('click', () => buy(n.id));
  acts.append(b1);
  if (!maxed && n.max - lv > 1) {
    const b2 = h('button', 'btn ghost');
    b2.type = 'button'; b2.id = 'buyMax';
    b2.addEventListener('click', () => { const m = maxBuy(n); for (let i = 0; i < m.k; i++) buy(n.id, true); Sound.buy(); renderInfo(); });
    acts.append(b2);
  }

}
// 한 단계 올리면 수입이 얼마나 달라지는지 미리 계산해 보여요
function impactLine(n) {
  const lv = lvOf(S, n.id);
  if (lv >= n.max) return '';
  S.lv[n.id] = lv + 1;
  const d2 = derive(S);
  if (lv) S.lv[n.id] = lv; else delete S.lv[n.id];
  const parts = [];
  const add = (label, now, next) => {
    if (next <= now) return;
    if (now <= 0) { parts.push(`<span>${label} <b>+${fmt(next)}</b></span>`); return; }
    const r = next / now - 1;
    if (r < 0.005) return;
    parts.push(`<span>${label} <b>${r >= 1 ? '×' + trim(next / now) : '+' + (r < 0.1 ? (r * 100).toFixed(1) : Math.round(r * 100)) + '%'}</b></span>`);
  };
  add('초당 별빛', D.perSec, d2.perSec);
  add('클릭 한 번', D.clickAvg, d2.clickAvg);
  return parts.length ? `<div class="impact" aria-label="밝히면 달라지는 수입">${parts.join('')}</div>` : '';
}
// 이 별을 키우면 어딘가에서 열릴 연결 별 단서
function clueList(n) {
  const items = NODES.filter(m => m.req && !isVisible(S, m) && m.req.some(([id]) => id === n.id)).map(m => {
    const [, need] = m.req.find(([id]) => id === n.id);
    const others = m.req.filter(([id, l]) => id !== n.id && lvOf(S, id) < l).map(([id, l]) => `${BRANCHES[NODE[id].br].name} ‘${NODE[id].name}’ ${l}단계`);
    const mine = lvOf(S, n.id) >= need ? `<span class="ok">이 별은 조건을 채웠어요 ✓</span>` : `<b>${need}단계</b>가 되면`;
    return { mine, others:others.join(', ') };
  });
  // 같은 단서는 하나로 묶어 "새 별 n개"로 보여요
  const grouped = new Map();
  for (const it of items) { const key = it.mine + '|' + it.others; grouped.set(key, Object.assign(it, { n:((grouped.get(key) || {}).n || 0) + 1 })); }
  const lines = [...grouped.values()].map(it => `<li>${it.mine} 어딘가에 새 별${it.n > 1 ? ' ' + it.n + '개' : ''}이 열려요${it.others ? ` · 함께 필요: ${it.others}` : ''}</li>`);
  return lines.length ? `<ul class="clues">${lines.join('')}</ul>` : '';
}
function refreshInfoButtons() {
  if (!sel) return;
  const n = NODE[sel], lv = lvOf(S, n.id);
  const b1 = document.getElementById('buyOne'), b2 = document.getElementById('buyMax');
  if (b1 && lv < n.max) {
    // 모자라면 얼마나 더 필요하고 대략 언제쯤 되는지 알려 줘요
    const cost = costOf(n, lv, D), need = cost - S.money, rate = perSecNow();
    b1.disabled = need > 0;
    b1.textContent = need > 0
      ? `${fmt(need)} 더 필요${rate > 0 ? ' · 약 ' + fmtTime(Math.max(1, need / rate)) : ''}`
      : `${lv ? '한 단계 더' : '밝히기'} · ${fmt(cost)} 별빛`;
  }
  if (b2) { const m = maxBuy(n); b2.textContent = m.k > 1 ? `${m.k}단계 한 번에 · ${fmt(m.total)}` : '여러 단계 한 번에'; b2.disabled = m.k < 2; }
}
function buy(id, quiet) {
  const n = NODE[id], lv = lvOf(S, id), st = nodeState(n);
  if ((st !== 'avail' && st !== 'lit') || lv >= n.max) return;
  const cost = costOf(n, lv, D);
  if (cost > S.money) { if (!quiet) { const b = document.getElementById('buyOne'); if (b) shake(b); Sound.deny(); } return; }
  const before = new Set(NODES.filter(m => nodeState(m) !== 'hidden' && nodeState(m) !== 'ghost').map(m => m.id));
  S.money -= cost;
  S.lv[id] = lv + 1;
  recompute();
  // 다른 구간에서 새로 열린 별 알리기
  const opened = NODES.filter(m => !before.has(m.id) && isVisible(S, m) && (m.req || m.total));
  for (const m of opened) {
    freshUntil[m.id] = Date.now() + 9000;
    setTimeout(() => paintNode(m), 9100);
    const [mx, my] = toScreen(m.x, m.y);
    burst(mx, my, COLORS[m.br], 18);
    ring(mx, my, 16, 130, 0.9, COLORS[m.br], 2.5);
    setTimeout(() => { const [ax, ay] = toScreen(m.x, m.y); ring(ax, ay, 16, 130, 0.9, COLORS[m.br], 1.5); }, 220);
    toast('새 별이 나타났어요: ' + m.name, m.req ? `${m.req.map(([rid]) => BRANCHES[NODE[rid].br].name).join('과 ')} 사이에서 빛나기 시작했어요.` : `단계를 ${m.total}개 쌓자 먼 곳에서 떠올랐어요.`);
  }
  paintAll();
  paintNode(n, true);
  if (lv === 0 || opened.length) {
    if (follow) fitTarget();
    if (lv === 0 && n.k === 'meteor') { meteorIn = 8; toast('유성이 보이기 시작했어요', '지나가는 유성을 눌러서 잡으세요.'); }
  }
  const [sx, sy] = toScreen(n.x, n.y);
  burst(sx, sy, COLORS[n.br], 12);
  ring(sx, sy, 18, 64, 0.5, COLORS[n.br], 2.5);
  if (!quiet) floatText(sx, sy - 34, lv === 0 ? '밝혔어요' : `${lv + 1}단계`, 'lvup');
  const stg = stageOf(D.lit);
  let stageUp = false;
  if (stg !== lastStage) {
    if (lastStage) {
      stageUp = true;
      toast('중심별이 자랐어요: ' + stg, `밝힌 별 ${D.lit}개`);
      const [cx, cy] = toScreen(0, 0);
      ring(cx, cy, coreR(), coreR() * 6, 1.4, COLORS.core, 3);
      burst(cx, cy, COLORS.core, 30);
      if (!calm) flash = 0.3;
    }
    lastStage = stg; els.stageName.textContent = stg;
    placeNodes();
  }
  if (stageUp) Sound.stage(); else if (opened.length) Sound.reveal(); else if (!quiet || lv === 0) Sound.buy();
  if (!quiet) renderInfo();
  updateHud();
}

/* --- 유성 --- */
function scheduleMeteor() { meteorIn = (70 + Math.random() * 60) * D.meteorFreq; }
function launchMeteor() {
  const m = els.meteor, W = innerWidth, H = innerHeight;
  const fromLeft = Math.random() < 0.5;
  const y0 = H * (0.15 + Math.random() * 0.4), y1 = y0 + H * (0.25 + Math.random() * 0.2);
  const x0 = fromLeft ? -140 : W + 20, x1 = fromLeft ? W + 20 : -140;
  const ang = Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI;
  m.hidden = false;
  meteorAlive = true;
  Sound.meteor();
  const dur = 7000 * D.meteorSlow;
  meteorAnim = m.animate([
    { transform:`translate(${x0}px, ${y0}px) rotate(${ang}deg)` },
    { transform:`translate(${x1}px, ${y1}px) rotate(${ang}deg)` },
  ], { duration:dur, easing:'linear' });
  meteorAnim.onfinish = () => { m.hidden = true; meteorAlive = false; scheduleMeteor(); };
}
els.meteor.addEventListener('click', e => {
  if (!meteorAlive) return;
  meteorAlive = false;
  if (meteorAnim) { meteorAnim.onfinish = null; meteorAnim.cancel(); }
  els.meteor.hidden = true;
  S.meteors++;
  const x = e.clientX || innerWidth / 2, y = e.clientY || innerHeight / 2;
  burst(x, y, COLORS.meteor, 24);
  ring(x, y, 10, 110, 0.7, COLORS.meteor, 3);
  Sound.catch();
  if (Math.random() < 0.6) {
    const g = Math.max(D.perSec * 60, D.clickAvg * 30) * D.meteorMul;
    earn(g);
    floatText(x, y, '+' + fmt(g), 'big');
    toast('유성을 잡았어요', `별빛 ${fmt(g)}을 한 번에 모았어요.`);
  } else {
    const sec = 20 + D.meteorDur;
    S.buffs = S.buffs.filter(b => b.kind !== 'shower');
    S.buffs.push({ kind:'shower', until:Date.now() + sec * 1000 });
    toast('유성우', `${sec}초 동안 모든 별빛 ×3`);
  }
  scheduleMeteor();
  updateHud();
});

/* --- 하늘(배경 별·입자) --- */
const ctx = els.sky.getContext('2d');
let skyStars = [], dpr = 1;
function sizeSky() {
  dpr = Math.min(2, devicePixelRatio || 1);
  els.sky.width = innerWidth * dpr; els.sky.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  skyStars = Array.from({ length:Math.round(innerWidth * innerHeight / 7000) }, () => ({ x:Math.random() * innerWidth, y:Math.random() * innerHeight, r:Math.random() * 1.2 + 0.2, a:Math.random() * 0.6 + 0.15, t:Math.random() * 6, z:0.02 + Math.random() * 0.1 }));
}
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COLORS = {};
function readColors() {
  for (const k in BRANCHES) COLORS[k] = cssColor(BRANCHES[k].color.slice(4, -1));
  COLORS.core = cssColor('--core');
}
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
// 갈래별로 밝힌 정도(0~1): 많이 키운 갈래 쪽 하늘이 그 색으로 물들어요
function branchGlow() {
  const out = {};
  for (const k of ['click', 'auto', 'amp', 'luck', 'meteor', 'res']) {
    let have = 0, all = 0;
    for (const n of NODES) if (n.br === k) { have += lvOf(S, n.id); all += n.max; }
    out[k] = have / all;
  }
  return out;
}
let glowCache = null;
function drawSky(dt, now) {
  const W = innerWidth, H = innerHeight;
  ctx.clearRect(0, 0, W, H);
  // 성운
  if (!glowCache || uiAcc === 0) glowCache = branchGlow();
  ctx.globalCompositeOperation = 'lighter';
  const R = Math.max(160, RING_GAP * 2.6 * view.s);
  for (const k in glowCache) {
    const g = glowCache[k];
    if (g <= 0) continue;
    const a = BRANCHES[k].angle * Math.PI / 180;
    const [x, y] = toScreen(Math.cos(a) * RING_GAP * 3.2, Math.sin(a) * RING_GAP * 3.2);
    const grad = ctx.createRadialGradient(x, y, 0, x, y, R);
    grad.addColorStop(0, hexA(COLORS[k], 0.05 + 0.16 * g));
    grad.addColorStop(1, hexA(COLORS[k], 0));
    ctx.fillStyle = grad;
    ctx.fillRect(x - R, y - R, R * 2, R * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
  // 배경 별 (깊이에 따라 조금씩 따라 움직여요)
  ctx.fillStyle = '#ffffff';
  for (const s of skyStars) {
    const x = ((s.x + view.x * s.z) % W + W) % W, y = ((s.y + view.y * s.z) % H + H) % H;
    ctx.globalAlpha = calm ? s.a : s.a * (0.7 + 0.3 * Math.sin(now / 900 + s.t));
    ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.283); ctx.fill();
  }
  // 충격파 고리
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.age += dt;
    if (r.age >= r.life) { rings.splice(i, 1); continue; }
    const t = r.age / r.life, e = 1 - Math.pow(1 - t, 3);
    ctx.globalAlpha = (1 - t) * 0.9;
    ctx.strokeStyle = r.color; ctx.lineWidth = r.w;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, 6.283); ctx.stroke();
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    if (p.age >= p.life) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96;
    ctx.globalAlpha = 1 - p.age / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 6.283); ctx.fill();
  }
  // 섬광 번쩍임
  if (flash > 0) {
    const [cx, cy] = toScreen(0, 0);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.8);
    grad.addColorStop(0, hexA(COLORS.core, flash));
    grad.addColorStop(1, hexA(COLORS.core, 0));
    ctx.globalAlpha = 1; ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    flash = Math.max(0, flash - dt * 1.2);
  }
  ctx.globalAlpha = 1;
}

/* --- 기록 --- */

/* --- 계기판 --- */
let lastMoney = '', lastChips = '', goIndex = 0;
// 지금 밝힐 수 있는 별 (싼 것부터)
function affordableList() {
  return NODES.filter(n => { const st = nodeState(n); return (st === 'avail' || st === 'lit') && costOf(n, lvOf(S, n.id), D) <= S.money; })
    .sort((a, b) => costOf(a, lvOf(S, a.id), D) - costOf(b, lvOf(S, b.id), D));
}
// 칩을 누르면 밝힐 수 있는 별로 차례차례 화면을 옮기고 골라 줘요
els.chips.addEventListener('click', e => {
  if (!e.target.closest('[data-go]')) return;
  const list = affordableList();
  if (!list.length) return;
  const n = list[goIndex++ % list.length];
  select(n.id);
  const a = area();
  follow = false;
  panGoal = { x:a.x + a.w / 2 - n.x * view.s, y:a.y + a.h / 2 - n.y * view.s };
});
function updateMoney(dt) {
  // 금고 숫자는 실제 값을 부드럽게 따라가요
  const diff = S.money - shownMoney;
  shownMoney = Math.abs(diff) <= Math.max(1, Math.abs(S.money) * 1e-4) ? S.money : shownMoney + diff * (1 - Math.exp(-(dt || 1) * 14));
  const m = fmt(shownMoney);
  if (m !== lastMoney) { els.money.textContent = m; lastMoney = m; }
}
function paintStageProgress() {
  const k = stageIndex(), cur = STAGES[k][0], next = STAGES[k + 1];
  const p = next ? (D.lit - cur) / (next[0] - cur) : 1;
  els.stageRing.setAttribute('stroke-dasharray', `${(p * 100).toFixed(1)} 100`);
  els.stageNext.textContent = next ? `${next[1]}까지 별 ${next[0] - D.lit}개` : '모든 별을 밝혔어요';
}
function updateHud() {
  paintStageProgress();
  els.rate.textContent = fmt(perSecNow());
  els.perClick.textContent = fmt(D.click * buffMul());
  const chips = [];
  if (D.crit > 0) chips.push(`<span class="chip minor">섬광 ${Math.round(D.crit * 100)}% · ×${D.critMul}</span>`);
  if (D.combo > 0 && combo > 1) chips.push(`<span class="chip">연타 +${Math.round((comboMul() - 1) * 100)}%</span>`);
  if (D.autoClick > 0) chips.push(`<span class="chip minor">자동 반짝 초당 ${trim(D.autoClick)}번</span>`);
  const ready = affordableList();
  chips.unshift(ready.length
    ? `<button type="button" class="chip go" data-go="1">▲ 지금 밝힐 수 있는 별 ${ready.length}개</button>`
    : `<span class="chip idle">밝힐 수 있는 별 없음 · 별빛을 더 모아요</span>`);
  const tl = totalLv(S), nextM = MILESTONES.find(t => t > tl);
  if (nextM) chips.push(`<span class="chip next">심연의 별까지 ${nextM - tl}단계</span>`);
  for (const b of S.buffs) chips.push(`<span class="chip buff">유성우 ×3 · ${Math.ceil((b.until - Date.now()) / 1000)}초</span>`);
  const html = chips.join('');
  if (html !== lastChips) { els.chips.innerHTML = html; lastChips = html; }
  updateAffordable();
  refreshInfoButtons();
}

/* --- 루프 --- */
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 5) {
    // 탭을 떠나 있던 동안에도 위성은 돌아요
    const g = D.perSec * Math.min(dt, 8 * 3600);
    earn(g);
    if (dt > 60 && g > 0) toast('다녀오셨어요', `${fmtTime(dt)} 동안 별빛 ${fmt(g)}을 모았어요.`);
    dt = 0;
  }
  S.playSec += dt;
  const nowMs = Date.now();
  if (S.buffs.some(b => b.until <= nowMs)) S.buffs = S.buffs.filter(b => b.until > nowMs);
  earn(perSecNow() * dt);
  if (now / 1000 - lastClickAt > COMBO_WINDOW) combo = 0;
  if (D.meteor && !meteorAlive && (meteorIn -= dt) <= 0) launchMeteor();
  if (panGoal && !follow) {
    const t = 1 - Math.exp(-dt * 8);
    view.x += (panGoal.x - view.x) * t; view.y += (panGoal.y - view.y) * t;
    applyView();
    if (Math.hypot(panGoal.x - view.x, panGoal.y - view.y) < 0.5) panGoal = null;
  }
  if (follow) {
    const t = 1 - Math.exp(-dt * 5);
    const ds = target.s - view.s;
    view.x += (target.x - view.x) * t; view.y += (target.y - view.y) * t; view.s += ds * t;
    applyView();
    if (Math.abs(ds) > 1e-4) placeNodes();
  }
  if (shakeT > 0) {
    shakeT = Math.max(0, shakeT - dt);
    const m = shakeT * 18;
    els.world.setAttribute('transform', `translate(${view.x + (Math.random() - 0.5) * m} ${view.y + (Math.random() - 0.5) * m}) scale(${view.s})`);
    if (shakeT === 0) applyView();
  }
  drawSky(dt, now);
  updateMoney(dt);
  positionCoach();
  uiAcc += dt; saveAcc += dt;
  if (uiAcc > 0.15) { uiAcc = 0; updateHud(); updateCoach(); }
  if (saveAcc > 5) { saveAcc = 0; save(); }
  requestAnimationFrame(frame);
}

// 처음 하는 사람 안내: 중심별 누르기 → 첫 별 밝히기
let coachTarget = null;
function updateCoach() {
  coachTarget = null;
  if (S.coachDone) { els.coach.hidden = true; return; }
  if (D.lit > 0) { S.coachDone = true; els.coach.hidden = true; return; }
  if (S.clicks < 6) { coachTarget = { x:0, y:0, core:true }; els.coach.textContent = '중심별을 눌러 별빛을 모아요'; }
  else {
    const list = affordableList();
    if (list.length) { coachTarget = list[0]; els.coach.textContent = narrow() ? '빛나는 별을 두 번 눌러 밝혀요' : '빛나는 별을 눌러 밝혀요'; }
    else { coachTarget = { x:0, y:0, core:true }; els.coach.textContent = `조금만 더! ${fmt(Math.min(...NODES.filter(n => !n.p && !n.req && !n.total).map(n => costOf(n, 0, D))))} 별빛이면 첫 별을 밝혀요`; }
  }
  els.coach.hidden = false;
}
function positionCoach() {
  if (!coachTarget || els.coach.hidden) return;
  const [x, y] = toScreen(coachTarget.x, coachTarget.y);
  const off = coachTarget.core ? coreR() + 14 : 34;

  els.coach.style.top = (y - off) + 'px';
}
function buildRays() {
  let html = '';
  for (let i = 0; i < 12; i++) {
    const a = (i * 30 + 15) * Math.PI / 180, len = i % 2 ? 96 : 132;
    html += `<line x1="${(Math.cos(a) * 30).toFixed(1)}" y1="${(Math.sin(a) * 30).toFixed(1)}" x2="${(Math.cos(a) * len).toFixed(1)}" y2="${(Math.sin(a) * len).toFixed(1)}" stroke-width="${i % 2 ? 2 : 3}"/>`;
  }
  els.rays.innerHTML = html;
}

function boot() {
  recompute();
  shownMoney = S.money;
  sel = null; combo = 0; lastStage = stageOf(D.lit);
  els.stageName.textContent = lastStage;

  paintAll();

  fitTarget();
  Object.assign(view, target);
  applyView(); placeNodes();
  meteorIn = 45;
  updateHud();
}
function start(data) {

  readColors();
  buildRays();
  paintSoundBtn();
  sizeSky();
  boot();
  const away = (Date.now() - S.lastSeen) / 1000;
  if (away > 60 && D.perSec > 0) {
    const secs = Math.min(away, 8 * 3600), g = D.perSec * secs * D.offline;
    earn(g);
    toast('위성들이 일하고 있었어요', `자리를 비운 ${fmtTime(secs)} 동안 별빛 ${fmt(g)}을 모았어요.`);
  }
  addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  addEventListener('pagehide', save);
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save:JSON.parse(JSON.stringify(S)) }));
  last = performance.now();
  requestAnimationFrame(frame);
}
window.claude && window.claude.hot && window.claude.hot.ready
  ? window.claude.hot.ready(start)
  : start(window.claude && window.claude.hot && window.claude.hot.data || {});
})();
