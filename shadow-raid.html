<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그림자 습격</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="밤마다 몰려오는 그림자 무리를 10분 동안 버텨 내는 생존 슈팅 게임. 저절로 쏘는 무기를 모아 키우고 진화시켜요.">
<meta name="theme-color" content="#0d0b18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  /* 레이아웃: 화면 전체가 전장 캔버스. 위 가장자리에 경험치 띠와 시계, 왼쪽 위에 무기 칸, 아래에 보스 체력. 메뉴와 카드는 가운데 뜬 판. */
  color-scheme:dark;
  --night:#0d0b18; --panel:#171329; --panel-2:#221c3d; --line:#3a3160; --line-2:#564a88;
  --text:#f5f1ff; --muted:#aaa0cc; --dim:#6f6696;
  --xp:#57e1ff; --gold:#ffc94d; --hot:#ff4d6a; --heal:#72f0a0; --evo:#ff9a3c; --violet:#8f6bff;
  --ink:#0a0716; --scrim:rgba(6,4,14,.74);
  --f-display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --t-xs:12px; --t-sm:13px; --t-md:15px; --t-lg:20px; --t-xl:30px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none}
body{background:var(--night); color:var(--text); font-family:var(--f-body); font-size:var(--t-md); line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; touch-action:manipulation; cursor:pointer; border:0; background:none; padding:0}
button:focus-visible{outline:2px solid var(--xp); outline-offset:3px}
button:disabled{cursor:default}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance; font-weight:400}
.num{font-variant-numeric:tabular-nums}
#cv{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair}

/* ---------- 게임 중 계기판 ---------- */
#hud{position:fixed; inset:0; pointer-events:none; z-index:5}
.xpbar{position:absolute; left:0; right:0; top:0; padding-top:env(safe-area-inset-top,0px); background:rgba(8,6,18,.82); border-bottom:1px solid var(--line)}
.xptrack{position:relative; height:12px; overflow:hidden}
.xptrack i{position:absolute; inset:0; transform-origin:left center; transform:scaleX(0); background:linear-gradient(90deg,#2b8cff,var(--xp)); box-shadow:0 0 14px rgba(87,225,255,.7)}
.hud-row{position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top,0px) + 20px); display:grid; grid-template-columns:1fr auto 1fr; align-items:start; gap:8px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud-left{display:flex; flex-direction:column; gap:6px; align-items:flex-start}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 9px; border-radius:8px; background:rgba(12,9,26,.72); border:1px solid rgba(160,140,255,.18); font-size:var(--t-sm); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.chip.lv{font-family:var(--f-display); font-weight:400; color:var(--xp); letter-spacing:.02em}
.coin-dot{width:12px; height:12px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff3b8,var(--gold) 55%,#b8801a); box-shadow:0 0 6px rgba(255,201,77,.6); flex:none}
.skull{width:13px; height:13px; flex:none}
#timer{font-family:var(--f-display); font-size:30px; line-height:1; letter-spacing:.03em; font-variant-numeric:tabular-nums; text-shadow:0 2px 0 var(--ink),0 0 18px rgba(143,107,255,.55); padding-top:2px}
#timer.late{color:var(--gold)}
.hud-right{justify-self:end}
.icon-btn{pointer-events:auto; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:rgba(12,9,26,.72); border:1px solid rgba(160,140,255,.25)}
.icon-btn:active{transform:scale(.94)}
.slots{display:flex; flex-direction:column; gap:4px}
.slot-row{display:flex; gap:4px}
.slot{position:relative; width:30px; height:30px; border-radius:7px; background:rgba(12,9,26,.72); border:1px solid rgba(160,140,255,.22)}
.slot img{position:absolute; inset:2px; width:24px; height:24px}
.slot b{position:absolute; right:-3px; bottom:-4px; min-width:14px; height:14px; padding:0 3px; border-radius:5px; background:var(--ink); border:1px solid var(--line-2); font-size:10px; line-height:12px; text-align:center; font-weight:700}
.slot.evo{border-color:var(--evo); box-shadow:0 0 10px rgba(255,154,60,.5)}
.slot.evo b{color:var(--evo); border-color:var(--evo)}
.slot.empty{background:rgba(12,9,26,.3); border-style:dashed; border-color:rgba(160,140,255,.16)}
.slot.sm{width:24px; height:24px; border-radius:6px}
.slot.sm img{width:18px; height:18px; inset:2px}
.slot.sm b{font-size:9px; height:12px; line-height:10px; min-width:12px}
#bossbar{position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); transform:translateX(-50%); width:min(520px,calc(100% - 32px)); text-align:center}
#bossname{font-family:var(--f-display); font-size:var(--t-lg); color:#ffd2db; text-shadow:0 2px 0 var(--ink),0 0 12px rgba(255,77,106,.7); letter-spacing:.04em}
.bb{height:14px; margin-top:4px; border-radius:7px; overflow:hidden; background:rgba(12,9,26,.85); border:1px solid rgba(255,77,106,.55)}
.bb i{display:block; height:100%; width:100%; transform-origin:left center; background:linear-gradient(90deg,#b3123a,var(--hot)); transition:transform .12s linear}
#toast{position:absolute; left:50%; top:calc(env(safe-area-inset-top,0px) + 112px); transform:translate(-50%,-8px); max-width:calc(100% - 32px); padding:8px 16px; border-radius:12px; background:rgba(12,9,26,.88); border:1px solid var(--line-2); font-weight:700; font-size:var(--t-sm); text-align:center; opacity:0; transition:opacity .25s, transform .25s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#toast.show{opacity:1; transform:translate(-50%,0)}
#toast.warn{border-color:var(--hot); color:#ffd7de}
#toast.good{border-color:var(--gold); color:#fff1c7}

/* 보스 경고 띠 */
#banner{position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top,0px) + 25%); z-index:6; pointer-events:none; text-align:center; padding-block:10px; background:repeating-linear-gradient(-45deg,rgba(255,77,106,.9) 0 18px,rgba(20,6,14,.92) 18px 36px); transform:scaleY(0); opacity:0}
#banner .in{display:inline-block; padding:6px 22px; background:rgba(20,6,14,.92); border-radius:10px}
#banner b{display:block; font-family:var(--f-display); font-weight:400; font-size:clamp(30px,8vw,52px); line-height:1.05; color:#fff; text-shadow:0 0 18px rgba(255,77,106,.9)}
#banner span{display:block; font-size:var(--t-md); font-weight:700; color:#ffc2cd; margin-top:2px}
#banner.show{animation:banner 2.8s ease forwards}
#banner.gold{background:repeating-linear-gradient(-45deg,rgba(255,201,77,.9) 0 18px,rgba(26,18,4,.92) 18px 36px)}
#banner.gold b{text-shadow:0 0 18px rgba(255,201,77,.9)}
#banner.gold span{color:#ffe7a8}
@keyframes banner{0%{transform:scaleY(0); opacity:0} 8%{transform:scaleY(1.08); opacity:1} 14%{transform:scaleY(1)} 82%{transform:scaleY(1); opacity:1} 100%{transform:scaleY(0); opacity:0}}

/* 가상 조이스틱 */
#joy{position:fixed; left:0; top:0; width:124px; height:124px; margin:-62px 0 0 -62px; border-radius:50%; border:2px solid rgba(255,255,255,.16); background:radial-gradient(rgba(143,107,255,.12),rgba(143,107,255,.03) 70%); pointer-events:none; z-index:4}
#joy i{position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,#c6bbff 55%,#7462d6); box-shadow:0 6px 16px rgba(0,0,0,.45)}

/* ---------- 메뉴 화면 ---------- */
.screen{position:fixed; inset:0; z-index:10; overflow-y:auto; display:flex; flex-direction:column; align-items:center; gap:18px; padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 22px); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); background:radial-gradient(120% 80% at 50% 40%,rgba(13,11,24,.15),rgba(13,11,24,.82))}
.topbar{width:min(100%,760px); display:flex; align-items:center; justify-content:space-between; gap:10px}
.wallet{display:inline-flex; align-items:center; gap:8px; height:38px; padding:0 14px; border-radius:12px; background:rgba(12,9,26,.8); border:1px solid var(--line); font-weight:900; font-size:var(--t-md); font-variant-numeric:tabular-nums}
.ghost{height:38px; padding:0 14px; border-radius:12px; background:rgba(12,9,26,.8); border:1px solid var(--line); font-weight:700; font-size:var(--t-sm); color:var(--muted)}
.ghost:hover{color:var(--text); border-color:var(--line-2)}
.menu-main{flex:1; width:min(100%,440px); display:flex; flex-direction:column; justify-content:center; gap:18px}
.eyebrow{font-size:var(--t-sm); font-weight:700; letter-spacing:.18em; color:var(--muted); text-align:center}
.logo{font-family:var(--f-display); font-size:clamp(64px,19vw,104px); line-height:.9; text-align:center; letter-spacing:-.01em; color:#fbf8ff}
.logo span{display:block}
.logo .a{text-shadow:5px 5px 0 #6b4dff,10px 10px 0 #3b2a96,15px 15px 0 #1c1450}
.logo .b{color:var(--hot); text-shadow:5px 5px 0 #8e1530,10px 10px 0 #4c0a1a,15px 15px 0 #22050c; margin-top:6px}
.stage{display:grid; grid-template-columns:40px minmax(0,1fr) 40px; align-items:center; gap:6px; padding:14px 8px; border-radius:18px; background:rgba(23,19,41,.9); border:1px solid var(--line); position:relative; overflow:hidden}
.stage::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; background:var(--stage-c,var(--violet))}
.stage .arrow{width:40px; height:56px; border-radius:12px; font-size:28px; line-height:1; color:var(--muted)}
.stage .arrow:hover:not(:disabled){color:var(--text); background:rgba(255,255,255,.05)}
.stage .arrow:disabled{opacity:.25}
.stage-info{text-align:center; min-width:0}
.stage-no{font-size:var(--t-xs); font-weight:900; letter-spacing:.2em; color:var(--stage-c,var(--violet))}
.stage-info h2{font-family:var(--f-display); font-size:28px; line-height:1.15}
.stage-info p{font-size:var(--t-sm); color:var(--muted); margin-top:4px}
.stage-info .best{color:var(--gold); font-weight:700}
.stage-info .lock{color:var(--hot); font-weight:700}
.start{height:68px; border-radius:18px; font-family:var(--f-display); font-size:32px; letter-spacing:.06em; color:#fff; background:linear-gradient(180deg,#ff6a7f,#e0264a 60%,#b0122f); box-shadow:0 6px 0 #6e0a1d,0 14px 30px rgba(255,77,106,.35); text-shadow:0 2px 0 rgba(0,0,0,.25)}
.start:hover:not(:disabled){filter:brightness(1.08)}
.start:active:not(:disabled){transform:translateY(4px); box-shadow:0 2px 0 #6e0a1d,0 8px 20px rgba(255,77,106,.3)}
.start:disabled{filter:grayscale(.85) brightness(.6)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.btn{height:52px; border-radius:14px; font-weight:900; font-size:var(--t-md); background:var(--panel-2); border:1px solid var(--line-2); display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 16px}
.btn:hover:not(:disabled){border-color:var(--xp)}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn.primary{background:linear-gradient(180deg,#5d8bff,#3b5ee0); border-color:#7fa0ff; color:#fff}
.btn.gold{background:linear-gradient(180deg,#ffd76b,#f0a92a); border-color:#ffe39a; color:#2a1a00}
.btn.danger{color:#ffc2cd; border-color:rgba(255,77,106,.5)}
.btn:disabled{opacity:.45}
.badge-dot{min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--gold); color:#2a1a00; font-size:11px; font-weight:900; line-height:20px}
.foot-note{font-size:var(--t-xs); color:var(--dim); text-align:center}

/* 강화 화면 */
.shop-head{width:min(100%,760px); display:flex; flex-direction:column; gap:4px}
.shop-head h2{font-family:var(--f-display); font-size:var(--t-xl)}
.shop-head p{color:var(--muted); font-size:var(--t-sm)}
.ups{width:min(100%,760px); display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:10px}
.up{display:grid; grid-template-columns:48px minmax(0,1fr); grid-template-rows:auto auto; gap:6px 12px; padding:12px; border-radius:16px; background:var(--panel); border:1px solid var(--line)}
.up img{width:48px; height:48px}
.up h3{font-size:var(--t-md); font-weight:900}
.up .val{font-size:var(--t-xs); color:var(--muted)}
.up .val b{color:var(--heal); font-weight:700}
.up-foot{grid-column:1/3; display:flex; align-items:center; justify-content:space-between; gap:8px}
.pips{display:flex; gap:3px; flex-wrap:wrap}
.pips i{width:12px; height:6px; border-radius:2px; background:var(--line-2)}
.pips i.on{background:var(--gold)}
.pips i.next{background:var(--xp); animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.buy{height:34px; padding:0 12px; border-radius:10px; font-weight:900; font-size:var(--t-sm); display:inline-flex; align-items:center; gap:6px; background:linear-gradient(180deg,#ffd76b,#f0a92a); color:#2a1a00; white-space:nowrap}
.buy:disabled{background:var(--panel-2); color:var(--dim)}
.buy:active:not(:disabled){transform:translateY(2px)}

/* ---------- 모달 ---------- */
.modal{position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); background:var(--scrim); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
.panel{position:relative; width:min(100%,720px); max-height:100%; overflow-y:auto; padding:22px; border-radius:22px; background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--line-2); box-shadow:0 20px 60px rgba(0,0,0,.5)}
.panel.narrow{width:min(100%,440px)}
.panel h2.title{font-family:var(--f-display); font-size:34px; line-height:1.1; text-align:center}
.panel .sub{text-align:center; color:var(--muted); font-size:var(--t-sm); margin-top:4px}
.stack{display:flex; flex-direction:column; gap:10px}

/* 레벨 업 */
.lv-panel{overflow:visible; background:none; border:0; box-shadow:none; padding:0; width:min(100%,820px)}
.lv-head{position:relative; text-align:center; padding-block:6px 14px}
.lv-head::before{content:""; position:absolute; left:50%; top:50%; width:340px; height:340px; margin:-170px 0 0 -170px; border-radius:50%; background:repeating-conic-gradient(rgba(255,201,77,.16) 0 10deg,transparent 10deg 20deg); -webkit-mask:radial-gradient(closest-side,#000 30%,transparent); mask:radial-gradient(closest-side,#000 30%,transparent); animation:spin 14s linear infinite; z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.lv-head h2{font-family:var(--f-display); font-size:44px; line-height:1; color:var(--gold); text-shadow:0 3px 0 #7a4b00,0 0 24px rgba(255,201,77,.6)}
.lv-head p{color:#e6dcff; font-size:var(--t-sm); margin-top:6px; font-weight:500}
.cards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.card{position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; padding:18px 14px 16px; min-width:0; text-align:center; border-radius:18px; background:linear-gradient(180deg,#2a2350,#1a1531); border:2px solid var(--line-2); box-shadow:0 10px 30px rgba(0,0,0,.4); transition:transform .12s ease, border-color .12s ease; animation:cardIn .32s ease both}
.card:nth-child(2){animation-delay:.06s} .card:nth-child(3){animation-delay:.12s} .card:nth-child(4){animation-delay:.18s}
@keyframes cardIn{from{transform:translateY(18px) scale(.96); opacity:0}}
.card:focus-visible{transform:translateY(-4px); border-color:var(--xp)}
@media (hover:hover){.card:hover{transform:translateY(-4px); border-color:var(--xp)}}
.card.locked{pointer-events:none}
.card img{width:68px; height:68px; flex:none}
.card .c-body{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0}
.card .c-head{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center}
.card .c-name{font-family:var(--f-display); font-size:22px; line-height:1.15}
.tag{font-size:11px; font-weight:900; padding:2px 8px; border-radius:99px; background:var(--xp); color:#04121a; white-space:nowrap}
.tag.p{background:var(--heal); color:#03170b}
.tag.e{background:var(--evo); color:#241000}
.tag.x{background:var(--gold); color:#241a00}
.card .c-desc{font-size:var(--t-sm); color:#e4ddff; line-height:1.45}
.card .c-hint{font-size:var(--t-xs); color:var(--muted)}
.card .c-hint b{color:var(--evo); font-weight:700}
.card .key{position:absolute; top:8px; left:10px; font-size:11px; font-weight:900; color:var(--dim)}
.card.evo{border-color:var(--evo); background:linear-gradient(180deg,#4a2a14,#22140e); box-shadow:0 0 0 1px rgba(255,154,60,.4),0 0 34px rgba(255,154,60,.35)}
.card.evo::after{content:""; position:absolute; inset:0; border-radius:16px; background:linear-gradient(110deg,transparent 30%,rgba(255,236,190,.22) 45%,transparent 60%); background-size:250% 100%; animation:shine 2.2s linear infinite; pointer-events:none}
@keyframes shine{from{background-position:120% 0} to{background-position:-130% 0}}
.lv-foot{display:flex; justify-content:center; gap:10px; margin-top:14px}
@media (max-width:640px){
  .cards{grid-template-columns:1fr; gap:10px}
  .card{flex-direction:row; text-align:left; align-items:center; padding:12px 14px; gap:12px}
  .card img{width:54px; height:54px}
  .card .c-body{align-items:flex-start}
  .card .c-head{justify-content:flex-start}
  .card .c-name{font-size:20px}
  .card .key{display:none}
  .lv-head h2{font-size:38px}
}

/* 보물 상자 */
.chest-stage{position:relative; height:150px; display:grid; place-items:center}
.chest-rays{position:absolute; width:300px; height:300px; border-radius:50%; background:repeating-conic-gradient(rgba(255,214,107,.28) 0 8deg,transparent 8deg 22deg); -webkit-mask:radial-gradient(closest-side,#000 25%,transparent); mask:radial-gradient(closest-side,#000 25%,transparent); opacity:0; transform:scale(.4); transition:opacity .4s, transform .6s}
.chest{position:relative; width:118px; height:92px}
.chest .base{position:absolute; left:0; right:0; bottom:0; height:58px; border-radius:6px 6px 12px 12px; background:linear-gradient(180deg,#a45a1e,#6e3510); border:3px solid #ffcf5a; box-shadow:inset 0 -10px 0 rgba(0,0,0,.2)}
.chest .lid{position:absolute; left:-4px; right:-4px; top:6px; height:36px; border-radius:30px 30px 6px 6px; background:linear-gradient(180deg,#c4702a,#8a4416); border:3px solid #ffcf5a; transform-origin:50% 100%; transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.chest .lock{position:absolute; left:50%; top:30px; width:20px; height:24px; margin-left:-10px; border-radius:4px; background:#ffe08a; border:2px solid #7a4b00; z-index:2; transition:opacity .2s}
.chest-stage.shake .chest{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:translate(-3px,1px) rotate(-3deg)} 75%{transform:translate(3px,-1px) rotate(3deg)}}
.chest-stage.open .lid{transform:translateY(-30px) rotate(-14deg)}
.chest-stage.open .lock{opacity:0}
.chest-stage.open .chest-rays{opacity:1; transform:scale(1); animation:spin 9s linear infinite}
.rewards{display:flex; flex-direction:column; gap:8px; margin-top:8px}
.reward{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px; background:rgba(255,255,255,.05); border:1px solid var(--line-2); animation:cardIn .3s ease both}
.reward.evo{border-color:var(--evo); background:rgba(255,154,60,.12)}
.reward img{width:44px; height:44px; flex:none}
.reward div{min-width:0}
.reward b{font-weight:900}

<script>
'use strict';
(() => {
/* ============================================================
   그림자 습격: 10분 동안 몰려오는 그림자 무리를 버티는 생존 슈팅
   ============================================================ */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const fmtNum = n => Math.round(n).toLocaleString('ko-KR');
// 받침에 따라 조사 고르기: josa('수류탄', '이', '가') → '수류탄이'
const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1); return w + (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 ? a : b); };
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`; }
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const isTouch = (() => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();

/* ---------- 저장 ---------- */
const SAVE_KEY = 'shadow-raid-v1';
const DEFAULT_SAVE = () => ({ coins: 0, up: {}, unlocked: 1, stage: 0, best: {}, runs: 0, set: { sfx: true, music: true, nums: true, shake: !reduceMotion } });
function loadSave() {
  const base = DEFAULT_SAVE();
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s === 'object') return { ...base, ...s, up: { ...(s.up || {}) }, best: { ...(s.best || {}) }, set: { ...base.set, ...(s.set || {}) } };
  } catch (e) { /* 저장소를 못 쓰면 이번 세션만 */ }
  return base;
}
let save = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* 무시 */ } }

/* ---------- 소리 (Web Audio로 직접 합성) ---------- */
const Sfx = (() => {
  let ac = null, master, sfxG, musG, noiseBuf, musTimer = 0, nextNote = 0, step = 0;
  const last = {};
  let gemChain = 0, gemT = 0;
  let intensity = 0;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { ac = new AC(); } catch (e) { ac = null; return; }
    master = ac.createGain(); master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
    master.connect(comp); comp.connect(ac.destination);
    sfxG = ac.createGain(); sfxG.gain.value = save.set.sfx ? 0.5 : 0; sfxG.connect(master);
    musG = ac.createGain(); musG.gain.value = save.set.music ? 0.2 : 0; musG.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const can = (name, gap) => {
    if (!ac || !save.set.sfx) return false;
    const t = ac.currentTime; if (last[name] !== undefined && t - last[name] < gap) return false;
    last[name] = t; return true;
  };
  function tone(f, dur, type = 'sine', vol = .3, slide = 0, when = 0, dest = sfxG) {
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol = .3, type = 'lowpass', freq = 1200, when = 0, dest = sfxG, q = 0.7) {
    const t = ac.currentTime + when, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  }
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  // 배경음악: 가단조 4마디 진행에 베이스·킥·하이햇. 보스전에선 스네어와 아르페지오가 더해져요.
  const PROG = [57, 53, 48, 55];
  const BASS = [0, null, 12, 0, null, 12, 0, 7];
  const ARP = [0, 3, 7, 12, 7, 3, 0, 3];
  function schedule() {
    if (!ac) return;
    const spb = 60 / (intensity ? 132 : 116) / 2;
    while (nextNote < ac.currentTime + 0.2) {
      const bar = Math.floor(step / 8) % 4, s8 = step % 8, root = PROG[bar] - 12;
      const t = nextNote - ac.currentTime;
      if (t >= 0) {
        const b = BASS[s8];
        if (b !== null) tone(mtof(root + b), spb * 0.9, 'triangle', 0.42, 0, t, musG);
        if (s8 === 0 || s8 === 4) { tone(120, 0.16, 'sine', 0.7, 0.35, t, musG); }
        if (s8 % 2 === 1) noise(0.04, 0.12, 'highpass', 7000, t, musG);
        if (intensity && (s8 === 2 || s8 === 6)) noise(0.12, 0.28, 'bandpass', 1800, t, musG);
        if (intensity || bar % 2 === 1) tone(mtof(root + 24 + ARP[s8]), spb * 0.8, 'square', intensity ? 0.06 : 0.035, 0, t, musG);
      }
      step++; nextNote += spb;
    }
  }
  return {
    init,
    get ready() { return !!ac; },
    setSfx(on) { if (sfxG) sfxG.gain.setTargetAtTime(on ? 0.5 : 0, ac.currentTime, 0.02); },
    setMusic(on) { if (musG) musG.gain.setTargetAtTime(on ? 0.2 : 0, ac.currentTime, 0.05); },
    musicStart() { if (!ac || musTimer) return; nextNote = ac.currentTime + 0.1; musTimer = setInterval(schedule, 60); },
    musicStop() { clearInterval(musTimer); musTimer = 0; },
    setIntensity(v) { intensity = v; },

    return `<div>${d.name} Lv ${MAX_LV} + ${p.name} → <b>${d.evoName}</b> ${ready ? '<span class="ready">· 다음 레벨 업에 나와요</span>' : `· 지금 Lv ${w.lv}${run.pass[d.pair] ? `, ${p.name} 있음` : `, ${p.name} 필요`}`}</div>`;
  }).join('');
  quitArm = false; el.quitBtn.textContent = '포기하기';
  el.pauseModal.hidden = false; syncToggles();
}
function resumeFromPause() { if (state !== 'pause') return; el.pauseModal.hidden = true; Sfx.init(); if (save.set.music) Sfx.musicStart(); resumePlay(false); }
el.pauseBtn.addEventListener('click', pauseGame);
el.resumeBtn.addEventListener('click', resumeFromPause);
el.quitBtn.addEventListener('click', () => {
  if (!quitArm) { quitArm = true; el.quitBtn.textContent = '한 번 더 누르면 끝나요'; return; }
  el.pauseModal.hidden = true; showResult(false);
});

/* 결과 */
function showResult(win) {
  state = 'result'; joyReset(); Sfx.musicStop(); Sfx.setIntensity(0);
  const st = run.st, timeBonus = Math.round(Math.floor(Math.min(run.t, STAGE_TIME) / 60) * 10 * st.gold), clearBonus = win ? Math.round(150 * st.gold) : 0;
  const picked = Math.round(run.coins), earned = picked + timeBonus + clearBonus;
  save.coins += earned;
  const b = save.best[run.si] || { time: 0, kills: 0, clear: false }, newBest = run.t > b.time + .5;
  save.best[run.si] = { time: Math.max(b.time, run.t), kills: Math.max(b.kills, run.kills), clear: b.clear || win };
  let unlockMsg = '';
  if (win && run.si + 1 < STAGES.length && save.unlocked < run.si + 2) { save.unlocked = run.si + 2; save.stage = run.si + 1; unlockMsg = ` · 새 스테이지 ${josa(STAGES[run.si + 1].name, '이', '가')} 열렸어요!`; }
  persist();
  el.resTitle.textContent = win ? '새벽이 밝았어요!' : '쓰러졌어요';
  el.resTitle.className = 'title result-title ' + (win ? 'win' : 'lose');
  el.resSub.textContent = `${st.name}${newBest ? ' · 최고 기록!' : ''}${unlockMsg}`;
  el.rTime.textContent = fmtTime(run.t); el.rKills.textContent = fmtNum(run.kills); el.rLv.textContent = run.lv; el.rCoins.textContent = '+' + fmtNum(earned);
  el.rEarn.innerHTML = `<span>주운 코인 <b>${fmtNum(picked)}</b></span><span>버틴 시간 <b>+${fmtNum(timeBonus)}</b></span>${win ? `<span>클리어 <b>+${fmtNum(clearBonus)}</b></span>` : ''}<span>가진 코인 <b>${fmtNum(save.coins)}</b></span>`;
  const rows = run.weapons.map(w => ({ w, v: run.dmgBy[w.id] || 0 })).sort((a, b) => b.v - a.v), top = Math.max(1, ...rows.map(r => r.v));
  el.rDmg.innerHTML = rows.map(({ w, v }) => `<div class="dmg-row"><img src="${iconURL(w.id, w.evo)}" alt=""><span class="nm">${w.evo ? WEAPONS[w.id].evoName : WEAPONS[w.id].name}</span><span class="bar"><i style="width:${(v / top * 100).toFixed(1)}%"></i></span><span class="v">${fmtNum(v)}</span></div>`).join('');
  el.resultModal.hidden = false;
}
el.againBtn.addEventListener('click', () => { el.resultModal.hidden = true; startRun(); });
el.homeBtn.addEventListener('click', showMenu);

/* 메뉴 단추 */
el.startBtn.addEventListener('click', () => { if (save.stage + 1 <= save.unlocked) startRun(); });
el.stPrev.addEventListener('click', () => { save.stage = Math.max(0, save.stage - 1); persist(); critters.length = 0; renderMenu(); });
el.stNext.addEventListener('click', () => { save.stage = Math.min(STAGES.length - 1, save.stage + 1); persist(); critters.length = 0; renderMenu(); });
el.shopBtn.addEventListener('click', () => { el.menu.hidden = true; el.shop.hidden = false; renderShop(); });
el.shopBack.addEventListener('click', () => { el.shop.hidden = true; el.menu.hidden = false; renderMenu(); });
el.ups.addEventListener('click', e => {
  const b = e.target.closest('.buy'); if (!b || b.disabled) return;
  const m = META.find(x => x.id === b.dataset.id), l = save.up[m.id] || 0, cost = metaCost(m, l);
  if (l >= m.max || save.coins < cost) return;
  save.coins -= cost; save.up[m.id] = l + 1; persist(); Sfx.init(); Sfx.select(); renderShop();
});
el.setBtn.addEventListener('click', () => { syncToggles(); resetArm = false; el.resetBtn.textContent = '기록 모두 지우기'; el.setModal.hidden = false; });
el.setClose.addEventListener('click', () => { el.setModal.hidden = true; renderMenu(); });
let resetArm = false;
el.resetBtn.addEventListener('click', () => {
  if (!resetArm) { resetArm = true; el.resetBtn.textContent = '코인·강화·기록이 모두 지워져요. 한 번 더 누르세요'; return; }
  const set = save.set; save = DEFAULT_SAVE(); save.set = set; persist(); resetArm = false; el.resetBtn.textContent = '지웠어요'; renderMenu();
});
document.querySelectorAll('.toggle[data-set]').forEach(t => t.addEventListener('click', () => {
  const k = t.dataset.set; save.set[k] = !save.set[k]; persist(); syncToggles();
  Sfx.init();
  if (k === 'sfx') Sfx.setSfx(save.set.sfx);
  if (k === 'music') { Sfx.setMusic(save.set.music); if (!save.set.music) Sfx.musicStop(); else if (run && state === 'play') Sfx.musicStart(); }
}));
function openHelp(kind) {
  if (kind === 'codex') {
    el.helpTitle.textContent = '무기 도감';
    el.helpBody.innerHTML = `<p>무기는 6칸, 보조 장비도 6칸까지 가질 수 있어요. 무기를 Lv ${MAX_LV}까지 올리고 짝이 되는 보조 장비를 갖고 있으면, 다음 레벨 업이나 보물 상자에서 <b>진화</b>할 수 있어요.</p>
      <div class="evo-table">${W_IDS.map(id => { const d = WEAPONS[id]; return `<div class="codex-item"><div class="build-item"><img src="${iconURL(id)}" alt=""><div><b>${d.name}</b><span style="white-space:normal">${d.lv[0]}</span></div></div>
        <div class="evo-row"><img src="${iconURL(d.pair)}" alt=""><span class="op">${josa(PASSIVES[d.pair].name, '과', '와')} 함께 →</span><img src="${iconURL(id, true)}" alt=""><b>${d.evoName}</b><p>${d.evoInfo}</p></div></div>`; }).join('')}</div>
      <h3>보조 장비</h3><div class="help-items">${P_IDS.map(id => `<div><img src="${iconURL(id)}" alt=""><span><b style="color:var(--text)">${PASSIVES[id].name}</b><br>${PASSIVES[id].info}</span></div>`).join('')}</div>`;
  } else {
    el.helpTitle.textContent = '하는 법';
    el.helpBody.innerHTML = `<div><h3>목표</h3><ul><li>그림자들이 사방에서 몰려와요. <b>10분</b>을 버티면 마지막 보스가 나와요. 보스를 쓰러뜨리면 새벽이 오고 스테이지를 깨요.</li><li>5분에는 중간 보스, 2분마다 정예 몬스터가 나와요. 둘 다 <b>보물 상자</b>를 떨어뜨려요.</li></ul></div>
      <div><h3>움직이기</h3><ul><li>PC: <b>WASD</b>나 <b>방향키</b>. 마우스로 끌어도 돼요. <b>Esc</b>나 <b>P</b>로 멈춰요.</li><li>폰: 화면 아무 곳이나 누른 채 끌면 그쪽으로 움직여요.</li><li>공격은 무기가 알아서 해요. 피하고, 줍고, 고르기만 하면 돼요.</li></ul></div>
      <div><h3>성장</h3><ul><li>적을 쓰러뜨리면 나오는 <b>경험치 보석</b>을 주워 레벨을 올려요. 레벨이 오르면 무기나 보조 장비를 하나 골라요(PC는 숫자 1·2·3).</li><li>무기를 Lv ${MAX_LV}까지 키우고 짝 장비를 갖고 있으면 <b>진화</b>해요. 짝은 무기 도감에서 볼 수 있어요.</li><li>판이 끝나면 코인이 쌓여요. 메인 화면의 <b>강화</b>에서 영구 능력을 올려요.</li></ul></div>
      <div><h3>아이템</h3><div class="help-items">
        <div><img src="${iconURL('gem')}" alt=""><span>경험치 보석. 파랑 → 초록 → 분홍 순으로 많이 줘요</span></div>
        <div><img src="${iconURL('medkit')}" alt=""><span>구급상자. 체력 30% 회복</span></div>
        <div><img src="${iconURL('magnet')}" alt=""><span>자석. 흩어진 보석을 모두 끌어와요</span></div>
        <div><img src="${iconURL('bomb')}" alt=""><span>폭탄. 화면 안의 적을 날려 버려요</span></div>
        <div><img src="${iconURL('chest')}" alt=""><span>보물 상자. 무기·장비를 키우거나 진화시켜요</span></div>
        <div><img src="${iconURL('coin')}" alt=""><span>코인. 강화에 써요</span></div></div>
        <ul><li>가끔 나타나는 <b>나무 상자</b>를 부수면 구급상자·자석·폭탄이 나와요.</li></ul></div>`;
  }
  el.helpModal.hidden = false; el.helpBody.parentElement.scrollTop = 0;
}
el.helpBtn.addEventListener('click', () => openHelp('help'));
el.codexBtn.addEventListener('click', () => openHelp('codex'));
el.helpClose.addEventListener('click', () => { el.helpModal.hidden = true; });

/* ============================================================
   입력
   ============================================================ */
const JOY_R = 52;
function joyReset() { joy.active = false; joy.id = -1; joy.vx = joy.vy = joy.mag = 0; el.joy.hidden = true; }
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || joy.active) return;
  joy.active = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.vx = joy.vy = joy.mag = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 무시 */ }
  el.joy.hidden = false; el.joy.style.transform = `translate(${joy.ox}px,${joy.oy}px)`; el.joyKnob.style.transform = '';
});
cv.addEventListener('pointermove', e => {
  if (!joy.active || e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy, d = Math.hypot(dx, dy);
  if (d > JOY_R) { joy.ox += dx / d * (d - JOY_R); joy.oy += dy / d * (d - JOY_R); dx = e.clientX - joy.ox; dy = e.clientY - joy.oy; d = JOY_R; el.joy.style.transform = `translate(${joy.ox}px,${joy.oy}px)`; }
  const m = d < 6 ? 0 : Math.min(1, d / (JOY_R * .7));
  joy.mag = m; joy.vx = d ? dx / d * m : 0; joy.vy = d ? dy / d * m : 0;
  el.joyKnob.style.transform = `translate(${dx}px,${dy}px)`;
});
const joyEnd = e => { if (e.pointerId === joy.id) joyReset(); };
cv.addEventListener('pointerup', joyEnd); cv.addEventListener('pointercancel', joyEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (state === 'play' && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if (e.repeat) return;
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (state === 'play') pauseGame(); else if (state === 'pause') resumeFromPause();
    else if (!el.helpModal.hidden) el.helpModal.hidden = true; else if (!el.setModal.hidden) { el.setModal.hidden = true; renderMenu(); }
  }
  if (state === 'levelup') {
    const n = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[e.code];
    if (n !== undefined) pickChoice(n);
    if (e.code === 'KeyR' && !el.rerollBtn.hidden && !el.rerollBtn.disabled) el.rerollBtn.click();
  }
  if (state === 'chest' && (e.code === 'Enter' || e.code === 'Space') && !el.chestOk.hidden) { e.preventDefault(); el.chestOk.click(); }
  if (state === 'menu' && e.code === 'Enter' && !el.menu.hidden && el.setModal.hidden && el.helpModal.hidden && document.activeElement === document.body) el.startBtn.click();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); joyReset(); pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* ============================================================
   반복
   ============================================================ */
let lastT = performance.now();
const perf = { upd: 0, ren: 0 };
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0; if (dt > .1) dt = .1;
  const t0 = performance.now();
  if (state === 'play' && run) {
    let sim = dt * timeScale, guard = 0;
    while (sim > 1e-6 && state === 'play' && guard++ < 60) { const s = Math.min(sim, 1 / 60); update(s); sim -= s; }
  }
  const t1 = performance.now();
  if (run) hudUpdate();
  render(dt);
  perf.upd = perf.upd * .95 + (t1 - t0) * .05; perf.ren = perf.ren * .95 + (performance.now() - t1) * .05;
  requestAnimationFrame(frame);
}
resize();
addEventListener('resize', resize);
renderMenu(); syncToggles();
if (isTouch) $('#footNote').textContent = '화면 아무 곳이나 누른 채 끌어서 움직여요';
try { document.fonts && document.fonts.load('400 20px "Black Han Sans"'); } catch (e) { /* 무시 */ }
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });

// 자동 시험용 연결 고리 (게임 진행에는 쓰지 않아요)
window.__shadowRaid = {
  get run() { return run; }, get state() { return state; }, get enemies() { return enemies; }, get pickups() { return pickups; }, get eshots() { return eshots; }, player,
  setTimeScale(v) { timeScale = v; }, setMove(x, y) { botMove = x === null ? null : { x, y }; }, pick: i => { cardLock = 0; pickChoice(i); },
  fastForward(sec, tick) { const n = Math.round(sec * 60); for (let i = 0; i < n && state !== 'result'; i++) { if (tick) tick(); if (state === 'play') { update(1 / 60); if (run) hudUpdate(); } } },
  chestOk: () => el.chestOk.click(), start: () => startRun(), save: () => save, perf,
};
})();
</script>
</body>
</html>
